<script>

/* =========================================================
   基本設定
   ========================================================= */

const MIN_GRID = 4;
const MAX_GRID = 20;

/*
    ゲームで使用されている代表的な10色。

    スクリーンショットのアンチエイリアスや
    圧縮による色の変化を考慮して、
    完全一致ではなく「近い色」として判定します。
*/

const GAME_COLORS = [

    {
        id:0,
        name:"黄色",
        r:232,
        g:190,
        b:66
    },

    {
        id:1,
        name:"水色・青緑",
        r:75,
        g:176,
        b:175
    },

    {
        id:2,
        name:"赤",
        r:210,
        g:112,
        b:115
    },

    {
        id:3,
        name:"紫",
        r:146,
        g:114,
        b:210
    },

    {
        id:4,
        name:"濃いピンク",
        r:235,
        g:124,
        b:182
    },

    {
        id:5,
        name:"薄いピンク",
        r:243,
        g:171,
        b:201
    },

    {
        id:6,
        name:"青灰色",
        r:161,
        g:188,
        b:213
    },

    {
        id:7,
        name:"茶色",
        r:178,
        g:117,
        b:73
    },

    {
        id:8,
        name:"緑",
        r:166,
        g:211,
        b:139
    },

    {
        id:9,
        name:"水色",
        r:100,
        g:180,
        b:220
    }

];


/*
    色判定の許容範囲

    数字を大きくすると色を拾いやすくなります。
    小さくすると誤認識が減ります。

    現在はスクリーンショット向けに少し広め。
*/

const COLOR_TOLERANCE = 75;


/* =========================================================
   DOM
   ========================================================= */

const imageInput =
    document.getElementById("imageInput");

const solveButton =
    document.getElementById("solveButton");

const clearButton =
    document.getElementById("clearButton");

const previewArea =
    document.getElementById("previewArea");

const resultArea =
    document.getElementById("resultArea");

const statusElement =
    document.getElementById("status");

const paletteArea =
    document.getElementById("paletteArea");


let loadedImage = null;


/* =========================================================
   カラーパレット表示
   ========================================================= */

function showPalette(){

    paletteArea.innerHTML = "";

    const list =
        document.createElement("div");

    list.className =
        "color-list";


    GAME_COLORS.forEach(color => {

        const item =
            document.createElement("div");

        item.className =
            "color-item";


        const dot =
            document.createElement("span");

        dot.className =
            "color-dot";

        dot.style.background =
            `rgb(${color.r},${color.g},${color.b})`;


        const text =
            document.createElement("span");

        text.textContent =
            `${color.name} #${toHex(color.r)}${toHex(color.g)}${toHex(color.b)}`;


        item.appendChild(dot);
        item.appendChild(text);

        list.appendChild(item);

    });


    paletteArea.appendChild(list);
}


function toHex(value){

    return value
        .toString(16)
        .padStart(2,"0")
        .toUpperCase();

}


showPalette();


/* =========================================================
   ステータス
   ========================================================= */

function setStatus(
    message,
    type = ""
){

    statusElement.textContent =
        message;

    statusElement.className =
        "status " + type;

}


/* =========================================================
   画像選択
   ========================================================= */

imageInput.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files &&
            event.target.files[0];


        if(!file){

            loadedImage =
                null;

            solveButton.disabled =
                true;

            previewArea.innerHTML =
                "";

            setStatus(
                "画像が選択されていません。"
            );

            return;
        }


        if(
            !file.type.startsWith("image/")
        ){

            loadedImage =
                null;

            solveButton.disabled =
                true;

            setStatus(
                "画像ファイルを選択してください。",
                "error"
            );

            return;
        }


        setStatus(
            "画像を読み込んでいます..."
        );


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                const img =
                    new Image();


                img.onload =
                    function(){

                        loadedImage =
                            img;


                        previewArea.innerHTML =
                            "";


                        const preview =
                            document.createElement(
                                "img"
                            );


                        preview.src =
                            e.target.result;

                        preview.alt =
                            "選択した画像";


                        const info =
                            document.createElement(
                                "div"
                            );


                        info.className =
                            "image-info";


                        info.textContent =
                            `${file.name}　${img.naturalWidth} × ${img.naturalHeight}px`;


                        previewArea.appendChild(
                            preview
                        );

                        previewArea.appendChild(
                            info
                        );


                        solveButton.disabled =
                            false;


                        setStatus(
                            "画像を読み込みました。\n「読み取って解く」を押してください。",
                            "success"
                        );

                    };


                img.onerror =
                    function(){

                        loadedImage =
                            null;

                        solveButton.disabled =
                            true;

                        setStatus(
                            "画像を読み込めませんでした。",
                            "error"
                        );

                    };


                img.src =
                    e.target.result;

            };


        reader.onerror =
            function(){

                loadedImage =
                    null;

                solveButton.disabled =
                    true;

                setStatus(
                    "画像ファイルの読み込みに失敗しました。",
                    "error"
                );

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================================
   クリア
   ========================================================= */

clearButton.addEventListener(
    "click",
    function(){

        imageInput.value =
            "";

        loadedImage =
            null;

        solveButton.disabled =
            true;

        previewArea.innerHTML =
            "";

        resultArea.innerHTML =
            '<div class="small">画像を読み取ると、ここに盤面が表示されます。</div>';

        setStatus(
            "画像を選択してください。"
        );

    }
);


/* =========================================================
   RGB距離
   ========================================================= */

function colorDistance(
    r,
    g,
    b,
    color
){

    const dr =
        r - color.r;

    const dg =
        g - color.g;

    const db =
        b - color.b;


    return Math.sqrt(
        dr * dr +
        dg * dg +
        db * db
    );

}


/* =========================================================
   RGB → ゲームカラー
   ========================================================= */

function nearestGameColor(
    r,
    g,
    b
){

    let best =
        null;

    let bestDistance =
        Infinity;


    for(
        const color of GAME_COLORS
    ){

        const distance =
            colorDistance(
                r,
                g,
                b,
                color
            );


        if(
            distance <
            bestDistance
        ){

            bestDistance =
                distance;

            best =
                color;

        }

    }


    if(
        bestDistance >
        COLOR_TOLERANCE
    ){

        return null;
    }


    return {

        color:best,

        distance:bestDistance

    };

}


/* =========================================================
   画像を解析用サイズに縮小
   ========================================================= */

function createAnalysisCanvas(
    image
){

    const maxWidth =
        1400;

    const maxHeight =
        2200;


    let width =
        image.naturalWidth;

    let height =
        image.naturalHeight;


    const scale =
        Math.min(
            1,
            maxWidth / width,
            maxHeight / height
        );


    width =
        Math.max(
            1,
            Math.round(width * scale)
        );


    height =
        Math.max(
            1,
            Math.round(height * scale)
        );


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    return canvas;

}


/* =========================================================
   色付きピクセルマスク
   ========================================================= */

function createColorMask(
    imageData
){

    const width =
        imageData.width;

    const height =
        imageData.height;

    const data =
        imageData.data;


    const mask =
        new Uint8Array(
            width * height
        );


    for(
        let y = 0;
        y < height;
        y++
    ){

        for(
            let x = 0;
            x < width;
            x++
        ){

            const index =
                (y * width + x) * 4;


            const r =
                data[index];

            const g =
                data[index + 1];

            const b =
                data[index + 2];


            const match =
                nearestGameColor(
                    r,
                    g,
                    b
                );


            if(match){

                mask[
                    y * width + x
                ] = 1;

            }

        }

    }


    return mask;

}


/* =========================================================
   連結成分検出
   ========================================================= */

function findColorComponents(
    mask,
    width,
    height
){

    const visited =
        new Uint8Array(
            width * height
        );


    const components =
        [];


    /*
       BFS用配列

       大きな配列を毎回作らず、
       使い回します。
    */

    const queue =
        new Int32Array(
            width * height
        );


    const directions = [

        [-1,0],
        [1,0],
        [0,-1],
        [0,1]

    ];


    for(
        let startY = 0;
        startY < height;
        startY++
    ){

        for(
            let startX = 0;
            startX < width;
            startX++
        ){

            const startIndex =
                startY * width +
                startX;


            if(
                !mask[startIndex] ||
                visited[startIndex]
            ){

                continue;
            }


            let head =
                0;

            let tail =
                0;


            queue[tail++] =
                startIndex;


            visited[startIndex] =
                1;


            let minX =
                startX;

            let maxX =
                startX;

            let minY =
                startY;

            let maxY =
                startY;

            let area =
                0;


            while(
                head < tail
            ){

                const index =
                    queue[head++];


                const x =
                    index % width;

                const y =
                    Math.floor(
                        index / width
                    );


                area++;


                if(x < minX)
                    minX = x;

                if(x > maxX)
                    maxX = x;

                if(y < minY)
                    minY = y;

                if(y > maxY)
                    maxY = y;


                for(
                    const [dx,dy]
                    of directions
                ){

                    const nx =
                        x + dx;

                    const ny =
                        y + dy;


                    if(
                        nx < 0 ||
                        nx >= width ||
                        ny < 0 ||
                        ny >= height
                    ){

                        continue;
                    }


                    const ni =
                        ny * width +
                        nx;


                    if(
                        mask[ni] &&
                        !visited[ni]
                    ){

                        visited[ni] =
                            1;

                        queue[tail++] =
                            ni;

                    }

                }

            }


            const componentWidth =
                maxX - minX + 1;

            const componentHeight =
                maxY - minY + 1;


            /*
               小さすぎるものは
               ノイズとして無視
            */

            if(
                area < 80
            ){

                continue;
            }


            /*
               横長・縦長のUI要素を除外
            */

            const ratio =
                componentWidth /
                componentHeight;


            if(
                ratio < 0.55 ||
                ratio > 1.45
            ){

                continue;
            }


            components.push({

                x:minX,

                y:minY,

                width:componentWidth,

                height:componentHeight,

                area,

                centerX:
                    (minX + maxX) / 2,

                centerY:
                    (minY + maxY) / 2

            });

        }

    }


    return components;

}


/* =========================================================
   中央値
   ========================================================= */

function median(
    values
){

    if(
        values.length === 0
    ){

        return 0;
    }


    const sorted =
        [...values].sort(
            (a,b) => a-b
        );


    const middle =
        Math.floor(
            sorted.length / 2
        );


    if(
        sorted.length % 2
    ){

        return sorted[middle];

    }


    return (
        sorted[middle - 1] +
        sorted[middle]
    ) / 2;

}


/* =========================================================
   座標をグループ化
   ========================================================= */

function clusterCoordinates(
    values,
    gap
){

    const sorted =
        [...values].sort(
            (a,b) => a-b
        );


    if(
        sorted.length === 0
    ){

        return [];

    }


    const groups =
        [];


    let current =
        [sorted[0]];


    for(
        let i = 1;
        i < sorted.length;
        i++
    ){

        const previous =
            sorted[i - 1];

        const currentValue =
            sorted[i];


        if(
            currentValue -
            previous
            <= gap
        ){

            current.push(
                currentValue
            );

        }else{

            groups.push(
                current
            );

            current =
                [currentValue];

        }

    }


    groups.push(
        current
    );


    return groups.map(
        group => ({
            center:
                group.reduce(
                    (a,b) => a+b,
                    0
                ) / group.length,

            count:
                group.length
        })
    );

}


/* =========================================================
   均等なグリッド候補を評価
   ========================================================= */

function evaluateGrid(
    components,
    xGroups,
    yGroups,
    xStart,
    yStart,
    size,
    tolerance
){

    let found =
        0;


    const cells =
        [];


    for(
        let row = 0;
        row < size;
        row++
    ){

        const rowCells =
            [];


        for(
            let col = 0;
            col < size;
            col++
        ){

            const targetX =
                xGroups[
                    xStart + col
                ].center;

            const targetY =
                yGroups[
                    yStart + row
                ].center;


            let best =
                null;

            let bestDistance =
                Infinity;


            for(
                const component
                of components
            ){

                const dx =
                    component.centerX -
                    targetX;

                const dy =
                    component.centerY -
                    targetY;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if(
                    distance <
                    bestDistance
                ){

                    bestDistance =
                        distance;

                    best =
                        component;

                }

            }


            if(
                best &&
                bestDistance <=
                tolerance
            ){

                found++;

                rowCells.push({

                    component:best,

                    distance:bestDistance,

                    centerX:targetX,

                    centerY:targetY

                });

            }else{

                rowCells.push(null);

            }

        }


        cells.push(
            rowCells
        );

    }


    /*
       グリッドの間隔が不自然ではないか確認
    */

    let spacingPenalty =
        0;


    for(
        let i = 1;
        i < size;
        i++
    ){

        const dx =
            xGroups[
                xStart + i
            ].center -
            xGroups[
                xStart + i - 1
            ].center;


        const dy =
            yGroups[
                yStart + i
            ].center -
            yGroups[
                yStart + i - 1
            ].center;


        spacingPenalty +=
            Math.abs(dx - dy);

    }


    return {

        found,

        cells,

        score:
            found * 100 -
            spacingPenalty

    };

}


/* =========================================================
   盤面検出
   ========================================================= */

function detectBoard(
    canvas
){

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    /*
       ① 色付きピクセルを探す
    */

    const mask =
        createColorMask(
            imageData
        );


    /*
       ② 色のつながった部分を探す
    */

    let components =
        findColorComponents(
            mask,
            canvas.width,
            canvas.height
        );


    if(
        components.length < 16
    ){

        throw new Error(
            "色付きマスを十分に検出できませんでした。\n" +
            "ゲーム盤面全体が写った画像を使用してください。"
        );

    }


    /*
       ③ マスらしい大きさを推定

       面積の大きい順にして、
       盤面のマスが優先されるようにする。
    */

    components.sort(
        (a,b) =>
            b.area - a.area
    );


    /*
       大きすぎるUI要素を除外するため、
       正方形に近いものだけを候補にする。
    */

    let squareCandidates =
        components.filter(
            component => {

                const ratio =
                    component.width /
                    component.height;


                return (
                    ratio >= 0.70 &&
                    ratio <= 1.30 &&
                    component.width >= 8 &&
                    component.height >= 8
                );

            }
        );


    if(
        squareCandidates.length < 16
    ){

        throw new Error(
            "色付き正方形マスを十分に検出できませんでした。"
        );

    }


    /*
       盤面のセルは大量に存在するため、
       大きさの中央値を使って
       明らかな小物を除外する。
    */

    const top =
        squareCandidates.slice(
            0,
            Math.min(
                500,
                squareCandidates.length
            )
        );


    const medianWidth =
        median(
            top.map(
                c => c.width
            )
        );


    const medianHeight =
        median(
            top.map(
                c => c.height
            )
        );


    squareCandidates =
        squareCandidates.filter(
            component => {

                return (

                    component.width >=
                    medianWidth * 0.45 &&

                    component.width <=
                    medianWidth * 1.8 &&

                    component.height >=
                    medianHeight * 0.45 &&

                    component.height <=
                    medianHeight * 1.8

                );

            }
        );


    /*
       ④ X座標・Y座標をそれぞれグループ化
    */

    const coordinateGap =
        Math.max(
            5,
            Math.min(
                medianWidth,
                medianHeight
            ) * 0.65
        );


    let xGroups =
        clusterCoordinates(
            squareCandidates.map(
                c => c.centerX
            ),
            coordinateGap
        );


    let yGroups =
        clusterCoordinates(
            squareCandidates.map(
                c => c.centerY
            ),
            coordinateGap
        );


    /*
       あまりに多い場合は、
       近いグループをさらにまとめる。
    */

    if(
        xGroups.length > 25
    ){

        xGroups =
            clusterCoordinates(
                squareCandidates.map(
                    c => c.centerX
                ),
                coordinateGap * 1.25
            );

    }


    if(
        yGroups.length > 25
    ){

        yGroups =
            clusterCoordinates(
                squareCandidates.map(
                    c => c.centerY
                ),
                coordinateGap * 1.25
            );

    }


    /*
       ⑤ 4×4 ～ 20×20の中から
       最も密度の高い正方形グリッドを探す
    */

    let bestGrid =
        null;


    const cellSize =
        Math.max(
            medianWidth,
            medianHeight
        );


    const tolerance =
        Math.max(
            12,
            cellSize * 0.48
        );


    for(
        let size = MIN_GRID;
        size <= MAX_GRID;
        size++
    ){

        if(
            xGroups.length < size ||
            yGroups.length < size
        ){

            continue;
        }


        for(
            let xStart = 0;
            xStart <=
                xGroups.length - size;
            xStart++
        ){

            for(
                let yStart = 0;
                yStart <=
                    yGroups.length - size;
                yStart++
            ){

                const evaluation =
                    evaluateGrid(
                        squareCandidates,
                        xGroups,
                        yGroups,
                        xStart,
                        yStart,
                        size,
                        tolerance
                    );


                const total =
                    size * size;


                const density =
                    evaluation.found /
                    total;


                /*
                   正方形盤面なので、
                   できるだけ全マス埋まるものを優先。
                */

                let score =
                    evaluation.score;


                score +=
                    density * 10000;


                /*
                   20×20まで対応。
                   ただし小さい盤面を無理に大きく
                   することを防ぐ。
                */

                score +=
                    Math.min(
                        evaluation.found,
                        total
                    );


                if(
                    !bestGrid ||
                    score >
                    bestGrid.score
                ){

                    bestGrid = {

                        score,

                        size,

                        xStart,

                        yStart,

                        found:
                            evaluation.found,

                        density,

                        cells:
                            evaluation.cells

                    };

                }

            }

        }

    }


    if(
        !bestGrid
    ){

        throw new Error(
            "盤面の行・列を認識できませんでした。"
        );

    }


    /*
       80%以上埋まっていれば採用。
       多少の認識漏れは中央色サンプリングで補完する。
    */

    if(
        bestGrid.density < 0.75
    ){

        throw new Error(
            "盤面を十分に認識できませんでした。\n" +
            "盤面全体が写った元のゲーム画像を使用してください。\n" +
            "認識率：" +
            Math.round(
                bestGrid.density * 100
            ) +
            "%"
        );

    }


    /*
       ⑥ グリッドの外側を計算
    */

    const firstCell =
        bestGrid.cells[0][0];

    const lastCell =
        bestGrid.cells[
            bestGrid.size - 1
        ][
            bestGrid.size - 1
        ];


    let minX =
        Infinity;

    let minY =
        Infinity;

    let maxX =
        -Infinity;

    let maxY =
        -Infinity;


    for(
        const row of bestGrid.cells
    ){

        for(
            const cell of row
        ){

            if(!cell)
                continue;


            const c =
                cell.component;


            minX =
                Math.min(
                    minX,
                    c.x
                );

            minY =
                Math.min(
                    minY,
                    c.y
                );

            maxX =
                Math.max(
                    maxX,
                    c.x + c.width
                );

            maxY =
                Math.max(
                    maxY,
                    c.y + c.height
                );

        }

    }


    return {

        size:
            bestGrid.size,

        cells:
            bestGrid.cells,

        density:
            bestGrid.density,

        bounds:{

            x:minX,

            y:minY,

            width:
                maxX - minX,

            height:
                maxY - minY

        }

    };

}


/* =========================================================
   セル中央の色を精密に取得
   ========================================================= */

function sampleCellColor(
    imageData,
    cell
){

    const data =
        imageData.data;

    const width =
        imageData.width;

    const height =
        imageData.height;


    let component =
        cell
            ? cell.component
            : null;


    if(!component){

        return null;

    }


    /*
       マスの中央付近だけをサンプリング。
       枠や角丸部分を避ける。
    */

    const centerX =
        Math.round(
            component.centerX
        );

    const centerY =
        Math.round(
            component.centerY
        );


    const radius =
        Math.max(
            2,
            Math.floor(
                Math.min(
                    component.width,
                    component.height
                ) * 0.18
            )
        );


    let rTotal =
        0;

    let gTotal =
        0;

    let bTotal =
        0;

    let count =
        0;


    for(
        let dy = -radius;
        dy <= radius;
        dy++
    ){

        for(
            let dx = -radius;
            dx <= radius;
            dx++
        ){

            const x =
                centerX + dx;

            const y =
                centerY + dy;


            if(
                x < 0 ||
                x >= width ||
                y < 0 ||
                y >= height
            ){

                continue;

            }


            const index =
                (y * width + x) * 4;


            rTotal +=
                data[index];

            gTotal +=
                data[index + 1];

            bTotal +=
                data[index + 2];

            count++;

        }

    }


    if(
        count === 0
    ){

        return null;

    }


    const r =
        Math.round(
            rTotal / count
        );

    const g =
        Math.round(
            gTotal / count
        );

    const b =
        Math.round(
            bTotal / count
        );


    return nearestGameColor(
        r,
        g,
        b
    );

}


/* =========================================================
   盤面の色を読み取る
   ========================================================= */

function readBoardColors(
    canvas,
    board
){

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const colors =
        [];


    for(
        let row = 0;
        row < board.size;
        row++
    ){

        const rowColors =
            [];


        for(
            let col = 0;
            col < board.size;
            col++
        ){

            const cell =
                board.cells[row][col];


            const result =
                sampleCellColor(
                    imageData,
                    cell
                );


            if(!result){

                /*
                   マスが連結成分として
                   見つからなかった場合、
                   周辺を推定して探す。
                */

                rowColors.push(
                    null
                );

            }else{

                rowColors.push(
                    result.color.id
                );

            }

        }


        colors.push(
            rowColors
        );

    }


    /*
       nullが残っている場合は、
       同じ行・列の周辺情報から
       追加サンプリングを行う。
    */

    for(
        let row = 0;
        row < board.size;
        row++
    ){

        for(
            let col = 0;
            col < board.size;
            col++
        ){

            if(
                colors[row][col] !== null
            ){

                continue;

            }


            const targetX =
                board.cells[row][col]
                    ?.centerX;


            const targetY =
                board.cells[row][col]
                    ?.centerY;


            if(
                targetX === undefined ||
                targetY === undefined
            ){

                continue;

            }


            const result =
                samplePointColor(
                    imageData,
                    targetX,
                    targetY,
                    5
                );


            if(result){

                colors[row][col] =
                    result.color.id;

            }

        }

    }


    return colors;

}


/* =========================================================
   座標の色をサンプリング
   ========================================================= */

function samplePointColor(
    imageData,
    cx,
    cy,
    radius
){

    const data =
        imageData.data;

    const width =
        imageData.width;

    const height =
        imageData.height;


    let rTotal =
        0;

    let gTotal =
        0;

    let bTotal =
        0;

    let count =
        0;


    for(
        let dy = -radius;
        dy <= radius;
        dy++
    ){

        for(
            let dx = -radius;
        dx <= radius;
        dx++
        ){

            const x =
                Math.round(cx + dx);

            const y =
                Math.round(cy + dy);


            if(
                x < 0 ||
                x >= width ||
                y < 0 ||
                y >= height
            ){

                continue;

            }


            const index =
                (y * width + x) * 4;


            rTotal +=
                data[index];

            gTotal +=
                data[index + 1];

            bTotal +=
                data[index + 2];

            count++;

        }

    }


    if(!count){

        return null;

    }


    return nearestGameColor(

        Math.round(
            rTotal / count
        ),

        Math.round(
            gTotal / count
        ),

        Math.round(
            bTotal / count
        )

    );

}


/* =========================================================
   パズルを解く
   ========================================================= */

function solvePuzzle(
    colors
){

    const size =
        colors.length;


    /*
       色ごとに候補セルを作る
    */

    const colorCells =
        new Map();


    for(
        let row = 0;
        row < size;
        row++
    ){

        for(
            let col = 0;
            col < size;
            col++
        ){

            const color =
                colors[row][col];


            if(color === null){

                continue;

            }


            if(
                !colorCells.has(color)
            ){

                colorCells.set(
                    color,
                    []
                );

            }


            colorCells
                .get(color)
                .push({
                    row,
                    col
                });

        }

    }


    /*
       10色以内であることを確認
    */

    if(
        colorCells.size === 0
    ){

        return {

            success:false,

            message:
                "色を1つも認識できませんでした。"

        };

    }


    if(
        colorCells.size > 10
    ){

        return {

            success:false,

            message:
                "10色を超える色が認識されました。"

        };

    }


    /*
       すべてのセルが色を持っているか確認
    */

    for(
        let row = 0;
        row < size;
        row++
    ){

        for(
            let col = 0;
            col < size;
            col++
        ){

            if(
                colors[row][col] === null
            ){

                return {

                    success:false,

                    message:
                        `(${row+1}, ${col+1})の色を認識できませんでした。`

                };

            }

        }

    }


    /*
       色の候補を取得
    */

    const colorIds =
        [...colorCells.keys()];


    /*
       候補数の少ない色から処理
       MRV方式
    */

    colorIds.sort(
        (a,b) =>
            colorCells.get(a).length -
            colorCells.get(b).length
    );


    const chosen =
        [];


    const usedRows =
        new Set();

    const usedCols =
        new Set();


    function adjacent(
        row,
        col
    ){

        for(
            const cat of chosen
        ){

            const rowDiff =
                Math.abs(
                    cat.row - row
                );

            const colDiff =
                Math.abs(
                    cat.col - col
                );


            /*
               縦・横・斜めすべて禁止
            */

            if(
                rowDiff <= 1 &&
                colDiff <= 1
            ){

                return true;

            }

        }


        return false;

    }


    function isPossible(
        cell
    ){

        if(
            usedRows.has(
                cell.row
            )
        ){

            return false;

        }


        if(
            usedCols.has(
                cell.col
            )
        ){

            return false;

        }


        if(
            adjacent(
                cell.row,
                cell.col
            )
        ){

            return false;

        }


        return true;

    }


    function forwardCheck(
        currentIndex
    ){

        /*
           残りの各色に、
           少なくとも1つ候補があるか確認
        */

        for(
            let i = currentIndex;
            i < colorIds.length;
            i++
        ){

            const colorId =
                colorIds[i];


            const candidates =
                colorCells.get(
                    colorId
                );


            let possible =
                false;


            for(
                const cell
                of candidates
            ){

                if(
                    isPossible(cell)
                ){

                    possible =
                        true;

                    break;

                }

            }


            if(!possible){

                return false;

            }

        }


        return true;

    }


    function backtrack(
        index
    ){

        if(
            index >= colorIds.length
        ){

            return true;

        }


        const colorId =
            colorIds[index];


        const candidates =
            colorCells.get(
                colorId
            );


        /*
           候補をシャッフルせず、
           座標順で安定させる。
        */

        for(
            const cell
            of candidates
        ){

            if(
                !isPossible(cell)
            ){

                continue;

            }


            chosen.push({
                row:cell.row,
                col:cell.col,
                color:colorId
            });


            usedRows.add(
                cell.row
            );

            usedCols.add(
                cell.col
            );


            if(
                forwardCheck(
                    index + 1
                ) &&
                backtrack(
                    index + 1
                )
            ){

                return true;

            }


            chosen.pop();

            usedRows.delete(
                cell.row
            );

            usedCols.delete(
                cell.col
            );

        }


        return false;

    }


    const success =
        backtrack(0);


    if(!success){

        return {

            success:false,

            message:
                "現在の認識結果では解が見つかりませんでした。"

        };

    }


    return {

        success:true,

        cats:chosen,

        colorCount:
            colorCells.size

    };

}


/* =========================================================
   結果を描画
   ========================================================= */

function drawResult(
    canvas,
    board,
    colors,
    solution
){

    const resultCanvas =
        document.createElement(
            "canvas"
        );


    /*
       元画像をベースにする
    */

    resultCanvas.width =
        canvas.width;

    resultCanvas.height =
        canvas.height;


    const ctx =
        resultCanvas.getContext(
            "2d"
        );


    ctx.drawImage(
        canvas,
        0,
        0
    );


    /*
       盤面外周
    */

    ctx.strokeStyle =
        "#ff0000";

    ctx.lineWidth =
        Math.max(
            2,
            canvas.width / 500
        );


    ctx.strokeRect(

        board.bounds.x,

        board.bounds.y,

        board.bounds.width,

        board.bounds.height

    );


    /*
       猫を描画
    */

    for(
        const cat of solution.cats
    ){

        const cell =
            board.cells[
                cat.row
            ][
                cat.col
            ];


        if(!cell)
            continue;


        const x =
            cell.component.centerX;

        const y =
            cell.component.centerY;


        const radius =
            Math.max(
                12,
                Math.min(
                    cell.component.width,
                    cell.component.height
                ) * 0.30
            );


        /*
           白い円
        */

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255,0.92)";

        ctx.fill();


        /*
           枠
        */

        ctx.strokeStyle =
            "#d71919";

        ctx.lineWidth =
            Math.max(
                2,
                radius * 0.12
            );

        ctx.stroke();


        /*
           猫マーク
        */

        ctx.font =
            `${Math.round(radius * 1.15)}px sans-serif`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.fillStyle =
            "#222";


        ctx.fillText(
            "🐱",
            x,
            y
        );

    }


    return resultCanvas;

}

){

            );

        `<b>盤面認識率：</b> ${Math.round(board.density * 100)}%<br>` +

        `<b>猫の数：</b> ${solution.cats.length}匹`;

    );


    /*

    */

        );

    let html =

    solution.cats
        .sort(

                a.row - b.row ||
                a.col - b.col
        )
        .forEach(
            (cat,index) => {

                const color =
                    GAME_COLORS[
                        cat.color
                    ];


                html +=

                    `${index + 1}. ` +

                    `${cat.row + 1}行 ${cat.col + 1}列 ` +

                    `（${color.name}）<br>`;

            }
        );


    list.innerHTML =
        html;


    resultArea.appendChild(
        list
    );


    /*
       色一覧
    */

    const colorInfo =
        document.createElement(
            "div"
        );


    colorInfo.className =
        "board-info";


    let colorHTML =
        "<b>認識した色：</b><div class='color-list'>";


    [...colorSet]
        .sort(
            (a,b) => a-b
        )
        .forEach(
            id => {

                const color =
                    GAME_COLORS[id];


                colorHTML +=

                    `<div class="color-item">` +

                    `<span class="color-dot" ` +

                    `style="background:rgb(` +

                    `${color.r},${color.g},${color.b}` +

                    `)"></span>` +

                    `${color.name}` +

                    ` #${toHex(color.r)}${toHex(color.g)}${toHex(color.b)}` +

                    `</div>`;

            }
        );


    colorHTML +=
        "</div>";


    colorInfo.innerHTML =
        colorHTML;


    resultArea.appendChild(
        colorInfo
    );

}

/* =========================================================
   sleep
   ========================================================= */

function sleep(
    ms
){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}
