今回のゲームは10色・10×10盤面として認識します。

<script>

"use strict";


/*
====================================================
ゲームの10色
====================================================

レベル103のゲーム画像から取得した色を使用します。

ここでは「画面上の色を勝手に10色に分類する」のではなく、
この10色とRGB距離を比較します。
*/

const GAME_COLORS = [

  {
    name:"黄色",
    r:227,
    g:188,
    b:73
  },

  {
    name:"青緑",
    r:72,
    g:181,
    b:178
  },

  {
    name:"赤",
    r:213,
    g:115,
    b:117
  },

  {
    name:"紫",
    r:151,
    g:120,
    b:214
  },

  {
    name:"ピンク",
    r:235,
    g:133,
    b:183
  },

  {
    name:"薄ピンク",
    r:249,
    g:180,
    b:208
  },

  {
    name:"薄青",
    r:166,
    g:191,
    b:215
  },

  {
    name:"茶色",
    r:173,
    g:111,
    b:72
  },

  {
    name:"水色",
    r:106,
    g:188,
    b:230
  },

  {
    name:"緑",
    r:173,
    g:217,
    b:148
  }

];


/*
====================================================
色認識の許容範囲
====================================================

以前は70でしたが、
ゲーム背景まで色として拾う場合があるため
今回は55にしています。
*/

const COLOR_TOLERANCE = 55;



const imageInput =
  document.getElementById(
    "imageInput"
  );

const solveButton =
  document.getElementById(
    "solveButton"
  );

const clearButton =
  document.getElementById(
    "clearButton"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const preview =
  document.getElementById(
    "preview"
  );

const info =
  document.getElementById(
    "info"
  );

const resultGrid =
  document.getElementById(
    "resultGrid"
  );

const legend =
  document.getElementById(
    "legend"
  );

const debugBox =
  document.getElementById(
    "debug"
  );


let selectedFile = null;



/*
====================================================
ステータス
====================================================
*/

function setStatus(
  text,
  type=""
){

  statusBox.textContent =
    text;

  statusBox.className =
    "status " + type;

}



/*
====================================================
画像選択
====================================================
*/

imageInput.addEventListener(
  "change",
  function(){

    selectedFile =
      imageInput.files[0] ||
      null;


    preview.innerHTML =
      "";

    resultGrid.innerHTML =
      "";

    legend.innerHTML =
      "";

    debugBox.innerHTML =
      "";

    debugBox.style.display =
      "none";


    if(!selectedFile){

      solveButton.disabled =
        true;

      setStatus(
        "画像を選択してください。"
      );

      return;

    }


    const url =
      URL.createObjectURL(
        selectedFile
      );


    const img =
      document.createElement(
        "img"
      );


    img.src =
      url;

    img.className =
      "preview";


    preview.appendChild(
      img
    );


    solveButton.disabled =
      false;


    setStatus(
      "画像を読み込みました。"
    );

  }
);



/*
====================================================
クリア
====================================================
*/

clearButton.addEventListener(
  "click",
  function(){

    selectedFile =
      null;

    imageInput.value =
      "";

    preview.innerHTML =
      "";

    resultGrid.innerHTML =
      "";

    legend.innerHTML =
      "";

    debugBox.innerHTML =
      "";

    debugBox.style.display =
      "none";


    info.textContent =
      "まだ解析していません。";


    solveButton.disabled =
      true;


    setStatus(
      "画像を選択してください。"
    );

  }
);



/*
====================================================
解読開始
====================================================
*/

solveButton.addEventListener(
  "click",
  async function(){

    if(!selectedFile){
      return;
    }


    solveButton.disabled =
      true;


    try{

      setStatus(
        "① 画像を読み込んでいます…"
      );


      const img =
        await loadImage(
          selectedFile
        );


      setStatus(
        "② 盤面を探しています…"
      );


      const board =
        detectBoard(
          img
        );


      setStatus(
        "③ 10×10盤面を認識しました。\n" +
        "各マスの色を読み取っています…"
      );


      showDebug(
        board
      );


      const colorCount =
        new Set(
          board.colors
        ).size;


      if(colorCount !== 10){

        throw new Error(

          "10色すべてを認識できませんでした。\n\n" +

          "認識された色数：" +
          colorCount +
          "\n\n" +

          "盤面は認識できていますが、" +
          "色の読み取りに失敗しています。"

        );

      }


      setStatus(
        "④ 10色の認識に成功しました。\n" +
        "猫の配置を計算しています…"
      );


      const solution =
        solvePuzzle(
          board.colors
        );


      drawResult(
        board.colors,
        solution
      );


      if(!solution){

        info.textContent =

          "10×10盤面と10色は認識できましたが、" +
          "現在のルールでは解が見つかりませんでした。\n\n" +

          "色の誤認識が残っている可能性があります。";


        setStatus(
          "盤面と色は認識しましたが、解答が見つかりませんでした。",
          "error"
        );

      }

      else{

        const positions =
          solution
            .map(
              p =>
                `${p[0]+1}行${p[1]+1}列`
            )
            .join("、");


        info.textContent =

          "盤面：10×10\n" +

          "猫の数：" +
          solution.length +
          "匹\n\n" +

          "猫の位置：\n" +
          positions;


        setStatus(

          "解答が見つかりました！\n" +
          "黒い枠と🐱が付いたマスが猫の位置です。",

          "ok"

        );

      }


    }

    catch(error){

      console.error(
        error
      );


      setStatus(

        "読み取りに失敗しました。\n\n" +
        error.message,

        "error"

      );


      info.textContent =
        "認識できませんでした。";

    }


    finally{

      solveButton.disabled =
        false;

    }

  }
);



/*
====================================================
画像読み込み
====================================================
*/

function loadImage(file){

  return new Promise(
    function(resolve,reject){

      const url =
        URL.createObjectURL(
          file
        );


      const img =
        new Image();


      img.onload =
        function(){

          URL.revokeObjectURL(
            url
          );

          resolve(
            img
          );

        };


      img.onerror =
        function(){

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "画像を開けませんでした。"
            )
          );

        };


      img.src =
        url;

    }
  );

}



/*
====================================================
Canvas画像作成
====================================================
*/

function createImageData(
  img
){

  const MAX_WIDTH =
    1800;


  const scale =
    Math.min(
      1,
      MAX_WIDTH /
      img.naturalWidth
    );


  const width =
    Math.max(
      1,
      Math.round(
        img.naturalWidth *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        img.naturalHeight *
        scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  return {

    data:
      ctx.getImageData(
        0,
        0,
        width,
        height
      ),

    width:
      width,

    height:
      height

  };

}



/*
====================================================
RGB距離
====================================================
*/

function colorDistance(
  a,
  b
){

  return Math.sqrt(

    Math.pow(
      a.r-b.r,
      2
    )

    +

    Math.pow(
      a.g-b.g,
      2
    )

    +

    Math.pow(
      a.b-b.b,
      2
    )

  );

}



/*
====================================================
最も近いゲーム色
====================================================
*/

function nearestGameColor(
  rgb
){

  let bestIndex =
    -1;

  let bestDistance =
    Infinity;


  for(
    let i=0;
    i<GAME_COLORS.length;
    i++
  ){

    const d =
      colorDistance(
        rgb,
        GAME_COLORS[i]
      );


    if(
      d < bestDistance
    ){

      bestDistance =
        d;

      bestIndex =
        i;

    }

  }


  return {

    index:
      bestIndex,

    distance:
      bestDistance

  };

}



/*
====================================================
中央値
====================================================
*/

function median(
  values
){

  if(
    values.length===0
  ){

    return 0;

  }


  const a =
    values
      .slice()
      .sort(
        (x,y)=>x-y
      );


  const middle =
    Math.floor(
      a.length/2
    );


  if(
    a.length%2
  ){

    return a[middle];

  }


  return (
    a[middle-1] +
    a[middle]
  ) / 2;

}



/*
====================================================
色マスク
====================================================

ここでは各ピクセルが
「ゲームの10色のどれかに近いか」
だけを調べます。

以前のように同色の隣接マスを
1つの領域として扱いません。
====================================================
*/

function makeColorMask(
  image
){

  const {
    data,
    width,
    height
  } = image;


  const mask =
    new Uint8Array(
      width*height
    );


  for(
    let y=0;
    y<height;
    y++
  ){

    for(
      let x=0;
      x<width;
      x++
    ){

      const p =
        (y*width+x)*4;


      const rgb = {

        r:data[p],

        g:data[p+1],

        b:data[p+2]

      };


      const nearest =
        nearestGameColor(
          rgb
        );


      if(
        nearest.distance <=
        COLOR_TOLERANCE
      ){

        mask[
          y*width+x
        ] = 1;

      }

    }

  }


  return mask;

}



/*
====================================================
投影を作る
====================================================
*/

function makeRowProjection(
  mask,
  width,
  height
){

  const result =
    new Int32Array(
      height
    );


  for(
    let y=0;
    y<height;
    y++
  ){

    let count=0;


    for(
      let x=0;
      x<width;
      x++
    ){

      if(
        mask[
          y*width+x
        ]
      ){

        count++;

      }

    }


    result[y]=count;

  }


  return result;

}



function makeColumnProjection(
  mask,
  width,
  height
){

  const result =
    new Int32Array(
      width
    );


  for(
    let x=0;
    x<width;
    x++
  ){

    let count=0;


    for(
      let y=0;
      y<height;
      y++
    ){

      if(
        mask[
          y*width+x
        ]
      ){

        count++;

      }

    }


    result[x]=count;

  }


  return result;

}



/*
====================================================
連続した色付き区間を探す
====================================================
*/

function findRuns(
  values
){

  const max =
    Math.max(
      ...values
    );


  /*
  最大値の約35%以上を
  「色付き」とします。
  */

  const threshold =
    Math.max(
      5,
      max*0.35
    );


  const runs=[];

  let start=-1;


  for(
    let i=0;
    i<values.length;
    i++
  ){

    const active =
      values[i] >=
      threshold;


    if(
      active &&
      start===-1
    ){

      start=i;

    }


    if(
      !active &&
      start!==-1
    ){

      const end =
        i-1;


      if(
        end-start+1>=2
      ){

        runs.push({

          start:start,

          end:end,

          center:
            (start+end)/2,

          size:
            end-start+1

        });

      }


      start=-1;

    }

  }


  if(
    start!==-1
  ){

    const end =
      values.length-1;


    if(
      end-start+1>=2
    ){

      runs.push({

        start:start,

        end:end,

        center:
          (start+end)/2,

        size:
          end-start+1

      });

    }

  }


  return {

    runs:runs,

    threshold:threshold

  };

}



/*
====================================================
10個の区間を選ぶ
====================================================

10×10ゲームなので、
行10個・列10個を探します。

これが以前の「10×8」問題を
解決する重要な部分です。
====================================================
*/

function chooseTenRuns(
  runs
){

  if(
    runs.length < 10
  ){

    return null;

  }


  let best=null;


  for(
    let start=0;
    start+10<=runs.length;
    start++
  ){

    const group =
      runs.slice(
        start,
        start+10
      );


    const centers =
      group.map(
        r=>r.center
      );


    const sizes =
      group.map(
        r=>r.size
      );


    const gaps=[];


    for(
      let i=1;
      i<centers.length;
      i++
    ){

      gaps.push(
        centers[i] -
        centers[i-1]
      );

    }


    const averageGap =
      median(
        gaps
      );


    if(
      averageGap<=0
    ){

      continue;

    }


    let gapError=0;


    for(
      const gap of gaps
    ){

      gapError +=
        Math.abs(
          gap-averageGap
        ) /
        averageGap;

    }


    gapError /=
      gaps.length;


    const averageSize =
      median(
        sizes
      );


    let sizeError=0;


    for(
      const size of sizes
    ){

      sizeError +=
        Math.abs(
          size-averageSize
        ) /
        Math.max(
          1,
          averageSize
        );

    }


    sizeError /=
      sizes.length;


    /*
    本物の盤面は

    ・10個
    ・間隔がほぼ同じ
    ・マス幅もほぼ同じ

    なのでこの条件を使います。
    */

    const score =
      gapError*3 +
      sizeError;


    if(
      !best ||
      score < best.score
    ){

      best = {

        score:score,

        runs:group

      };

    }

  }


  return best;

}



/*
====================================================
盤面検出
====================================================
*/

function detectBoard(
  img
){

  const image =
    createImageData(
      img
    );


  const mask =
    makeColorMask(
      image
    );


  const rowProjection =
    makeRowProjection(
      mask,
      image.width,
      image.height
    );


  const columnProjection =
    makeColumnProjection(
      mask,
      image.width,
      image.height
    );


  const rowInfo =
    findRuns(
      rowProjection
    );


  const columnInfo =
    findRuns(
      columnProjection
    );


  const rowSelection =
    chooseTenRuns(
      rowInfo.runs
    );


  const columnSelection =
    chooseTenRuns(
      columnInfo.runs
    );


  if(
    !rowSelection
  ){

    throw new Error(

      "盤面の10行を検出できませんでした。\n\n" +

      "検出された行候補：" +
      rowInfo.runs.length

    );

  }


  if(
    !columnSelection
  ){

    throw new Error(

      "盤面の10列を検出できませんでした。\n\n" +

      "検出された列候補：" +
      columnInfo.runs.length

    );

  }


  const rowCenters =
    rowSelection.runs.map(
      r=>r.center
    );


  const columnCenters =
    columnSelection.runs.map(
      r=>r.center
    );


  /*
  マスの大きさ

  行方向・列方向それぞれの
  区間サイズ中央値を使用します。
  */

  const cellHeight =
    median(
      rowSelection.runs.map(
        r=>r.size
      )
    );


  const cellWidth =
    median(
      columnSelection.runs.map(
        r=>r.size
      )
    );


  const colors=[];

  const distances=[];


  /*
  10×10の各マスの
  「中央付近」だけをサンプリングします。
  */

  for(
    let r=0;
    r<10;
    r++
  ){

    for(
      let c=0;
      c<10;
      c++
    ){

      const result =
        sampleCellColor(

          image,

          columnCenters[c],

          rowCenters[r],

          cellWidth,

          cellHeight

        );


      if(
        result.distance >
        COLOR_TOLERANCE
      ){

        throw new Error(

          `${r+1}行${c+1}列の色を認識できませんでした。\n\n` +

          `RGB距離：${Math.round(
            result.distance
          )}`

        );

      }


      colors.push(
        result.index
      );


      distances.push(
        result.distance
      );

    }

  }


  return {

    rows:10,

    cols:10,

    colors:colors,

    distances:distances,

    rowCenters:rowCenters,

    columnCenters:columnCenters,

    rowRuns:rowSelection.runs,

    columnRuns:columnSelection.runs,

    rowCandidates:
      rowInfo.runs.length,

    columnCandidates:
      columnInfo.runs.length,

    width:
      image.width,

    height:
      image.height

  };

}



/*
====================================================
マス中央の色をサンプリング
====================================================
*/

function sampleCellColor(
  image,
  cx,
  cy,
  cellWidth,
  cellHeight
){

  const {
    data,
    width,
    height
  } = image;


  /*
  マス中央の約35%だけを見る。

  端は白い隙間や境界線があるため、
  できるだけ中央だけを使います。
  */

  const radiusX =
    Math.max(
      2,
      Math.floor(
        cellWidth*0.22
      )
    );


  const radiusY =
    Math.max(
      2,
      Math.floor(
        cellHeight*0.22
      )
    );


  const reds=[];

  const greens=[];

  const blues=[];


  for(
    let y=
      Math.round(cy)-
      radiusY;

    y<=
      Math.round(cy)+
      radiusY;

    y++
  ){

    if(
      y<0 ||
      y>=height
    ){

      continue;

    }


    for(
      let x=
        Math.round(cx)-
        radiusX;

      x<=
        Math.round(cx)+
        radiusX;

      x++
    ){

      if(
        x<0 ||
        x>=width
      ){

        continue;

      }


      const p =
        (y*width+x)*4;


      reds.push(
        data[p]
      );


      greens.push(
        data[p+1]
      );


      blues.push(
        data[p+2]
      );

    }

  }


  const rgb={

    r:
      median(
        reds
      ),

    g:
      median(
        greens
      ),

    b:
      median(
        blues
      )

  };


  return nearestGameColor(
    rgb
  );

}



/*
====================================================
パズルを解く
====================================================
*/

function solvePuzzle(
  colors
){

  const positions =
    Array.from(
      {
        length:10
      },
      () => []
    );


  /*
  各色がどこに存在するか調べます。
  */

  for(
    let r=0;
    r<10;
    r++
  ){

    for(
      let c=0;
      c<10;
      c++
    ){

      const color =
        colors[
          r*10+c
        ];


      positions[
        color
      ].push([
        r,
        c
      ]);

    }

  }


  /*
  10色全部が存在する必要があります。
  */

  for(
    let color=0;
    color<10;
    color++
  ){

    if(
      positions[color].length===0
    ){

      return null;

    }

  }


  const placed =
    new Array(10)
      .fill(null);


  const usedRows =
    new Uint8Array(10);


  const usedCols =
    new Uint8Array(10);



  function canPlace(
    r,
    c
  ){

    if(
      usedRows[r]
    ){

      return false;

    }


    if(
      usedCols[c]
    ){

      return false;

    }


    /*
    猫同士の隣接禁止
    */

    for(
      const p of placed
    ){

      if(!p){

        continue;

      }


      if(

        Math.abs(
          p[0]-r
        )<=1 &&

        Math.abs(
          p[1]-c
        )<=1

      ){

        return false;

      }

    }


    return true;

  }



  function search(
    count
  ){

    if(
      count===10
    ){

      return placed.map(
        p=>[
          p[0],
          p[1]
        ]
      );

    }


    let selectedColor =
      -1;

    let selectedPositions =
      null;


    /*
    MRV

    現在置ける場所が
    一番少ない色から調べます。
    */

    for(
      let color=0;
      color<10;
      color++
    ){

      if(
        placed[color]
      ){

        continue;

      }


      const candidates =
        positions[color]
          .filter(
            p =>
              canPlace(
                p[0],
                p[1]
              )
          );


      if(
        candidates.length===0
      ){

        return null;

      }


      if(

        selectedPositions===null ||

        candidates.length <
        selectedPositions.length

      ){

        selectedColor =
          color;

        selectedPositions =
          candidates;

      }

    }


    for(
      const p of selectedPositions
    ){

      const r =
        p[0];

      const c =
        p[1];


      placed[
        selectedColor
      ] = p;


      usedRows[r]=1;

      usedCols[c]=1;


      const result =
        search(
          count+1
        );


      if(result){

        return result;

      }


      placed[
        selectedColor
      ] = null;


      usedRows[r]=0;

      usedCols[c]=0;

    }


    return null;

  }


  return search(0);

}



/*
====================================================
結果表示
====================================================
*/

function drawResult(
  colors,
  solution
){

  resultGrid.innerHTML =
    "";

  legend.innerHTML =
    "";


  resultGrid.style.gridTemplateColumns =
    "repeat(10,44px)";


  const catPositions =
    new Set();


  if(solution){

    for(
      const p of solution
    ){

      catPositions.add(
        `${p[0]},${p[1]}`
      );

    }

  }


  for(
    let r=0;
    r<10;
    r++
  ){

    for(
      let c=0;
      c<10;
      c++
    ){

      const colorIndex =
        colors[
          r*10+c
        ];


      const color =
        GAME_COLORS[
          colorIndex
        ];


      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "gridCell";


      cell.style.background =
        `rgb(
          ${color.r},
          ${color.g},
          ${color.b}
        )`;


      if(
        catPositions.has(
          `${r},${c}`
        )
      ){

        cell.classList.add(
          "cat"
        );

        cell.textContent =
          "🐱";

      }


      cell.title =
        `${r+1}行${c+1}列 / ${color.name}`;


      resultGrid.appendChild(
        cell
      );

    }

  }


  /*
  凡例
  */

  for(
    let i=0;
    i<10;
    i++
  ){

    const color =
      GAME_COLORS[i];


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "legendItem";


    item.textContent =
      color.name;


    item.style.background =
      `rgb(
        ${color.r},
        ${color.g},
        ${color.b}
      )`;


    legend.appendChild(
      item
    );

  }

}

function showDebug(
  board
){

  debugBox.style.display =
    "block";


  const counts =
    new Array(10)
      .fill(0);


  for(
    const color of
    board.colors
  ){

    counts[color]++;

  }


  let text = "";


  text +=
    "画像サイズ：" +
    board.width +
    " × " +
    board.height +
    "\n\n";


  text +=
    "認識した盤面：10 × 10\n\n";


  text +=
    "行候補：" +
    board.rowCandidates +
    "\n";


  text +=
    "列候補：" +
    board.columnCandidates +
    "\n\n";


  text +=
    "認識した色数：" +
    new Set(
      board.colors
    ).size +
    "\n\n";


  text +=
    "各色のマス数：\n";


  for(
    let i=0;
    i<10;
    i++
  ){

    const color =
      GAME_COLORS[i];


    text +=

      `${i+1}. ${color.name}` +

      ` RGB(${color.r},${color.g},${color.b})` +

      ` → ${counts[i]}マス\n`;

  }


  text +=
    "\n";


  text +=
    "行の中心座標：\n" +

    board.rowCenters
      .map(
        x=>Math.round(x)
      )
      .join(", ");


  text +=
    "\n\n";


  text +=
    "列の中心座標：\n" +

    board.columnCenters
      .map(
        x=>Math.round(x)
      )
      .join(", ");


  debugBox.textContent =
    text;

}
