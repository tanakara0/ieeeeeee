<body>

<main>

<h1>🐱 猫パズル自動解答</h1>

<div class="card">

<p class="small">

<strong>重要：</strong><br>

この版はレベル103の実画像から取得した10色のカラーコードを基準に認識します。<br>

ゲーム画面そのもののスクリーンショットを選択してください。<br>

<li>1色につき猫は1匹</li>

<li>同じ行に猫を2匹置かない</li>

<li>同じ列に猫を2匹置かない</li>

<li>上下左右・斜めを含め、猫同士は隣接禁止</li>

<script>

"use strict";


/*
==================================================
ゲームで使用される10色
==================================================

レベル103の実際の画像から取得した色を基準にします。

画像から勝手に10色を作る方式ではなく、
各マスの色をこの10色と比較します。
*/

const GAME_COLORS=[

  {
    name:"黄色",
    r:227,
    g:188,
    b:73
  },

  {
    name:"青緑",
    r:72,
    g:181,
    b:178
  },

  {
    name:"赤",
    r:213,
    g:115,
    b:117
  },

  {
    name:"紫",
    r:151,
    g:120,
    b:214
  },

  {
    name:"ピンク",
    r:235,
    g:133,
    b:183
  },

  {
    name:"薄ピンク",
    r:249,
    g:180,
    b:208
  },

  {
    name:"薄青",
    r:166,
    g:191,
    b:215
  },

  {
    name:"茶色",
    r:173,
    g:111,
    b:72
  },

  {
    name:"水色",
    r:106,
    g:188,
    b:230
  },

  {
    name:"緑",
    r:173,
    g:217,
    b:148
  }

];


/*
色の認識許容範囲

スクリーンショットの圧縮や
ブラウザによる多少の色変化を許容します。
*/

const COLOR_TOLERANCE=70;


const imageInput=
  document.getElementById("imageInput");

const solveButton=
  document.getElementById("solveButton");

const clearButton=
  document.getElementById("clearButton");

const statusBox=
  document.getElementById("status");

const preview=
  document.getElementById("preview");

const info=
  document.getElementById("info");

const resultGrid=
  document.getElementById("resultGrid");

const legend=
  document.getElementById("legend");

const debugBox=
  document.getElementById("debug");


let selectedFile=null;


/*
==================================================
ステータス表示
==================================================
*/

function setStatus(text,type=""){

  statusBox.textContent=text;

  statusBox.className=
    "status "+type;

}


/*
==================================================
画像選択
==================================================
*/

imageInput.addEventListener("change",()=>{

  selectedFile=
    imageInput.files?.[0] || null;

  resultGrid.innerHTML="";

  legend.innerHTML="";

  debugBox.style.display="none";

  info.textContent=
    "まだ解析していません。";


  if(!selectedFile){

    solveButton.disabled=true;

    preview.innerHTML="";

    setStatus(
      "画像を選択してください。"
    );

    return;

  }


  const url=
    URL.createObjectURL(selectedFile);


  const img=
    document.createElement("img");


  img.src=url;

  img.className="preview";


  preview.innerHTML="";

  preview.appendChild(img);


  solveButton.disabled=false;


  setStatus(
    "画像を読み込みました。"
  );

});


/*
==================================================
クリア
==================================================
*/

clearButton.addEventListener("click",()=>{

  selectedFile=null;

  imageInput.value="";

  preview.innerHTML="";

  resultGrid.innerHTML="";

  legend.innerHTML="";

  debugBox.innerHTML="";

  debugBox.style.display="none";

  info.textContent=
    "まだ解析していません。";

  solveButton.disabled=true;

  setStatus(
    "画像を選択してください。"
  );

});


/*
==================================================
解析開始
==================================================
*/

solveButton.addEventListener("click",async()=>{

  if(!selectedFile)return;

  solveButton.disabled=true;


  try{

    setStatus(
      "① 画像を解析しています…"
    );


    const img=
      await loadImage(selectedFile);


    setStatus(
      "② ゲームの10色を探しています…"
    );


    const board=
      detectBoard(img);


    setStatus(
      `③ 盤面を認識しました。
サイズ：${board.rows}×${board.cols}`
    );


    showDebug(board);


    /*
    ここが以前のコードの問題だった部分です。

    board.colorCountを参照するのではなく、
    実際に認識した色番号をSetに入れて
    何色認識できたかを調べます。
    */

    const recognizedColorCount=
      new Set(board.colors).size;


    if(recognizedColorCount!==10){

      throw new Error(

        `10色すべてを認識できませんでした。

認識された色数：
${recognizedColorCount}

各マスの中央色を、
登録済みの10色と照合しています。

ゲーム画面そのものの元画像を
選択しているか確認してください。`

      );

    }


    setStatus(
      "④ 各マスを10色のカラーコードと照合しています…"
    );


    setStatus(
      "⑤ 猫の配置を計算しています…"
    );


    const solution=
      solvePuzzle(
        board.colors,
        board.rows,
        board.cols
      );


    drawResult(
      board.colors,
      board.rows,
      board.cols,
      solution
    );


    if(!solution){

      info.textContent=

        "盤面と10色は認識できましたが、現在のルールでは解が見つかりませんでした。\n"+
        "色の誤認識が残っている可能性があります。";


      setStatus(
        "解答が見つかりませんでした。",
        "error"
      );


    }else{

      const positions=
        solution
          .map(
            p=>`${p[0]+1}行${p[1]+1}列`
          )
          .join("、");


      info.textContent=

        `猫の数：${solution.length}匹\n`+
        `猫の位置：${positions}`;


      setStatus(

        "解答が見つかりました！\n"+
        "黒い枠＋🐱のマスが猫を置く場所です。",

        "ok"

      );

    }


  }catch(e){

    console.error(e);


    setStatus(
      "読み取りに失敗しました。\n\n"+
      e.message,
      "error"
    );


    info.textContent=
      "認識できませんでした。";


  }finally{

    solveButton.disabled=false;

  }

});


/*
==================================================
画像読み込み
==================================================
*/

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const url=
      URL.createObjectURL(file);

    const img=
      new Image();


    img.onload=()=>{

      URL.revokeObjectURL(url);

      resolve(img);

    };


    img.onerror=()=>{

      URL.revokeObjectURL(url);

      reject(
        new Error(
          "画像を開けませんでした。"
        )
      );

    };


    img.src=url;

  });

}


/*
==================================================
Canvasに画像を展開
==================================================
*/

function makeCanvasImage(img){

  const MAX_WIDTH=1800;


  const scale=
    Math.min(
      1,
      MAX_WIDTH/img.naturalWidth
    );


  const width=
    Math.max(
      1,
      Math.round(
        img.naturalWidth*scale
      )
    );


  const height=
    Math.max(
      1,
      Math.round(
        img.naturalHeight*scale
      )
    );


  const canvas=
    document.createElement("canvas");


  canvas.width=width;

  canvas.height=height;


  const ctx=
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  return{

    data:
      ctx.getImageData(
        0,
        0,
        width,
        height
      ),

    width,

    height

  };

}


/*
==================================================
RGB距離
==================================================
*/

function colorDistance(a,b){

  return Math.sqrt(

    (a.r-b.r)**2+

    (a.g-b.g)**2+

    (a.b-b.b)**2

  );

}


/*
==================================================
一番近いゲーム色を探す
==================================================
*/

function nearestGameColor(rgb){

  let best=-1;

  let bestD=Infinity;


  for(
    let i=0;
    i<GAME_COLORS.length;
    i++
  ){

    const d=
      colorDistance(
        rgb,
        GAME_COLORS[i]
      );


    if(d<bestD){

      bestD=d;

      best=i;

    }

  }


  return{

    index:best,

    distance:bestD

  };

}


/*
==================================================
10色のカラーマスク作成
==================================================
*/

function makeColorMask(image){

  const{
    data,
    width,
    height
  }=image;


  const mask=
    new Uint8Array(
      width*height
    );


  for(
    let i=0;
    i<width*height;
    i++
  ){

    const p=i*4;


    const r=data[p];

    const g=data[p+1];

    const b=data[p+2];

    const a=data[p+3];


    if(a<80)continue;


    const q=
      nearestGameColor({
        r,
        g,
        b
      });


    if(
      q.distance<=COLOR_TOLERANCE
    ){

      mask[i]=1;

    }

  }


  return mask;

}


/*
==================================================
色付き領域を検出
==================================================
*/

function findComponents(
  image,
  mask
){

  const{
    width,
    height
  }=image;


  const total=
    width*height;


  const visited=
    new Uint8Array(total);


  const queue=
    new Int32Array(total);


  const result=[];


  for(
    let y=0;
    y<height;
    y++
  ){

    for(
      let x=0;
      x<width;
      x++
    ){

      const start=
        y*width+x;


      if(
        !mask[start] ||
        visited[start]
      ){

        continue;

      }


      let head=0;

      let tail=0;


      queue[tail++]=start;

      visited[start]=1;


      let area=0;


      let minX=x;

      let maxX=x;

      let minY=y;

      let maxY=y;


      let sumX=0;

      let sumY=0;


      const colorCounts=
        new Array(10).fill(0);


      while(head<tail){

        const idx=
          queue[head++];


        const px=
          idx%width;


        const py=
          Math.floor(
            idx/width
          );


        const p=
          idx*4;


        area++;


        sumX+=px;

        sumY+=py;


        minX=
          Math.min(
            minX,
            px
          );


        maxX=
          Math.max(
            maxX,
            px
          );


        minY=
          Math.min(
            minY,
            py
          );


        maxY=
          Math.max(
            maxY,
            py
          );


        const nc=
          nearestGameColor({

            r:image.data[p],

            g:image.data[p+1],

            b:image.data[p+2]

          });


        if(
          nc.distance<=COLOR_TOLERANCE
        ){

          colorCounts[
            nc.index
          ]++;

        }


        if(px>0){

          const n=idx-1;


          if(
            mask[n] &&
            !visited[n]
          ){

            visited[n]=1;

            queue[tail++]=n;

          }

        }


        if(px<width-1){

          const n=idx+1;


          if(
            mask[n] &&
            !visited[n]
          ){

            visited[n]=1;

            queue[tail++]=n;

          }

        }


        if(py>0){

          const n=idx-width;


          if(
            mask[n] &&
            !visited[n]
          ){

            visited[n]=1;

            queue[tail++]=n;

          }

        }


        if(py<height-1){

          const n=idx+width;


          if(
            mask[n] &&
            !visited[n]
          ){

            visited[n]=1;

            queue[tail++]=n;

          }

        }

      }


      const w=
        maxX-minX+1;


      const h=
        maxY-minY+1;


      if(
        area>=100 &&
        w>=8 &&
        h>=8
      ){

        let color=0;


        for(
          let i=1;
          i<10;
          i++
        ){

          if(
            colorCounts[i]>
            colorCounts[color]
          ){

            color=i;

          }

        }


        result.push({

          area,

          x:
            (minX+maxX)/2,

          y:
            (minY+maxY)/2,

          width:w,

          height:h,

          color

        });

      }

    }

  }


  return result;

}


/*
==================================================
中央値
==================================================
*/

function median(a){

  if(!a.length)return 0;


  const x=
    a.slice().sort(
      (p,q)=>p-q
    );


  const m=
    Math.floor(
      x.length/2
    );


  return(
    x.length%2
      ?x[m]
      :(x[m-1]+x[m])/2
  );

}


/*
==================================================
座標グループ
==================================================
*/

function groupPositions(
  values,
  tolerance
){

  const s=
    values
      .slice()
      .sort(
        (a,b)=>a-b
      );


  const groups=[];


  for(
    const v of s
  ){

    if(!groups.length){

      groups.push([v]);

      continue;

    }


    const g=
      groups[
        groups.length-1
      ];


    const center=
      g.reduce(
        (a,b)=>a+b,
        0
      )/g.length;


    if(
      Math.abs(
        v-center
      )<=tolerance
    ){

      g.push(v);

    }else{

      groups.push([v]);

    }

  }


  return groups.map(

    g=>
      g.reduce(
        (a,b)=>a+b,
        0
      )/g.length

  );

}


/*
==================================================
規則的なグリッドを選ぶ
==================================================
*/

function chooseGrid(groups){

  if(groups.length<4)
    return null;


  let best=null;


  for(
    let start=0;
    start<groups.length;
    start++
  ){

    for(
      let n=4;
      n<=20;
      n++
    ){

      if(
        start+n>
        groups.length
      ){

        break;

      }


      const a=
        groups.slice(
          start,
          start+n
        );


      const diffs=[];


      for(
        let i=1;
        i<a.length;
        i++
      ){

        diffs.push(
          a[i]-a[i-1]
        );

      }


      const sp=
        median(diffs);


      if(sp<=0)continue;


      let err=0;


      for(
        const d of diffs
      ){

        err+=
          Math.abs(d-sp)/sp;

      }


      err/=diffs.length;


      const score=
        err-
        (n===10?.15:0);


      if(
        !best ||
        score<best.score
      ){

        best={

          score,

          positions:a

        };

      }

    }

  }


  return best;

}


/*
==================================================
盤面検出
==================================================
*/

function detectBoard(img){

  const image=
    makeCanvasImage(img);


  const mask=
    makeColorMask(image);


  const components=
    findComponents(
      image,
      mask
    );


  if(
    components.length<20
  ){

    throw new Error(

      "色付きの正方形マスを十分に検出できませんでした。"

    );

  }


  const areas=
    components.map(
      c=>c.area
    );


  const medArea=
    median(areas);


  let candidates=
    components.filter(

      c=>
        c.area>
        medArea*0.45 &&

        c.area<
        medArea*2.0 &&

        c.width/c.height>
        0.65 &&

        c.width/c.height<
        1.5

    );


  if(
    candidates.length<20
  ){

    candidates=
      components.filter(

        c=>
          c.width/c.height>
          0.65 &&

          c.width/c.height<
          1.5

      );

  }


  if(
    candidates.length<20
  ){

    throw new Error(

      "盤面の正方形マスを十分に検出できませんでした。"

    );

  }


  const medW=
    median(
      candidates.map(
        c=>c.width
      )
    );


  const medH=
    median(
      candidates.map(
        c=>c.height
      )
    );


  candidates=
    candidates.filter(

      c=>

        c.width>
        medW*.55 &&

        c.width<
        medW*1.55 &&

        c.height>
        medH*.55 &&

        c.height<
        medH*1.55

    );


  const xs=
    groupPositions(

      candidates.map(
        c=>c.x
      ),

      Math.max(
        4,
        medW*.4
      )

    );


  const ys=
    groupPositions(

      candidates.map(
        c=>c.y
      ),

      Math.max(
        4,
        medH*.4
      )

    );


  const gx=
    chooseGrid(xs);


  const gy=
    chooseGrid(ys);


  if(
    !gx ||
    !gy
  ){

    throw new Error(

      "盤面の行・列を検出できませんでした。"

    );

  }


  const xPositions=
    gx.positions.length===10
      ?gx.positions
      :findBestTen(xs);


  const yPositions=
    gy.positions.length===10
      ?gy.positions
      :findBestTen(ys);


  if(
    xPositions.length!==10 ||
    yPositions.length!==10
  ){

    throw new Error(

      `10×10の盤面を認識できませんでした。

候補：
${yPositions.length}行×${xPositions.length}列`

    );

  }


  const colors=[];


  const distances=[];


  for(
    let r=0;
    r<10;
    r++
  ){

    for(
      let c=0;
      c<10;
      c++
    ){

      const x=
        xPositions[c];


      const y=
        yPositions[r];


      const nearest=
        findCellColor(

          image,

          x,

          y,

          medW,

          medH

        );


      if(
        nearest.distance>
        COLOR_TOLERANCE
      ){

        throw new Error(

          `${r+1}行${c+1}列の色を認識できませんでした。`

        );

      }


      colors.push(
        nearest.index
      );


      distances.push(
        nearest.distance
      );

    }

  }


  return{

    rows:10,

    cols:10,

    colors,

    components:
      candidates.length,

    distances,

    imageWidth:
      image.width,

    imageHeight:
      image.height

  };

}


/*
==================================================
10個の座標を選択
==================================================
*/

function findBestTen(groups){

  if(groups.length<10)
    return groups;


  let best=null;


  for(
    let s=0;
    s+10<=groups.length;
    s++
  ){

    const a=
      groups.slice(
        s,
        s+10
      );


    const diffs=[];


    for(
      let i=1;
      i<a.length;
      i++
    ){

      diffs.push(
        a[i]-a[i-1]
      );

    }


    const sp=
      median(diffs);


    let err=0;


    for(
      const d of diffs
    ){

      err+=
        Math.abs(d-sp)/sp;

    }


    err/=diffs.length;


    if(
      !best ||
      err<best.err
    ){

      best={
        a,
        err
      };

    }

  }


  return best.a;

}


/*
==================================================
各マスの色を読み取る
==================================================
*/

function findCellColor(
  image,
  cx,
  cy,
  w,
  h
){

  const{
    data,
    width,
    height
  }=image;


  /*
  マス中央付近だけを調べます。

  境界線や白い隙間を避けるため、
  マス全体ではなく中央18%程度を使います。
  */

  const rx=
    Math.max(
      2,
      Math.floor(w*.18)
    );


  const ry=
    Math.max(
      2,
      Math.floor(h*.18)
    );


  const samples=[];


  for(
    let y=
      Math.round(cy)-ry;

    y<=
      Math.round(cy)+ry;

    y++
  ){

    if(
      y<0 ||
      y>=height
    )continue;


    for(
      let x=
        Math.round(cx)-rx;

      x<=
        Math.round(cx)+rx;

      x++
    ){

      if(
        x<0 ||
        x>=width
      )continue;


      const p=
        (y*width+x)*4;


      samples.push({

        r:data[p],

        g:data[p+1],

        b:data[p+2]

      });

    }

  }


  if(!samples.length){

    return{

      index:-1,

      distance:Infinity

    };

  }


  /*
  中央部分のRGB中央値を取得します。
  */

  const rgb={

    r:
      median(
        samples.map(
          s=>s.r
        )
      ),

    g:
      median(
        samples.map(
          s=>s.g
        )
      ),

    b:
      median(
        samples.map(
          s=>s.b
        )
      )

  };


  return nearestGameColor(rgb);

}


/*
==================================================
パズルを解く
==================================================
*/

function solvePuzzle(
  colors,
  rows,
  cols
){

  const colorCount=10;


  const positions=
    Array.from(
      {
        length:10
      },
      ()=>[]
    );


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      positions[
        colors[
          r*cols+c
        ]
      ].push([
        r,
        c
      ]);

    }

  }


  for(
    const p of positions
  ){

    if(!p.length)
      return null;

  }


  const placed=
    new Array(10)
      .fill(null);


  const usedRows=
    new Uint8Array(rows);


  const usedCols=
    new Uint8Array(cols);


  function canPlace(r,c){

    if(
      usedRows[r] ||
      usedCols[c]
    ){

      return false;

    }


    for(
      const p of placed
    ){

      if(!p)continue;


      /*
      縦・横・斜めの隣接を禁止
      */

      if(

        Math.abs(
          p[0]-r
        )<=1 &&

        Math.abs(
          p[1]-c
        )<=1

      ){

        return false;

      }

    }


    return true;

  }


  function search(done){

    if(done===10){

      return placed.map(
        p=>[
          p[0],
          p[1]
        ]
      );

    }


    let bestColor=-1;

    let bestCandidates=null;


    /*
    現在置ける場所が最も少ない色から
    調べることで高速化します。
    */

    for(
      let color=0;
      color<10;
      color++
    ){

      if(
        placed[color]
      )continue;


      const candidates=
        positions[color]
          .filter(
            p=>
              canPlace(
                p[0],
                p[1]
              )
          );


      if(
        !candidates.length
      ){

        return null;

      }


      if(

        !bestCandidates ||

        candidates.length<
        bestCandidates.length

      ){

        bestColor=color;

        bestCandidates=
          candidates;

      }

    }


    for(
      const p of bestCandidates
    ){

      const r=p[0];

      const c=p[1];


      placed[bestColor]=p;

      usedRows[r]=1;

      usedCols[c]=1;


      const result=
        search(done+1);


      if(result)
        return result;


      placed[bestColor]=null;

      usedRows[r]=0;

      usedCols[c]=0;

    }


    return null;

  }


  return search(0);

}


/*
==================================================
結果表示
==================================================
*/

function drawResult(
  colors,
  rows,
  cols,
  solution
){

  resultGrid.innerHTML="";

  legend.innerHTML="";


  resultGrid.style.gridTemplateColumns=
    `repeat(${cols},42px)`;


  const cats=
    new Set();


  if(solution){

    for(
      const p of solution
    ){

      cats.add(
        `${p[0]},${p[1]}`
      );

    }

  }


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const cell=
        document.createElement(
          "div"
        );


      cell.className=
        "gridCell";


      const id=
        colors[
          r*cols+c
        ];


      cell.style.background=
        `rgb(
          ${GAME_COLORS[id].r},
          ${GAME_COLORS[id].g},
          ${GAME_COLORS[id].b}
        )`;


      if(
        cats.has(
          `${r},${c}`
        )
      ){

        cell.classList.add(
          "cat"
        );


        cell.textContent="🐱";

      }


      cell.title=
        `${r+1}行${c+1}列 / ${GAME_COLORS[id].name}`;


      resultGrid.appendChild(
        cell
      );

    }

  }


  /*
  色の凡例
  */

  for(
    let i=0;
    i<10;
    i++
  ){

    const item=
      document.createElement(
        "div"
      );


    item.className=
      "legendItem";


    item.textContent=
      GAME_COLORS[i].name;


    item.style.background=
      `rgb(
        ${GAME_COLORS[i].r},
        ${GAME_COLORS[i].g},
        ${GAME_COLORS[i].b}
      )`;


    legend.appendChild(
      item
    );

  }

}
