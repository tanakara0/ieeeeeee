<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫パズル自動解答</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f5f7fb;
  color:#222;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif
}

main{
  max-width:1100px;
  margin:auto;
  padding:24px
}

.card{
  background:#fff;
  border:1px solid #e1e5ea;
  border-radius:16px;
  padding:20px;
  margin:16px 0;
  box-shadow:0 4px 16px rgba(0,0,0,.05)
}

h1{
  margin:0 0 10px
}

h2{
  margin:0 0 12px
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

button,
.file-label{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:700;
  cursor:pointer;
  background:#2563eb;
  color:#fff
}

button.secondary,
.file-label.secondary{
  background:#e9edf2;
  color:#222
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

input[type=file]{
  display:none
}

.small{
  font-size:13px;
  color:#667085;
  line-height:1.8
}

.status{
  margin-top:12px;
  padding:14px;
  border-radius:10px;
  background:#eef4ff;
  white-space:pre-wrap;
  line-height:1.7
}

.status.ok{
  background:#eaf8f0;
  color:#166534
}

.status.bad{
  background:#fff0ef;
  color:#991b1b
}

.preview{
  display:block;
  max-width:100%;
  max-height:700px;
  margin-top:14px;
  border:1px solid #ddd;
  border-radius:12px
}

.grid-wrap{
  overflow:auto;
  padding:12px
}

.grid{
  display:grid;
  gap:3px;
  width:max-content;
  margin:auto
}

.cell{
  width:38px;
  height:38px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  border:1px solid rgba(255,255,255,.7)
}

.cell.cat{
  outline:3px solid #111;
  outline-offset:-3px
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:13px
}

.debug{
  margin-top:12px;
  background:#f3f4f6;
  border-radius:10px;
  padding:12px;
  white-space:pre-wrap;
  font:12px/1.6 monospace;
  overflow:auto
}
</style>
</head>

<body>

<main>

<h1>🐱 猫パズル自動解答</h1>

<div class="card">

<h2>1. スクリーンショットを読み込む</h2>

<div class="controls">

<label
  class="file-label"
  for="file"
>
画像を選択
</label>

<button
  id="solveBtn"
  disabled
>
読み取って解く
</button>

<button
  id="clearBtn"
  class="secondary"
>
クリア
</button>

<input
  id="file"
  type="file"
  accept="image/*"
>

</div>

<p class="small">

<b>重要：</b>

ゲーム画面そのもののスクリーンショットを選択してください。

ブラウザでこのサイトを撮影した画像ではなく、
元のゲーム画面の画像を使用してください。

<br>

盤面は

<b>4×4～20×20</b>

を自動判定します。

<br>

色は登録した

<b>最大10色</b>

までです。

<br>

行数と列数は同じである必要はありません。

</p>

<div
  id="status"
  class="status"
>
画像を選択してください。
</div>

<div id="previewBox"></div>

</div>



<div class="card">

<h2>2. 解答</h2>

<div
  id="info"
  class="small"
>
まだ解析していません。
</div>

<div class="grid-wrap">

<div
  id="grid"
  class="grid"
>
</div>

</div>

<div
  id="legend"
  class="legend"
>
</div>

<div
  id="debug"
  class="debug"
  style="display:none"
>
</div>

</div>



<div class="card">

<h2>ルール</h2>

<ul>

<li>1色につき猫は1匹</li>

<li>同じ行に猫を2匹置かない</li>

<li>同じ列に猫を2匹置かない</li>

<li>
上下左右・斜めに隣接する位置には猫を置かない
</li>

</ul>

</div>

</main>



<script>

"use strict";



/*
====================================================
ゲームで使用される色
====================================================

色は最大10色固定です。

盤面が20×20になっても
色の種類は最大10色として扱います。
*/

const GAME_COLORS = [

  {
    name:"黄色",
    r:227,
    g:188,
    b:73
  },

  {
    name:"青緑",
    r:72,
    g:181,
    b:178
  },

  {
    name:"赤",
    r:213,
    g:115,
    b:117
  },

  {
    name:"紫",
    r:151,
    g:120,
    b:214
  },

  {
    name:"ピンク",
    r:235,
    g:133,
    b:183
  },

  {
    name:"薄ピンク",
    r:249,
    g:180,
    b:208
  },

  {
    name:"薄青",
    r:166,
    g:191,
    b:215
  },

  {
    name:"茶色",
    r:173,
    g:111,
    b:72
  },

  {
    name:"水色",
    r:106,
    g:188,
    b:230
  },

  {
    name:"緑",
    r:173,
    g:217,
    b:148
  }

];



/*
====================================================
基本設定
====================================================
*/

const MIN_DIM = 4;

const MAX_DIM = 20;

const COLOR_TOLERANCE = 58;



const fileInput =
  document.getElementById("file");

const solveBtn =
  document.getElementById("solveBtn");

const clearBtn =
  document.getElementById("clearBtn");

const statusEl =
  document.getElementById("status");

const previewBox =
  document.getElementById("previewBox");

const infoEl =
  document.getElementById("info");

const gridEl =
  document.getElementById("grid");

const legendEl =
  document.getElementById("legend");

const debugEl =
  document.getElementById("debug");


let selectedFile = null;



/*
====================================================
画像選択
====================================================
*/

fileInput.addEventListener(
  "change",
  () => {

    selectedFile =
      fileInput.files &&
      fileInput.files[0]
        ? fileInput.files[0]
        : null;


    gridEl.innerHTML =
      "";

    legendEl.innerHTML =
      "";

    debugEl.style.display =
      "none";

    infoEl.textContent =
      "まだ解析していません。";


    if(!selectedFile){

      solveBtn.disabled =
        true;

      previewBox.innerHTML =
        "";

      setStatus(
        "画像を選択してください。"
      );

      return;

    }


    const url =
      URL.createObjectURL(
        selectedFile
      );


    const img =
      new Image();


    img.onload =
      () => {

        img.className =
          "preview";

        img.alt =
          "選択した画像";

        previewBox.innerHTML =
          "";

        previewBox.appendChild(
          img
        );

        URL.revokeObjectURL(
          url
        );

      };


    img.src =
      url;


    solveBtn.disabled =
      false;


    setStatus(
      "画像を読み込みました。「読み取って解く」を押してください。"
    );

  }
);



/*
====================================================
クリア
====================================================
*/

clearBtn.addEventListener(
  "click",
  () => {

    selectedFile =
      null;

    fileInput.value =
      "";

    previewBox.innerHTML =
      "";

    gridEl.innerHTML =
      "";

    legendEl.innerHTML =
      "";

    debugEl.style.display =
      "none";

    infoEl.textContent =
      "まだ解析していません。";

    solveBtn.disabled =
      true;

    setStatus(
      "画像を選択してください。"
    );

  }
);



/*
====================================================
解答開始
====================================================
*/

solveBtn.addEventListener(
  "click",
  async () => {

    if(!selectedFile){

      return;

    }


    solveBtn.disabled =
      true;


    try{

      setStatus(
        "① 画像を読み込んでいます…"
      );


      const img =
        await loadImage(
          selectedFile
        );


      setStatus(
        "② まず盤面全体を探しています…"
      );


      const board =
        detectBoard(
          img
        );


      showDebug(
        board
      );


      setStatus(

        `③ 盤面を ${board.rows}×${board.cols} と認識しました。\n` +

        "④ 盤面内部の行・列と色を確認しています…"

      );


      const solution =
        solvePuzzle(
          board.colors,
          board.rows,
          board.cols,
          board.colorCount
        );


      renderBoard(
        board.colors,
        board.rows,
        board.cols,
        solution
      );


      if(!solution){

        infoEl.textContent =

          `盤面：${board.rows}×${board.cols}\n` +

          `色：${board.colorCount}種類\n\n` +

          "現在のルールでは解が見つかりませんでした。" +

          "色の誤認識が残っている可能性があります。";


        setStatus(
          "盤面は認識できましたが、解が見つかりませんでした。",
          true
        );

      }

      else{

        const positions =
          solution
            .map(
              ([r,c]) =>
                `${r+1}行${c+1}列`
            )
            .join("、");


        infoEl.textContent =

          `盤面：${board.rows}×${board.cols}\n` +

          `色：${board.colorCount}種類\n` +

          `猫：${solution.length}匹\n\n` +

          `猫の位置：${positions}`;


        setStatus(

          "解答が見つかりました！\n" +

          "黒い枠と🐱が猫の位置です。",

          false,

          true

        );

      }


    }

    catch(e){

      console.error(e);


      setStatus(

        "読み取りに失敗しました。\n\n" +

        (
          e &&
          e.message
            ? e.message
            : String(e)
        ),

        true

      );


      infoEl.textContent =
        "解析できませんでした。";

    }

    finally{

      solveBtn.disabled =
        false;

    }

  }
);



/*
====================================================
ステータス表示
====================================================
*/

function setStatus(
  text,
  bad=false,
  ok=false
){

  statusEl.textContent =
    text;


  statusEl.className =
    "status" +

    (
      bad
        ? " bad"
        : ok
          ? " ok"
          : ""
    );

}



/*
====================================================
画像読み込み
====================================================
*/

function loadImage(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const img =
        new Image();


      img.onload =
        () => {

          URL.revokeObjectURL(
            url
          );

          resolve(
            img
          );

        };


      img.onerror =
        () => {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "画像を開けませんでした。"
            )
          );

        };


      img.src =
        url;

    }
  );

}



/*
====================================================
画像データ取得
====================================================
*/

function getImageData(
  img
){

  const maxWidth =
    1800;


  const scale =
    Math.min(
      1,
      maxWidth /
      img.naturalWidth
    );


  const width =
    Math.max(
      1,
      Math.round(
        img.naturalWidth *
        scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        img.naturalHeight *
        scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  return {

    data:
      ctx.getImageData(
        0,
        0,
        width,
        height
      ),

    width,

    height

  };

}



/*
====================================================
RGB距離
====================================================
*/

function rgbDist(
  a,
  b
){

  return Math.hypot(

    a.r -
    b.r,

    a.g -
    b.g,

    a.b -
    b.b

  );

}



/*
====================================================
最も近いゲーム色
====================================================
*/

function nearestGameColor(
  rgb
){

  let best =
    -1;

  let bestD =
    Infinity;


  for(
    let i=0;
    i<GAME_COLORS.length;
    i++
  ){

    const d =
      rgbDist(
        rgb,
        GAME_COLORS[i]
      );


    if(
      d <
      bestD
    ){

      bestD =
        d;

      best =
        i;

    }

  }


  return {

    index:
      best,

    distance:
      bestD

  };

}



/*
====================================================
中央値
====================================================
*/

function median(
  a
){

  if(
    !a.length
  ){

    return 0;

  }


  const x =
    [...a].sort(
      (
        p,
        q
      ) =>
        p-q
    );


  const m =
    Math.floor(
      x.length/2
    );


  return (

    x.length % 2

      ? x[m]

      : (
          x[m-1] +
          x[m]
        ) / 2

  );

}



/*
====================================================
色マスク
====================================================

盤面全体を探すためだけに使用します。

ここではまだ行・列を決めません。
*/

function makeColorMask(
  image
){

  const {

    data,
    width,
    height

  } = image;


  const n =
    width *
    height;


  const mask =
    new Uint8Array(
      n
    );


  for(
    let p=0;
    p<n;
    p++
  ){

    const i =
      p*4;


    if(
      data[i+3] <
      80
    ){

      continue;

    }


    const hit =
      nearestGameColor({

        r:data[i],

        g:data[i+1],

        b:data[i+2]

      });


    if(
      hit.distance <=
      COLOR_TOLERANCE
    ){

      mask[p] =
        1;

    }

  }


  return mask;

}



/*
====================================================
盤面全体を探す
====================================================
*/

function findBoardBounds(
  mask,
  width,
  height
){

  const row =
    new Int32Array(
      height
    );


  const col =
    new Int32Array(
      width
    );


  /*
  横方向の色付きピクセル数
  */

  for(
    let y=0;
    y<height;
    y++
  ){

    let n=0;


    for(
      let x=0;
      x<width;
      x++
    ){

      if(
        mask[
          y*width+x
        ]
      ){

        n++;

      }

    }


    row[y]=n;

  }



  /*
  縦方向の色付きピクセル数
  */

  for(
    let x=0;
    x<width;
    x++
  ){

    let n=0;


    for(
      let y=0;
      y<height;
      y++
    ){

      if(
        mask[
          y*width+x
        ]
      ){

        n++;

      }

    }


    col[x]=n;

  }


  const rowThreshold =
    Math.max(
      8,
      Math.floor(
        width*0.035
      )
    );


  const colThreshold =
    Math.max(
      8,
      Math.floor(
        height*0.035
      )
    );


  const yRuns =
    makeRuns(
      row,
      rowThreshold,
      2
    );


  const xRuns =
    makeRuns(
      col,
      colThreshold,
      2
    );


  if(
    !yRuns.length ||
    !xRuns.length
  ){

    throw new Error(

      "色付きマスの大きな盤面を見つけられませんでした。"

    );

  }


  let best =
    null;


  /*
  大きな長方形候補を探します。
  */

  for(
    const yr of yRuns
  ){

    for(
      const xr of xRuns
    ){

      const w =
        xr.end -
        xr.start +
        1;


      const h =
        yr.end -
        yr.start +
        1;


      if(
        w < 80 ||
        h < 80
      ){

        continue;

      }


      const density =
        rectDensity(

          mask,

          width,

          height,

          xr.start,

          yr.start,

          xr.end,

          yr.end

        );


      if(
        density < 0.20
      ){

        continue;

      }


      const area =
        w*h;


      const score =
        density *
        Math.sqrt(
          area
        );


      if(
        !best ||
        score >
        best.score
      ){

        best={

          x0:xr.start,

          y0:yr.start,

          x1:xr.end,

          y1:yr.end,

          score,

          density

        };

      }

    }

  }


  if(
    !best
  ){

    throw new Error(

      "盤面全体を一つの大きなまとまりとして検出できませんでした。\n\n" +

      "元のゲーム画面のスクリーンショットを使用してください。"

    );

  }


  return best;

}



/*
====================================================
連続区間
====================================================
*/

function makeRuns(
  values,
  threshold,
  minLen
){

  const out=[];

  let s=-1;


  for(
    let i=0;
    i<values.length;
    i++
  ){

    if(
      values[i] >=
      threshold
    ){

      if(
        s<0
      ){

        s=i;

      }

    }

    else if(
      s>=0
    ){

      if(
        i-s >=
        minLen
      ){

        out.push({

          start:s,

          end:i-1

        });

      }


      s=-1;

    }

  }


  if(
    s>=0 &&
    values.length-s >=
    minLen
  ){

    out.push({

      start:s,

      end:
        values.length-1

    });

  }


  return out;

}



/*
====================================================
長方形の色密度
====================================================
*/

function rectDensity(
  mask,
  width,
  height,
  x0,
  y0,
  x1,
  y1
){

  const step =
    Math.max(
      1,
      Math.floor(
        Math.min(
          x1-x0+1,
          y1-y0+1
        )/120
      )
    );


  let hit=0;

  let total=0;


  for(
    let y=y0;
    y<=y1;
    y+=step
  ){

    for(
      let x=x0;
      x<=x1;
      x+=step
    ){

      total++;


      if(
        mask[
          y*width+x
        ]
      ){

        hit++;

      }

    }

  }


  return total
    ? hit/total
    : 0;

}



/*
====================================================
盤面内の行・列を検出
====================================================
*/

function detectLinesInBoard(
  mask,
  width,
  height,
  bounds
){

  const row =
    new Int32Array(
      bounds.y1 -
      bounds.y0 +
      1
    );


  const col =
    new Int32Array(
      bounds.x1 -
      bounds.x0 +
      1
    );


  for(
    let y=bounds.y0;
    y<=bounds.y1;
    y++
  ){

    let n=0;


    for(
      let x=bounds.x0;
      x<=bounds.x1;
      x++
    ){

      if(
        mask[
          y*width+x
        ]
      ){

        n++;

      }

    }


    row[
      y-bounds.y0
    ] = n;

  }


  for(
    let x=bounds.x0;
    x<=bounds.x1;
    x++
  ){

    let n=0;


    for(
      let y=bounds.y0;
      y<=bounds.y1;
      y++
    ){

      if(
        mask[
          y*width+x
        ]
      ){

        n++;

      }

    }


    col[
      x-bounds.x0
    ] = n;

  }


  return {

    row,

    col

  };

}



/*
====================================================
行・列候補
====================================================
*/

function lineRuns(
  values,
  ratio
){

  const max =
    Math.max(
      ...values
    );


  const threshold =
    Math.max(
      2,
      max*ratio
    );


  return makeRuns(
    values,
    threshold,
    1
  );

}



/*
====================================================
中心座標
====================================================
*/

function centersFromRuns(
  runs,
  offset
){

  return runs.map(
    r => ({

      center:
        offset +
        (
          r.start +
          r.end
        )/2,

      size:
        r.end -
        r.start +
        1

    })
  );

}



/*
====================================================
4～20のグリッドを探す
====================================================
*/

function chooseDimension(
  rowCenters,
  colCenters,
  bounds
){

  let best =
    null;


  for(
    let rows=MIN_DIM;
    rows<=MAX_DIM;
    rows++
  ){

    if(
      rowCenters.length <
      rows
    ){

      continue;

    }


    for(
      let cols=MIN_DIM;
      cols<=MAX_DIM;
      cols++
    ){

      if(
        colCenters.length <
        cols
      ){

        continue;

      }


      const rowOptions =
        windowGroups(
          rowCenters,
          rows
        );


      const colOptions =
        windowGroups(
          colCenters,
          cols
        );


      for(
        const rg of
        rowOptions
      ){

        for(
          const cg of
          colOptions
        ){

          const rowSpace =
            spacingScore(
              rg
            );


          const colSpace =
            spacingScore(
              cg
            );


          if(
            !Number.isFinite(
              rowSpace
            ) ||
            !Number.isFinite(
              colSpace
            )
          ){

            continue;

          }


          const h =
            rg[rg.length-1].center -
            rg[0].center;


          const w =
            cg[cg.length-1].center -
            cg[0].center;


          if(
            w<=0 ||
            h<=0
          ){

            continue;

          }


          const expectedCellW =
            w /
            Math.max(
              1,
              cols-1
            );


          const expectedCellH =
            h /
            Math.max(
              1,
              rows-1
            );


          const sizeRatio =
            Math.abs(
              expectedCellW -
              expectedCellH
            ) /
            Math.max(
              expectedCellW,
              expectedCellH
            );


          const edgePenalty =

            Math.abs(
              (
                cg[0].center -
                bounds.x0
              ) -
              expectedCellW*0.5
            ) /
            Math.max(
              1,
              expectedCellW
            )

            +

            Math.abs(
              (
                bounds.x1 -
                cg[cg.length-1].center
              ) -
              expectedCellW*0.5
            ) /
            Math.max(
              1,
              expectedCellW
            );


          const score =

            rowSpace +

            colSpace +

            sizeRatio*2 +

            edgePenalty*.25;


          if(
            !best ||
            score <
            best.score
          ){

            best={

              rows,

              cols,

              rowsG:rg,

              colsG:cg,

              score

            };

          }

        }

      }

    }

  }


  return best;

}



/*
====================================================
候補の組み合わせ
====================================================
*/

function windowGroups(
  arr,
  n
){

  if(
    arr.length<n
  ){

    return [];

  }


  const out=[];


  for(
    let s=0;
    s+n<=arr.length;
    s++
  ){

    out.push(
      arr.slice(
        s,
        s+n
      )
    );

  }


  return out;

}



/*
====================================================
等間隔評価
====================================================
*/

function spacingScore(
  g
){

  if(
    g.length<2
  ){

    return Infinity;

  }


  const d=[];


  for(
    let i=1;
    i<g.length;
    i++
  ){

    d.push(

      g[i].center -
      g[i-1].center

    );

  }


  const m =
    median(
      d
    );


  if(
    m<=0
  ){

    return Infinity;

  }


  return (

    d.reduce(
      (
        s,
        v
      ) =>
        s +
        Math.abs(
          v-m
        ),
      0
    )

    /

    d.length

    /

    m

  );

}



/*
====================================================
マス中央の色
====================================================
*/

function sampleCellColor(
  data,
  width,
  height,
  cx,
  cy,
  cellW,
  cellH
){

  const rx =
    Math.max(
      1,
      Math.floor(
        cellW*.22
      )
    );


  const ry =
    Math.max(
      1,
      Math.floor(
        cellH*.22
      )
    );


  const vals=[];


  for(
    let y=
      Math.round(
        cy-ry
      );

    y<=
      Math.round(
        cy+ry
      );

    y++
  ){

    for(
      let x=
        Math.round(
          cx-rx
        );

      x<=
        Math.round(
          cx+rx
        );

      x++
    ){

      if(
        x<0 ||
        y<0 ||
        x>=width ||
        y>=height
      ){

        continue;

      }


      const i =
        (
          y*width+x
        )*4;


      if(
        data[i+3] <
        80
      ){

        continue;

      }


      const hit =
        nearestGameColor({

          r:data[i],

          g:data[i+1],

          b:data[i+2]

        });


      if(
        hit.distance <=
        COLOR_TOLERANCE
      ){

        vals.push({

          r:data[i],

          g:data[i+1],

          b:data[i+2]

        });

      }

    }

  }


  if(
    !vals.length
  ){

    return null;

  }


  return nearestGameColor({

    r:
      median(
        vals.map(
          v=>v.r
        )
      ),

    g:
      median(
        vals.map(
          v=>v.g
        )
      ),

    b:
      median(
        vals.map(
          v=>v.b
        )
      )

  });

}



/*
====================================================
盤面検出
====================================================
*/

function detectBoard(
  img
){

  const image =
    getImageData(
      img
    );


  const {
    data,
    width,
    height
  } = image;


  const mask =
    makeColorMask(
      image
    );


  setStatus(
    "② 盤面全体を一つの大きなまとまりとして検出しています…"
  );


  const bounds =
    findBoardBounds(
      mask,
      width,
      height
    );


  setStatus(
    "③ 盤面の中から行と列を検出しています…"
  );


  const lines =
    detectLinesInBoard(
      mask,
      width,
      height,
      bounds
    );


  const rowRuns =
    lineRuns(
      lines.row,
      .18
    );


  const colRuns =
    lineRuns(
      lines.col,
      .18
    );


  if(
    rowRuns.length <
    MIN_DIM ||

    colRuns.length <
    MIN_DIM
  ){

    throw new Error(

      "盤面は見つかりましたが、行・列を十分に分離できませんでした。\n\n" +

      "行候補：" +
      rowRuns.length +

      "\n" +

      "列候補：" +
      colRuns.length

    );

  }


  const rows =
    centersFromRuns(
      rowRuns,
      bounds.y0
    );


  const cols =
    centersFromRuns(
      colRuns,
      bounds.x0
    );


  const chosen =
    chooseDimension(
      rows,
      cols,
      bounds
    );


  if(
    !chosen
  ){

    throw new Error(

      "盤面内部から4～20行・4～20列の規則的なグリッドを決定できませんでした。\n\n" +

      "行候補：" +
      rows.length +

      "\n" +

      "列候補：" +
      cols.length

    );

  }


  const rowCenters =
    chosen.rowsG.map(
      x=>x.center
    );


  const colCenters =
    chosen.colsG.map(
      x=>x.center
    );


  const cellW =
    median(
      chosen.colsG.map(
        x=>x.size
      )
    );


  const cellH =
    median(
      chosen.rowsG.map(
        x=>x.size
      )
    );


  const colors=[];

  const distances=[];


  for(
    let r=0;
    r<chosen.rows;
    r++
  ){

    for(
      let c=0;
      c<chosen.cols;
      c++
    ){

      const s =
        sampleCellColor(

          data,

          width,

          height,

          colCenters[c],

          rowCenters[r],

          cellW,

          cellH

        );


      if(
        !s ||
        s.distance >
        COLOR_TOLERANCE
      ){

        throw new Error(

          `${r+1}行${c+1}列の色を認識できませんでした。\n\n` +

          `RGB距離：` +

          (
            s
              ? Math.round(
                  s.distance
                )
              : "取得不可"
          )

        );

      }


      colors.push(
        s.index
      );


      distances.push(
        s.distance
      );

    }

  }


  const colorSet =
    new Set(
      colors
    );


  if(
    colorSet.size <
    1 ||

    colorSet.size >
    10
  ){

    throw new Error(

      `色数が異常です：${colorSet.size}色。\n\n` +

      "色は最大10色です。"

    );

  }


  return {

    rows:
      chosen.rows,

    cols:
      chosen.cols,

    colors,

    colorCount:
      colorSet.size,

    width,

    height,

    bounds,

    rawRowRuns:
      rowRuns.length,

    rawColRuns:
      colRuns.length,

    rowCandidates:
      rows.length,

    colCandidates:
      cols.length,

    cellW,

    cellH,

    rowCenters,

    colCenters,

    distances

  };

}



/*
====================================================
パズルを解く
====================================================

盤面サイズと色数を完全に分離しています。

例：

10×10 + 10色

20×20 + 10色

どちらも扱えます。

猫の数は色数と同じです。
====================================================
*/

function solvePuzzle(
  colors,
  rows,
  cols,
  colorCount
){

  const positions =
    Array.from(
      {
        length:
          colorCount
      },
      () => []
    );


  /*
  各色がどこに存在するか
  */

  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const k =
        colors[
          r*cols+c
        ];


      if(
        k>=0 &&
        k<colorCount
      ){

        positions[k].push([
          r,
          c
        ]);

      }

    }

  }


  /*
  全色が存在するか確認
  */

  for(
    let k=0;
    k<colorCount;
    k++
  ){

    if(
      !positions[k].length
    ){

      return null;

    }

  }


  const placed =
    new Array(
      colorCount
    ).fill(
      null
    );


  const usedRows =
    new Uint8Array(
      rows
    );


  const usedCols =
    new Uint8Array(
      cols
    );



  /*
  猫を置けるか
  */

  function can(
    r,
    c
  ){

    /*
    同じ行
    */

    if(
      usedRows[r]
    ){

      return false;

    }


    /*
    同じ列
    */

    if(
      usedCols[c]
    ){

      return false;

    }


    /*
    周囲8方向
    */

    for(
      const p of placed
    ){

      if(
        !p
      ){

        continue;

      }


      if(

        Math.abs(
          p[0]-r
        ) <= 1 &&

        Math.abs(
          p[1]-c
        ) <= 1

      ){

        return false;

      }

    }


    return true;

  }



  /*
  バックトラッキング
  */

  function search(
    done
  ){

    if(
      done ===
      colorCount
    ){

      return placed.map(
        p => [
          p[0],
          p[1]
        ]
      );

    }


    let bestK =
      -1;

    let best =
      null;


    /*
    候補が一番少ない色から
    */

    for(
      let k=0;
      k<colorCount;
      k++
    ){

      if(
        placed[k]
      ){

        continue;

      }


      const cand =
        positions[k]
          .filter(
            p =>
              can(
                p[0],
                p[1]
              )
          );


      if(
        !cand.length
      ){

        return null;

      }


      if(
        best === null ||
        cand.length <
        best.length
      ){

        best =
          cand;

        bestK =
          k;


        if(
          cand.length === 1
        ){

          break;

        }

      }

    }


    for(
      const [r,c] of best
    ){

      placed[bestK] =
        [r,c];


      usedRows[r] =
        1;


      usedCols[c] =
        1;


      const ans =
        search(
          done+1
        );


      if(
        ans
      ){

        return ans;

      }


      placed[bestK] =
        null;


      usedRows[r] =
        0;


      usedCols[c] =
        0;

    }


    return null;

  }


  return search(0);

}



/*
====================================================
結果表示
====================================================
*/

function renderBoard(
  colors,
  rows,
  cols,
  solution
){

  gridEl.innerHTML =
    "";

  legendEl.innerHTML =
    "";


  gridEl.style.gridTemplateColumns =
    `repeat(${cols},38px)`;


  const set =
    new Set(
      (
        solution || []
      )
      .map(
        p =>
          p[0] +
          "," +
          p[1]
      )
    );


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const color =
        GAME_COLORS[
          colors[
            r*cols+c
          ]
        ];


      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "cell";


      cell.style.background =
        `rgb(
          ${color.r},
          ${color.g},
          ${color.b}
        )`;


      cell.title =
        `${r+1}行${c+1}列 / ${color.name}`;


      if(
        set.has(
          r +
          "," +
          c
        )
      ){

        cell.classList.add(
          "cat"
        );


        cell.textContent =
          "🐱";

      }


      gridEl.appendChild(
        cell
      );

    }

  }


  /*
  色一覧
  */

  for(
    let i=0;
    i<GAME_COLORS.length;
    i++
  ){

    const c =
      GAME_COLORS[i];


    const badge =
      document.createElement(
        "div"
      );


    badge.className =
      "badge";


    badge.textContent =
      c.name;


    badge.style.background =
      `rgb(
        ${c.r},
        ${c.g},
        ${c.b}
      )`;


    legendEl.appendChild(
      badge
    );

  }

}

デバッグ情報

function showDebug(
  board
){

  debugEl.style.display =
    "block";


  const counts =
    new Array(
      board.colorCount
    ).fill(
      0
    );


  for(
    const c of board.colors
  ){

    counts[c]++;

  }


  let s =
    "";


  s +=
    `画像：${board.width}×${board.height}\n`;


  s +=
    `盤面候補：` +

    `x=${Math.round(board.bounds.x0)}` +

    `～${Math.round(board.bounds.x1)}` +

    `, ` +

    `y=${Math.round(board.bounds.y0)}` +

    `～${Math.round(board.bounds.y1)}\n`;


  s +=
    `盤面候補の大きさ：約` +

    `${Math.round(
      board.bounds.x1 -
      board.bounds.x0 +
      1
    )}` +

    `×` +

    `${Math.round(
      board.bounds.y1 -
      board.bounds.y0 +
      1
    )}px\n`;


  s +=
    `盤面内の行候補：` +

    `${board.rowCandidates}\n`;


  s +=
    `盤面内の列候補：` +

    `${board.colCandidates}\n`;


  s +=
    `最終認識：` +

    `${board.rows}×${board.cols}\n`;


  s +=
    `色：` +

    `${board.colorCount}種類 / 最大10種類\n`;


  s +=
    `推定マスサイズ：約` +

    `${Math.round(board.cellW)}` +

    `×` +

    `${Math.round(board.cellH)}` +

    `px\n\n`;


  for(
    let i=0;
    i<board.colorCount;
    i++
  ){

    s +=
      `${GAME_COLORS[i].name}：` +

      `${counts[i]}マス\n`;

  }


  debugEl.textContent =
    s;

}
