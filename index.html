<script>

"use strict";


/* =========================================================
   ゲームの10色

   実際のゲーム画面から取得した代表的なRGB値
   ========================================================= */

const COLORS = [

    {
        name:"黄色",
        r:227,
        g:188,
        b:73
    },

    {
        name:"青緑",
        r:72,
        g:181,
        b:178
    },

    {
        name:"赤",

        g:115,
        b:117
    },

    {
        name:"紫",
        r:151,
        g:120,
        b:214
    },

    {
        name:"ピンク",
        r:235,
        g:133,
        b:183
    },

    {
        name:"薄ピンク",
        r:249,
        g:180,
        b:208
    },

    {
        name:"薄青",
        r:166,
        g:191,
        b:215
    },

    {
        name:"茶色",
        r:173,
        g:111,
        b:72
    },

    {
        name:"水色",
        r:106,
        g:188,
        b:230
    },

    {
        name:"緑",
        r:173,
        g:217,
        b:148
    }

];


/* =========================================================
   設定
   ========================================================= */

const MIN_SIZE = 4;

const MAX_SIZE = 20;


/*
   色判定の許容距離

   実際のゲーム画像ではかなり正確な色なので、
   まず45程度で判定します。
*/
const COLOR_DISTANCE_LIMIT = 55;


/* =========================================================
   DOM
   ========================================================= */

const imageInput =
    document.getElementById("imageInput");

const solveButton =
    document.getElementById("solveButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");

const preview =
    document.getElementById("preview");

const info =
    document.getElementById("info");

const boardElement =
    document.getElementById("board");

const legend =
    document.getElementById("legend");

const debug =
    document.getElementById("debug");


let selectedFile = null;


/* =========================================================
   ステータス表示
   ========================================================= */

function setStatus(
    message,
    type=""
){

    status.textContent =
        message;

    status.className =
        "status";

    if(type){

        status.classList.add(type);

    }

}


/* =========================================================
   ファイル選択
   ========================================================= */

imageInput.addEventListener(
    "change",
    function(){

        selectedFile =
            imageInput.files &&
            imageInput.files.length
                ? imageInput.files[0]
                : null;


        boardElement.innerHTML =
            "";

        legend.innerHTML =
            "";

        debug.style.display =
            "none";

        info.textContent =
            "まだ解析していません。";


        if(!selectedFile){

            solveButton.disabled =
                true;

            preview.innerHTML =
                "";

            setStatus(
                "画像を選択してください。"
            );

            return;

        }


        const url =
            URL.createObjectURL(
                selectedFile
            );


        const img =
            new Image();


        img.onload =
            function(){

                img.className =
                    "preview";

                img.alt =
                    "選択したゲーム画像";

                preview.innerHTML =
                    "";

                preview.appendChild(
                    img
                );

                URL.revokeObjectURL(
                    url
                );

            };


        img.src =
            url;


        solveButton.disabled =
            false;


        setStatus(
            "画像を読み込みました。「読み取って解く」を押してください。"
        );

    }
);


/* =========================================================
   クリア
   ========================================================= */

clearButton.addEventListener(
    "click",
    function(){

        selectedFile =
            null;

        imageInput.value =
            "";

        preview.innerHTML =
            "";

        boardElement.innerHTML =
            "";

        legend.innerHTML =
            "";

        info.textContent =
            "まだ解析していません。";

        debug.style.display =
            "none";

        solveButton.disabled =
            true;

        setStatus(
            "画像を選択してください。"
        );

    }
);


/* =========================================================
   解答開始
   ========================================================= */

solveButton.addEventListener(
    "click",
    async function(){

        if(!selectedFile){

            return;

        }


        solveButton.disabled =
            true;


        try{

            setStatus(
                "① 画像を読み込んでいます…"
            );


            const image =
                await loadImage(
                    selectedFile
                );


            setStatus(
                "② 画像の中からゲームの色を探しています…"
            );


            const imageData =
                createImageData(
                    image
                );


            setStatus(
                "③ 色付きの正方形マスを検出しています…"
            );


            const components =
                detectColoredSquares(
                    imageData
                );


            if(
                components.length <
                MIN_SIZE * MIN_SIZE
            ){

                throw new Error(

                    "色付きの正方形マスを十分に検出できませんでした。\n\n" +

                    "検出数：" +
                    components.length +
                    "\n\n" +

                    "ゲーム画面そのもののスクリーンショットを使用してください。"

                );

            }


            setStatus(
                "④ 検出したマスから盤面の大きなまとまりを作っています…"
            );


            const boardCells =
                selectBoardCells(
                    components
                );


            if(
                boardCells.length <
                MIN_SIZE * MIN_SIZE
            ){

                throw new Error(

                    "盤面として認識できるマスが不足しています。\n\n" +

                    "検出した盤面マス：" +
                    boardCells.length +
                    "個"

                );

            }


            setStatus(
                "⑤ 盤面の縦横を計算しています…"
            );


            const board =
                detectRowsAndColumns(
                    boardCells
                );


            setStatus(

                "⑥ " +
                board.rows +
                "×" +
                board.cols +
                " の盤面を認識しました。\n" +

                "各マスのカラーコードを調べています…"

            );


            const colorResult =
                readBoardColors(
                    imageData,
                    board
                );


            setDebug(
                imageData,
                components,
                boardCells,
                board,
                colorResult
            );


            setStatus(
                "⑦ パズルを解いています…"
            );


            const solution =
                solvePuzzle(
                    colorResult.colors,
                    board.rows,
                    board.cols
                );


            renderBoard(
                colorResult.colors,
                board.rows,
                board.cols,
                solution
            );


            if(!solution){

                info.textContent =

                    "盤面：" +
                    board.rows +
                    "×" +
                    board.cols +
                    "\n" +

                    "色：" +
                    colorResult.usedColors.length +
                    "種類\n\n" +

                    "現在のルールでは解が見つかりませんでした。\n\n" +

                    "色の誤認識が残っている可能性があります。";


                setStatus(
                    "盤面は認識できましたが、解が見つかりませんでした。",
                    "error"
                );

            }

            else{

                const positions =
                    solution
                        .map(
                            function(p){

                                return (
                                    (p[0] + 1) +
                                    "行" +
                                    (p[1] + 1) +
                                    "列"
                                );

                            }
                        )
                        .join("、");


                info.textContent =

                    "盤面：" +
                    board.rows +
                    "×" +
                    board.cols +
                    "\n" +

                    "色：" +
                    colorResult.usedColors.length +
                    "種類\n" +

                    "猫：" +
                    solution.length +
                    "匹\n\n" +

                    "猫の位置：\n" +
                    positions;


                setStatus(

                    "解答が見つかりました！\n" +
                    "黒い枠と🐱が猫の位置です。",

                    "ok"

                );

            }

        }

        catch(error){

            console.error(error);


            setStatus(

                "読み取りに失敗しました。\n\n" +

                (
                    error &&
                    error.message
                        ? error.message
                        : String(error)
                ),

                "error"

            );


            info.textContent =
                "解析できませんでした。";

        }

        finally{

            solveButton.disabled =
                false;

        }

    }
);


/* =========================================================
   画像読み込み
   ========================================================= */

function loadImage(file){

    return new Promise(
        function(resolve,reject){

            const url =
                URL.createObjectURL(
                    file
                );


            const img =
                new Image();


            img.onload =
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                    resolve(img);

                };


            img.onerror =
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                    reject(
                        new Error(
                            "画像を読み込めませんでした。"
                        )
                    );

                };


            img.src =
                url;

        }
    );

}


/* =========================================================
   Canvas化
   ========================================================= */

function createImageData(img){

    /*
       大きすぎる画像だけ縮小します。

       ただし最大1800pxなので、
       今回のゲーム画像程度なら
       ほぼそのまま処理できます。
    */

    const maxWidth =
        1800;


    const scale =
        Math.min(
            1,
            maxWidth /
            img.naturalWidth
        );


    const width =
        Math.max(
            1,
            Math.round(
                img.naturalWidth *
                scale
            )
        );


    const height =
        Math.max(
            1,
            Math.round(
                img.naturalHeight *
                scale
            )
        );


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    return {

        data:
            ctx.getImageData(
                0,
                0,
                width,
                height
            ),

        width,
        height

    };

}


/* =========================================================
   RGB距離
   ========================================================= */

function rgbDistance(a,b){

    return Math.sqrt(

        Math.pow(
            a.r - b.r,
            2
        )

        +

        Math.pow(
            a.g - b.g,
            2
        )

        +

        Math.pow(
            a.b - b.b,
            2
        )

    );

}


/* =========================================================
   最も近いゲーム色
   ========================================================= */

function nearestColor(rgb){

    let bestIndex =
        -1;

    let bestDistance =
        Infinity;


    for(
        let i=0;
        i<COLORS.length;
        i++
    ){

        const distance =
            rgbDistance(
                rgb,
                COLORS[i]
            );


        if(
            distance <
            bestDistance
        ){

            bestDistance =
                distance;

            bestIndex =
                i;

        }

    }


    return {

        index:
            bestIndex,

        distance:
            bestDistance

    };

}


/* =========================================================
   色マスク作成
   =========================================================

   重要：

   白い背景や説明文を無視して、
   ゲームの10色に近いピクセルだけを
   マスクにします。

   これによって、
   「色付きマス」を直接探します。
   ========================================================= */

function createGameColorMask(image){

    const data =
        image.data;

    const width =
        image.width;

    const height =
        image.height;


    const mask =
        new Uint8Array(
            width * height
        );


    for(
        let y=0;
        y<height;
        y++
    ){

        for(
            let x=0;
            x<width;
            x++
        ){

            const p =
                (
                    y * width +
                    x
                );


            const i =
                p * 4;


            if(
                data[i+3] <
                80
            ){

                continue;

            }


            const rgb = {

                r:data[i],

                g:data[i+1],

                b:data[i+2]

            };


            const nearest =
                nearestColor(
                    rgb
                );


            /*
              ゲーム色に近いピクセルだけ
            */

            if(
                nearest.distance <=
                COLOR_DISTANCE_LIMIT
            ){

                mask[p] =
                    1;

            }

        }

    }


    return mask;

}

/* =========================================================
   色付き正方形マスを検出
   ========================================================= */
function detectColeredSquares(image){
    /*
    まずゲームに使われている色だけをカラーマスクにします。:/
const mask =
        createGameColorMask(
            image
        );

/* 色がつながっている部分を連結部分として取得します。*/
    const components = findComponents(
        mask,
        image.width
        image.height
    );
    return components;
}

/* =========================================================
   連結成分検出
   ========================================================= */

function findComponents(
    mask,
    width,
    height
){

    const visited =
        new Uint8Array(
            width * height
        );


    const queue =
        new Int32Array(
            width * height
        );


    const components=[];


    for(
        let startY=0;
        startY<height;
        startY++
    ){

        for(
            let startX=0;
            startX<width;
            startX++
        ){

            const start =
                startY * width +
                startX;


            if(
                !mask[start] ||
                visited[start]
            ){

                continue;

            }


            let head =
                0;

            let tail =
                0;


            queue[
                tail++
            ] =
                start;


            visited[start] =
                1;


            let count =
                0;


            let minX =
                startX;

            let maxX =
                startX;

            let minY =
                startY;

            let maxY =
                startY;


            let sumX =
                0;

            let sumY =
                0;


            while(
                head <
                tail
            ){

                const p =
                    queue[
                        head++
                    ];


                const y =
                    Math.floor(
                        p / width
                    );


                const x =
                    p -
                    y * width;


                count++;


                sumX +=
                    x;

                sumY +=
                    y;


                if(
                    x < minX
                ){

                    minX =
                        x;

                }


                if(
                    x > maxX
                ){

                    maxX =
                        x;

                }


                if(
                    y < minY
                ){

                    minY =
                        y;

                }


                if(
                    y > maxY
                ){

                    maxY =
                        y;

                }


                /*
                   左
                */

                if(
                    x > 0
                ){

                    const q =
                        p - 1;


                    if(
                        mask[q] &&
                        !visited[q]
                    ){

                        visited[q] =
                            1;

                        queue[
                            tail++
                        ] =
                            q;

                    }

                }


                /*
                   右
                */

                if(
                    x + 1 <
                    width
                ){

                    const q =
                        p + 1;


                    if(
                        mask[q] &&
                        !visited[q]
                    ){

                        visited[q] =
                            1;

                        queue[
                            tail++
                        ] =
                            q;

                    }

                }


                /*
                   上
                */

                if(
                    y > 0
                ){

                    const q =
                        p - width;


                    if(
                        mask[q] &&
                        !visited[q]
                    ){

                        visited[q] =
                            1;

                        queue[
                            tail++
                        ] =
                            q;

                    }

                }


                /*
                   下
                */

                if(
                    y + 1 <
                    height
                ){

                    const q =
                        p + width;


                    if(
                        mask[q] &&
                        !visited[q]
                    ){

                        visited[q] =
                            1;

                        queue[
                            tail++
                        ] =
                            q;

                    }

                }

            }


            const boxWidth =
                maxX - minX + 1;


            const boxHeight =
                maxY - minY + 1;


            const fill =
                count /
                (
                    boxWidth *
                    boxHeight
                );


            const aspect =
                boxWidth /
                boxHeight;


            /*
               猫アイコンなどを除外。

               ゲームのマスは
               ほぼ正方形です。
            */

            if(

                boxWidth >= 8 &&

                boxHeight >= 8 &&

                aspect >= 0.65 &&

                aspect <= 1.55 &&

                fill >= 0.35

            ){

                components.push({

                    x:minX,

                    y:minY,

                    w:boxWidth,

                    h:boxHeight,

                    area:count,

                    fill,

                    cx:
                        sumX / count,

                    cy:
                        sumY / count

                });

            }

        }

    }


    return components;

}


/* =========================================================
   中央値
   ========================================================= */

function median(values){

    if(
        values.length === 0
    ){

        return 0;

    }


    const a =
        [...values].sort(
            function(x,y){
                return x-y;
            }
        );


    const middle =
        Math.floor(
            a.length / 2
        );


    if(
        a.length % 2
    ){

        return a[middle];

    }


    return (
        a[middle-1] +
        a[middle]
    ) / 2;

}


/* =========================================================
   盤面候補マスを選ぶ
   =========================================================

   ここが今回の重要部分です。

   画面全体から検出された色付き正方形の中から、

   「同じような大きさ」

   のマスを集めます。

   その後、
   座標が規則的に並んでいるものを
   盤面として扱います。
   ========================================================= */

function selectBoardCells(
    components
){

    if(
        components.length === 0
    ){

        return [];

    }


    /*
       面積の中央値付近にあるものを
       まず候補にします。
    */

    const areas =
        components.map(
            function(c){
                return c.area;
            }
        );


    const medianArea =
        median(
            areas
        );


    /*
       盤面マスの大きさは
       同じゲーム画面内なら
       ほぼ同じです。

       ただし画像縮小・圧縮に対応するため
       ±35%まで許可します。
    */

    let candidates =
        components.filter(
            function(c){

                return (

                    Math.abs(
                        c.area -
                        medianArea
                    ) /
                    medianArea
                    <
                    0.35

                );

            }
        );


    /*
       候補が多すぎる場合は、
       正方形らしさを優先します。
    */

    candidates =
        candidates.filter(
            function(c){

                const ratio =
                    c.w /
                    c.h;

                return (

                    ratio >= 0.70 &&
                    ratio <= 1.43

                );

            }
        );


    /*
       マスの代表サイズ
    */

    const typicalW =
        median(
            candidates.map(
                function(c){
                    return c.w;
                }
            )
        );


    const typicalH =
        median(
            candidates.map(
                function(c){
                    return c.h;
                }
            )
        );


    /*
       サイズが近いものだけ
    */

    candidates =
        candidates.filter(
            function(c){

                return (

                    Math.abs(
                        c.w -
                        typicalW
                    ) /
                    typicalW
                    < 0.25

                    &&

                    Math.abs(
                        c.h -
                        typicalH
                    ) /
                    typicalH
                    < 0.25

                );

            }
        );


    /*
       盤面が20×20なら400個。

       盤面外の小さな色付きアイコンが
       入っても、規則的な座標配置の段階で
       除外します。
    */

    return candidates;

}


/* =========================================================
   座標クラスタリング
   ========================================================= */

function clusterValues(
    values,
    tolerance
){

    const sorted =
        [...values].sort(
            function(a,b){
                return a-b;
            }
        );


    const groups=[];


    for(
        const value of sorted
    ){

        const last =
            groups[
                groups.length - 1
            ];


        if(
            !last ||
            value -
            last.mean >
            tolerance
        ){

            groups.push({

                values:[value],

                mean:value

            });

        }

        else{

            last.values.push(
                value
            );


            last.mean =
                last.values.reduce(
                    function(sum,x){
                        return sum+x;
                    },
                    0
                )
                /
                last.values.length;

        }

    }


    return groups.map(
        function(g){
            return g.mean;
        }
    );

}


/* =========================================================
   規則性
   ========================================================= */

function spacingScore(
    values
){

    if(
        values.length < 2
    ){

        return Infinity;

    }


    const distances=[];


    for(
        let i=1;
        i<values.length;
        i++
    ){

        distances.push(
            values[i] -
            values[i-1]
        );

    }


    const typical =
        median(
            distances
        );


    if(
        typical <= 0
    ){

        return Infinity;

    }


    let score =
        0;


    for(
        const d of distances
    ){

        score +=
            Math.abs(
                d -
                typical
            )
            /
            typical;

    }


    return (
        score /
        distances.length
    );

}


/* =========================================================
   盤面の行・列を検出
   ========================================================= */

function detectRowsAndColumns(
    cells
){

    /*
       マスサイズを推定
    */

    const typicalW =
        median(
            cells.map(
                function(c){
                    return c.w;
                }
            )
        );


    const typicalH =
        median(
            cells.map(
                function(c){
                    return c.h;
                }
            )
        );


    /*
       同じ行の中心Yは近くなる。
    */

    const tolerance =
        Math.max(
            5,
            Math.min(
                typicalW,
                typicalH
            ) * 0.40
        );


    const allX =
        clusterValues(
            cells.map(
                function(c){
                    return c.cx;
                }
            ),
            tolerance
        );


    const allY =
        clusterValues(
            cells.map(
                function(c){
                    return c.cy;
                }
            ),
            tolerance
        );


    /*
       4～20の候補を調べます。

       ここでは
       「どれだけ長方形として
       きれいに埋まるか」
       を評価します。
    */

    let best =
        null;


    for(
        let rows=MIN_SIZE;
        rows<=MAX_SIZE;
        rows++
    ){

        if(
            allY.length <
            rows
        ){

            continue;

        }


        for(
            let cols=MIN_SIZE;
            cols<=MAX_SIZE;
            cols++
        ){

            if(
                allX.length <
                cols
            ){

                continue;

            }


            /*
               連続した行グループを選ぶ
            */

            for(
                let yStart=0;
                yStart+rows<=allY.length;
                yStart++
            ){

                const ys =
                    allY.slice(
                        yStart,
                        yStart + rows
                    );


                const yScore =
                    spacingScore(
                        ys
                    );


                if(
                    yScore > 0.30
                ){

                    continue;

                }


                /*
                   連続した列グループ
                */

                for(
                    let xStart=0;
                    xStart+cols<=allX.length;
                    xStart++
                ){

                    const xs =
                        allX.slice(
                            xStart,
                            xStart + cols
                        );


                    const xScore =
                        spacingScore(
                            xs
                        );


                    if(
                        xScore > 0.30
                    ){

                        continue;

                    }


                    /*
                       この長方形に
                       何個のマスが入るか
                    */

                    let count =
                        0;


                    const used =
                        new Set();


                    for(
                        const cell of cells
                    ){

                        let r =
                            nearestIndex(
                                ys,
                                cell.cy
                            );


                        let c =
                            nearestIndex(
                                xs,
                                cell.cx
                            );


                        if(
                            r < 0 ||
                            c < 0
                        ){

                            continue;

                        }


                        const dy =
                            Math.abs(
                                cell.cy -
                                ys[r]
                            );


                        const dx =
                            Math.abs(
                                cell.cx -
                                xs[c]
                            );


                        if(

                            dy <
                            typicalH * 0.55 &&

                            dx <
                            typicalW * 0.55

                        ){

                            const key =
                                r +
                                "," +
                                c;


                            /*
                               1マス1個だけ
                            */

                            if(
                                !used.has(
                                    key
                                )
                            ){

                                used.add(
                                    key
                                );

                                count++;

                            }

                        }

                    }


                    const total =
                        rows *
                        cols;


                    const occupancy =
                        count /
                        total;


                    /*
                       盤面は基本的に
                       すべてのマスが存在します。
                    */

                    if(
                        occupancy < 0.88
                    ){

                        continue;

                    }


                    /*
                       スコア

                       占有率が高い
                       ＋
                       間隔が規則的

                       なものを優先。
                    */

                    const score =

                        occupancy * 10

                        -

                        xScore

                        -

                        yScore;


                    if(

                        !best ||
                        score >
                        best.score

                    ){

                        best = {

                            rows,

                            cols,

                            xCenters:xs,

                            yCenters:ys,

                            score,

                            occupancy,

                            typicalW,

                            typicalH

                        };

                    }

                }

            }

        }

    }


    if(!best){

        throw new Error(

            "盤面の行・列を認識できませんでした。\n\n" +

            "色付きマスは " +
            cells.length +
            "個検出されましたが、" +

            "規則的な4×4～20×20の盤面としてまとめられませんでした。"

        );

    }


    return best;

}


/* =========================================================
   一番近いインデックス
   ========================================================= */

function nearestIndex(
    array,
    value
){

    if(
        !array.length
    ){

        return -1;

    }


    let best =
        0;

    let distance =
        Math.abs(
            array[0] -
            value
        );


    for(
        let i=1;
        i<array.length;
        i++
    ){

        const d =
            Math.abs(
                array[i] -
                value
            );


        if(
            d <
            distance
        ){

            distance =
                d;

            best =
                i;

        }

    }


    return best;

}


/* =========================================================
   盤面の色を読む
   ========================================================= */

function readBoardColors(
    image,
    board
){

    const colors=[];

    const used =
        new Set();


    for(
        let r=0;
        r<board.rows;
        r++
    ){

        for(
            let c=0;
            c<board.cols;
            c++
        ){

            const cx =
                board.xCenters[c];


            const cy =
                board.yCenters[r];


            const result =
                sampleCellColor(
                    image,
                    cx,
                    cy,
                    board.typicalW,
                    board.typicalH
                );


            if(
                !result
            ){

                throw new Error(

                    `${r+1}行${c+1}列の色を読み取れませんでした。`

                );

            }


            if(
                result.distance >
                COLOR_DISTANCE_LIMIT
            ){

                throw new Error(

                    `${r+1}行${c+1}列の色が判定できませんでした。\n\n` +

                    `RGB：${result.rgb.r}, ${result.rgb.g}, ${result.rgb.b}\n` +

                    `最も近い色：${COLORS[result.index].name}\n` +

                    `色距離：${Math.round(result.distance)}`

                );

            }


            colors.push(
                result.index
            );


            used.add(
                result.index
            );

        }

    }


    if(
        used.size >
        10
    ){

        throw new Error(
            "色が10種類を超えています。"
        );

    }


    return {

        colors,

        usedColors:
            [...used]

    };

}


/* =========================================================
   1マスの中央から色を取得
   ========================================================= */

function sampleCellColor(
    image,
    cx,
    cy,
    w,
    h
){

    const data =
        image.data;

    const width =
        image.width;

    const height =
        image.height;


    /*
       マス中央の20%程度だけを見る。

       角の白い余白や
       マスの境界を避けます。
    */

    const radiusX =
        Math.max(
            2,
            Math.floor(
                w * 0.20
            )
        );


    const radiusY =
        Math.max(
            2,
            Math.floor(
                h * 0.20
            )
        );


    const samples=[];


    for(
        let y=
            Math.round(
                cy -
                radiusY
            );

        y<=
            Math.round(
                cy +
                radiusY
            );

        y++
    ){

        for(
            let x=
                Math.round(
                    cx -
                    radiusX
                );

            x<=
                Math.round(
                    cx +
                    radiusX
                );

            x++
        ){

            if(

                x<0 ||
                y<0 ||
                x>=width ||
                y>=height

            ){

                continue;

            }


            const i =
                (
                    y * width +
                    x
                ) * 4;


            if(
                data[i+3] <
                80
            ){

                continue;

            }


            samples.push({

                r:data[i],

                g:data[i+1],

                b:data[i+2]

            });

        }

    }


    if(
        samples.length === 0
    ){

        return null;

    }


    /*
       中央値を使います。

       JPEG圧縮やアンチエイリアスの
       影響を受けにくくなります。
    */

    const rgb={

        r:median(
            samples.map(
                function(x){
                    return x.r;
                }
            )
        ),

        g:median(
            samples.map(
                function(x){
                    return x.g;
                }
            )
        ),

        b:median(
            samples.map(
                function(x){
                    return x.b;
                }
            )
        )

    };


    const nearest =
        nearestColor(
            rgb
        );


    return {

        rgb,

        index:
            nearest.index,

        distance:
            nearest.distance

    };

}


/* =========================================================
   パズルを解く
   ========================================================= */

function solvePuzzle(
    colors,
    rows,
    cols
){

    /*
       実際に使われている色
    */

    const uniqueColors =
        [...new Set(
            colors
        )];


    const colorPositions =
        new Map();


    for(
        const color of uniqueColors
    ){

        colorPositions.set(
            color,
            []
        );

    }


    /*
       各色の全候補位置
    */

    for(
        let r=0;
        r<rows;
        r++
    ){

        for(
            let c=0;
            c<cols;
            c++
        ){

            const color =
                colors[
                    r * cols +
                    c
                ];


            colorPositions
                .get(color)
                .push([
                    r,
                    c
                ]);

        }

    }


    /*
       色を候補数の少ない順に並べる。

       MRV方式。
    */

    const colorOrder =
        [...uniqueColors].sort(
            function(a,b){

                return (

                    colorPositions
                        .get(a)
                        .length

                    -

                    colorPositions
                        .get(b)
                        .length

                );

            }
        );


    const placed =
        new Map();


    const usedRows =
        new Set();


    const usedCols =
        new Set();


    /*
       猫同士が隣接していないか
    */

    function isSafe(
        r,
        c
    ){

        if(
            usedRows.has(r)
        ){

            return false;

        }


        if(
            usedCols.has(c)
        ){

            return false;

        }


        for(
            const position
            of placed.values()
        ){

            const pr =
                position[0];

            const pc =
                position[1];


            if(

                Math.abs(
                    pr-r
                ) <= 1

                &&

                Math.abs(
                    pc-c
                ) <= 1

            ){

                return false;

            }

        }


        return true;

    }


    /*
       再帰探索
    */

    function search(
        index
    ){

        if(
            index >=
            colorOrder.length
        ){

            return [...placed.values()];

        }


        const color =
            colorOrder[index];


        const candidates =
            colorPositions
                .get(color);


        for(
            const position
            of candidates
        ){

            const r =
                position[0];

            const c =
                position[1];


            if(
                !isSafe(
                    r,
                    c
                )
            ){

                continue;

            }


            placed.set(
                color,
                position
            );


            usedRows.add(
                r
            );


            usedCols.add(
                c
            );


            const result =
                search(
                    index+1
                );


            if(
                result
            ){

                return result;

            }


            placed.delete(
                color
            );


            usedRows.delete(
                r
            );


            usedCols.delete(
                c
            );

        }


        return null;

    }


    return search(
        0
    );

}


/* =========================================================
   盤面を表示
   ========================================================= */

function renderBoard(
    colors,
    rows,
    cols,
    solution
){

    boardElement.innerHTML =
        "";

    legend.innerHTML =
        "";


    boardElement.style.gridTemplateColumns =
        `repeat(${cols},40px)`;


    const solutionSet =
        new Set();


    if(
        solution
    ){

        for(
            const position
            of solution
        ){

            solutionSet.add(

                position[0] +
                "," +
                position[1]

            );

        }

    }


    for(
        let r=0;
        r<rows;
        r++
    ){

        for(
            let c=0;
            c<cols;
            c++
        ){

            const colorIndex =
                colors[
                    r * cols +
                    c
                ];


            const color =
                COLORS[
                    colorIndex
                ];


            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.style.background =
                `rgb(
                    ${color.r},
                    ${color.g},
                    ${color.b}
                )`;


            cell.title =
                `${r+1}行${c+1}列：${color.name}`;


            if(
                solutionSet.has(
                    r +
                    "," +
                    c
                )
            ){

                cell.classList.add(
                    "cat"
                );


                cell.textContent =
                    "🐱";

            }


            boardElement.appendChild(
                cell
            );

        }

    }


    /*
       使用されている色だけ表示
    */

    const used =
        [...new Set(
            colors
        )];


    for(
        const index
        of used
    ){

        const color =
            COLORS[index];


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "legend-item";


        item.textContent =
            color.name;


        item.style.background =
            `rgb(
                ${color.r},
                ${color.g},
                ${color.b}
            )`;


        legend.appendChild(
            item
        );

    }

}


/* =========================================================
   デバッグ情報
   ========================================================= */

function setDebug(
    image,
    components,
    boardCells,
    board,
    colorResult
){

    debug.style.display =
        "block";


    const maxDistance =
        colorResult.colors.length
            ? "カラー判定済み"
            : "なし";


    debug.textContent =

        "===== 認識情報 =====\n" +

        "画像サイズ：" +
        image.width +
        " × " +
        image.height +
        "\n\n" +

        "色付き正方形候補：" +
        components.length +
        "個\n" +

        "盤面候補マス：" +
        boardCells.length +
        "個\n\n" +

        "認識した盤面：" +
        board.rows +
        " × " +
        board.cols +
        "\n\n" +

        "盤面占有率：" +
        Math.round(
            board.occupancy * 100
        ) +
        "%\n\n" +

        "推定マス幅：" +
        Math.round(
            board.typicalW
        ) +
        "px\n" +

        "推定マス高さ：" +
        Math.round(
            board.typicalH
        ) +
        "px\n\n" +

        "使用色数：" +
        colorResult.usedColors.length +
        "色\n\n" +

        maxDistance;

}
