<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫パズル自動解答</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f7fb;
  color:#1f2937;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif
}
main{max-width:1200px;margin:auto;padding:24px}
h1{margin:0 0 10px;font-size:28px}
h2{margin:0 0 12px;font-size:20px}
.card{
  background:#fff;
  border:1px solid #e1e5ea;
  border-radius:16px;
  padding:18px;
  margin:16px 0;
  box-shadow:0 4px 16px rgba(0,0,0,.05)
}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.file-label{
  border:0;border-radius:10px;padding:11px 16px;
  font-weight:700;cursor:pointer;background:#2563eb;color:#fff
}
button.secondary,.file-label.secondary{background:#edf1f5;color:#263241}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=file]{display:none}
.status{
  margin-top:12px;padding:12px 14px;border-radius:10px;
  background:#eef4ff;white-space:pre-wrap;line-height:1.6
}
.status.ok{background:#eaf8f0;color:#11633a}
.status.bad{background:#fff0ef;color:#9b241c}
.preview{
  display:block;max-width:100%;max-height:700px;
  margin-top:14px;border:1px solid #dfe4ea;border-radius:12px
}
.small{font-size:13px;color:#667085;line-height:1.7}
.grid-wrap{overflow:auto;padding:8px}
#grid{
  display:grid;gap:3px;width:max-content;margin:auto
}
.cell{
  width:42px;height:42px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.65);
  font-size:25px;font-weight:700
}
.cell.cat{
  outline:3px solid #111;
  outline-offset:-3px;
  text-shadow:0 1px 2px #fff,0 -1px 2px #fff
}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.badge{padding:5px 9px;border-radius:999px;border:1px solid #dfe4ea;font-size:13px}
ul{line-height:1.8}
</style>
</head>

<body>
<main>

<h1>🐱 猫パズル自動解答</h1>

<p>
ゲームのスクリーンショットを読み込み、
盤面を自動検出して猫の位置を解答します。
4×4～20×20に対応しています。
</p>

<section class="card">

<h2>1. スクリーンショットを読み込む</h2>

<div class="controls">

<label class="file-label" for="file">
画像を選択
</label>

<button id="solveBtn" disabled>
読み取って解く
</button>

<button id="clearBtn" class="secondary">
クリア
</button>

<input id="file" type="file" accept="image/*">

</div>

<p class="small">
ゲーム盤全体が入ったスクリーンショットを選んでください。
上部の説明、猫アイコン、下部のアイコンなどが一緒に写っていても、
盤面だけを自動的に探します。
</p>

<div id="status" class="status">
画像を選択してください。
</div>

<div id="previewBox"></div>

</section>


<section class="card">

<h2>2. 解答</h2>

<div id="info" class="small">
まだ解析していません。
</div>

<div class="grid-wrap">
<div id="grid"></div>
</div>

<div id="legend" class="legend"></div>

</section>


<section class="card">

<h2>ルール</h2>

<ul>
<li>1色につき猫は1匹</li>
<li>同じ行に猫を2匹置かない</li>
<li>同じ列に猫を2匹置かない</li>
<li>縦・横・斜めに隣り合う位置には猫を置かない</li>
</ul>

</section>

</main>


<script>

"use strict";


const MIN_SIZE = 4;
const MAX_SIZE = 20;


const fileInput =
  document.getElementById("file");

const solveBtn =
  document.getElementById("solveBtn");

const clearBtn =
  document.getElementById("clearBtn");

const statusEl =
  document.getElementById("status");

const previewBox =
  document.getElementById("previewBox");

const infoEl =
  document.getElementById("info");

const gridEl =
  document.getElementById("grid");

const legendEl =
  document.getElementById("legend");


let selectedFile = null;


/* =====================================================
   ファイル選択
   ===================================================== */

fileInput.addEventListener(
  "change",
  () => {

    selectedFile =
      fileInput.files &&
      fileInput.files[0]
        ? fileInput.files[0]
        : null;


    gridEl.innerHTML = "";
    legendEl.innerHTML = "";

    infoEl.textContent =
      "まだ解析していません。";


    if (!selectedFile) {

      solveBtn.disabled = true;

      previewBox.innerHTML = "";

      setStatus(
        "画像を選択してください。"
      );

      return;

    }


    const url =
      URL.createObjectURL(
        selectedFile
      );


    const img =
      new Image();


    img.onload = () => {

      img.className =
        "preview";

      img.alt =
        "選択したスクリーンショット";

      previewBox.innerHTML = "";

      previewBox.appendChild(img);

      URL.revokeObjectURL(url);

    };


    img.src = url;


    solveBtn.disabled = false;


    setStatus(
      "画像を読み込みました。「読み取って解く」を押してください。"
    );

  }
);


/* =====================================================
   クリア
   ===================================================== */

clearBtn.addEventListener(
  "click",
  () => {

    selectedFile = null;

    fileInput.value = "";

    previewBox.innerHTML = "";

    gridEl.innerHTML = "";

    legendEl.innerHTML = "";

    infoEl.textContent =
      "まだ解析していません。";

    solveBtn.disabled = true;

    setStatus(
      "画像を選択してください。"
    );

  }
);


/* =====================================================
   解答開始
   ===================================================== */

solveBtn.addEventListener(
  "click",
  async () => {

    if (!selectedFile)
      return;


    solveBtn.disabled = true;


    setStatus(
      "画像からゲーム盤を探しています…"
    );


    try {

      const img =
        await loadImage(
          selectedFile
        );


      const board =
        detectBoard(img);


      setStatus(
        "盤面を検出しました。\n" +
        `サイズ：${board.rows} × ${board.cols}\n` +
        `色の種類：${board.colorCount}色`
      );


      const solution =
        solvePuzzle(
          board.colors,
          board.rows,
          board.cols
        );


      renderBoard(
        board.colors,
        board.rows,
        board.cols,
        solution
      );


      if (!solution) {

        infoEl.textContent =
          "盤面は読み取れましたが、現在のルールでは解が見つかりませんでした。";


        setStatus(
          "解が見つかりませんでした。\n" +
          "別の候補盤面が必要な可能性があります。",
          true
        );


      } else {

        const positions =
          solution
            .map(
              ([r,c]) =>
                `(${r+1}行, ${c+1}列)`
            )
            .join("、");


        infoEl.textContent =
          `猫 ${solution.length}匹\n` +
          `位置：${positions}`;


        setStatus(
          "解答が見つかりました。黒い枠と🐱が猫の位置です。",
          false,
          true
        );

      }


    } catch (e) {

      console.error(e);


      setStatus(
        "読み取りに失敗しました。\n" +
        (
          e && e.message
            ? e.message
            : String(e)
        ),
        true
      );


      infoEl.textContent =
        "解析できませんでした。";


    } finally {

      solveBtn.disabled = false;

    }

  }
);


/* =====================================================
   ステータス
   ===================================================== */

function setStatus(
  text,
  bad=false,
  ok=false
){

  statusEl.textContent =
    text;


  statusEl.className =
    "status" +
    (
      bad
        ? " bad"
        : ok
          ? " ok"
          : ""
    );

}


/* =====================================================
   画像読み込み
   ===================================================== */

function loadImage(file){

  return new Promise(
    (resolve,reject) => {

      const url =
        URL.createObjectURL(file);


      const img =
        new Image();


      img.onload = () => {

        URL.revokeObjectURL(url);

        resolve(img);

      };


      img.onerror = () => {

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "画像を開けませんでした。"
          )
        );

      };


      img.src = url;

    }
  );

}


/* =====================================================
   Canvas
   ===================================================== */

function getImageData(img){

  const maxW = 1500;


  const scale =
    Math.min(
      1,
      maxW / img.naturalWidth
    );


  const width =
    Math.max(
      1,
      Math.round(
        img.naturalWidth * scale
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        img.naturalHeight * scale
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  return {

    data:
      ctx.getImageData(
        0,
        0,
        width,
        height
      ),

    width,

    height

  };

}


/* =====================================================
   色付き正方形の検出
   ===================================================== */

function detectComponents(
  imageData,
  width,
  height
){

  const data =
    imageData.data;


  const n =
    width * height;


  const mask =
    new Uint8Array(n);


  /*
   * 色付きピクセルを探す
   */

  for (
    let i=0;
    i<n;
    i++
  ){

    const r =
      data[i*4];

    const g =
      data[i*4+1];

    const b =
      data[i*4+2];

    const a =
      data[i*4+3];


    if(a<80)
      continue;


    const max =
      Math.max(
        r,g,b
      );


    const min =
      Math.min(
        r,g,b
      );


    const avg =
      (r+g+b)/3;


    if(
      avg<45 ||
      avg>248
    )
      continue;


    if(
      max-min<18
    )
      continue;


    mask[i]=1;

  }


  const visited =
    new Uint8Array(n);


  const queue =
    new Int32Array(n);


  const components=[];


  for(
    let sy=0;
    sy<height;
    sy++
  ){

    for(
      let sx=0;
      sx<width;
      sx++
    ){

      const start =
        sy*width+sx;


      if(
        !mask[start] ||
        visited[start]
      )
        continue;


      let head=0;

      let tail=0;


      queue[tail++] =
        start;


      visited[start]=1;


      let minX=sx;

      let maxX=sx;

      let minY=sy;

      let maxY=sy;


      let area=0;


      let sumX=0;

      let sumY=0;


      let sumR=0;

      let sumG=0;

      let sumB=0;


      while(
        head<tail
      ){

        const p =
          queue[head++];


        const x =
          p%width;


        const y =
          Math.floor(
            p/width
          );


        const di =
          p*4;


        const r =
          data[di];

        const g =
          data[di+1];

        const b =
          data[di+2];


        area++;


        sumX += x;

        sumY += y;


        sumR += r;

        sumG += g;

        sumB += b;


        if(x<minX)
          minX=x;


        if(x>maxX)
          maxX=x;


        if(y<minY)
          minY=y;


        if(y>maxY)
          maxY=y;


        if(x>0){

          const q =
            p-1;


          if(
            mask[q] &&
            !visited[q]
          ){

            visited[q]=1;

            queue[tail++]=q;

          }

        }


        if(x<width-1){

          const q =
            p+1;


          if(
            mask[q] &&
            !visited[q]
          ){

            visited[q]=1;

            queue[tail++]=q;

          }

        }


        if(y>0){

          const q =
            p-width;


          if(
            mask[q] &&
            !visited[q]
          ){

            visited[q]=1;

            queue[tail++]=q;

          }

        }


        if(y<height-1){

          const q =
            p+width;


          if(
            mask[q] &&
            !visited[q]
          ){

            visited[q]=1;

            queue[tail++]=q;

          }

        }

      }


      const w =
        maxX-minX+1;


      const h =
        maxY-minY+1;


      const ratio =
        w/h;


      /*
       * 猫アイコンなどの細長いものを除外
       */

      if(
        area>=80 &&
        w>=8 &&
        h>=8 &&
        ratio>=0.70 &&
        ratio<=1.43
      ){

        components.push({

          area,

          width:w,

          height:h,

          cx:
            sumX/area,

          cy:
            sumY/area,

          color:{

            r:
              sumR/area,

            g:
              sumG/area,

            b:
              sumB/area

          }

        });

      }

    }

  }


  return components;

}


/* =====================================================
   中央値
   ===================================================== */

function median(arr){

  if(!arr.length)
    return 0;


  const a =
    [...arr].sort(
      (x,y)=>x-y
    );


  const m =
    Math.floor(
      a.length/2
    );


  return (
    a.length%2
      ? a[m]
      : (a[m-1]+a[m])/2
  );

}


/* =====================================================
   座標グループ化
   ===================================================== */

function clusterCenters(
  values,
  tolerance
){

  if(!values.length)
    return [];


  const sorted =
    [...values].sort(
      (a,b)=>a-b
    );


  const groups =
    [[sorted[0]]];


  for(
    let i=1;
    i<sorted.length;
    i++
  ){

    const g =
      groups[
        groups.length-1
      ];


    const center =
      g.reduce(
        (s,v)=>s+v,
        0
      )/g.length;


    if(
      Math.abs(
        sorted[i]-center
      )<=tolerance
    ){

      g.push(
        sorted[i]
      );

    }else{

      groups.push(
        [sorted[i]]
      );

    }

  }


  return groups.map(
    g=>({

      center:
        g.reduce(
          (s,v)=>s+v,
          0
        )/g.length,

      count:
        g.length

    })
  );

}


/* =====================================================
   規則性
   ===================================================== */

function regularity(groups){

  if(
    groups.length<2
  )
    return Infinity;


  const diffs=[];


  for(
    let i=1;
    i<groups.length;
    i++
  ){

    diffs.push(
      groups[i].center -
      groups[i-1].center
    );

  }


  const med =
    median(diffs);


  if(med<=0)
    return Infinity;


  return (
    diffs.reduce(
      (s,d)=>
        s+
        Math.abs(
          d-med
        ),
      0
    )
    /
    diffs.length
    /
    med
  );

}


/* =====================================================
   最も規則的なグリッド
   ===================================================== */

function bestWindow(
  groups,
  minSize=MIN_SIZE,
  maxSize=MAX_SIZE
){

  if(
    groups.length<minSize
  )
    return null;


  let best=null;


  for(
    let size=
      Math.min(
        maxSize,
        groups.length
      );
    size>=minSize;
    size--
  ){

    for(
      let start=0;
      start+size<=groups.length;
      start++
    ){

      const sub =
        groups.slice(
          start,
          start+size
        );


      const score =
        regularity(
          sub
        );


      if(
        !best ||
        score<best.score
      ){

        best={

          groups:sub,

          score

        };

      }

    }


    if(
      best &&
      best.score<0.08
    )
      break;

  }


  return best;

}


/* =====================================================
   ゲーム盤検出
   ===================================================== */

function detectBoard(img){

  const {

    data,
    width,
    height

  } =
    getImageData(img);


  const components =
    detectComponents(
      {data},
      width,
      height
    );


  if(
    components.length<
    MIN_SIZE*MIN_SIZE
  ){

    throw new Error(
      "色付きの正方形マスを十分に検出できませんでした。"
    );

  }


  const areas =
    components.map(
      c=>c.area
    );


  const widths =
    components.map(
      c=>c.width
    );


  const heights =
    components.map(
      c=>c.height
    );


  const areaMed =
    median(
      areas
    );


  const wMed =
    median(
      widths
    );


  const hMed =
    median(
      heights
    );


  /*
   * 盤面のマスは
   * 面積・幅・高さが似ている。
   */

  const cells =
    components.filter(
      c=>{

        return (

          c.area>=
            areaMed*0.45

          &&

          c.area<=
            areaMed*1.8

          &&

          c.width>=
            wMed*0.55

          &&

          c.width<=
            wMed*1.45

          &&

          c.height>=
            hMed*0.55

          &&

          c.height<=
            hMed*1.45

        );

      }
    );


  if(
    cells.length<
    MIN_SIZE*MIN_SIZE
  ){

    throw new Error(
      "ゲーム盤らしいマスを十分に検出できませんでした。"
    );

  }


  const xTol =
    Math.max(
      8,
      wMed*0.55
    );


  const yTol =
    Math.max(
      8,
      hMed*0.55
    );


  const xGroups =
    clusterCenters(
      cells.map(
        c=>c.cx
      ),
      xTol
    );


  const yGroups =
    clusterCenters(
      cells.map(
        c=>c.cy
      ),
      yTol
    );


  const xBest =
    bestWindow(
      xGroups
    );


  const yBest =
    bestWindow(
      yGroups
    );


  if(
    !xBest ||
    !yBest
  ){

    throw new Error(
      "規則正しく並んだゲーム盤を見つけられませんでした。"
    );

  }


  const xs =
    xBest.groups;


  const ys =
    yBest.groups;


  const cols =
    xs.length;


  const rows =
    ys.length;


  if(
    rows<MIN_SIZE ||
    cols<MIN_SIZE ||
    rows>MAX_SIZE ||
    cols>MAX_SIZE
  ){

    throw new Error(
      `対応範囲は${MIN_SIZE}×${MIN_SIZE}～${MAX_SIZE}×${MAX_SIZE}です。`
    );

  }


  /*
   * 各マスの中心から直接色を取得
   */

  const samples=[];


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const sample =
        sampleCellColor(
          data,
          width,
          height,
          xs[c].center,
          ys[r].center,
          wMed,
          hMed
        );


      if(!sample){

        throw new Error(
          `${r+1}行${c+1}列の色を読み取れませんでした。`
        );

      }


      samples.push(
        sample
      );

    }

  }


  const colors =
    normalizeColors(
      samples
    );


  const unique =
    new Set(
      colors
    );


  const colorCount =
    unique.size;


  /*
   * このゲームは
   * 1色につき1匹なので、
   * 10×10なら10色。
   */

  if(
    colorCount!==rows ||
    colorCount!==cols
  ){

    throw new Error(
      `盤面は${rows}×${cols}として検出しましたが、色が${colorCount}種類になりました。\n` +
      "ゲーム盤以外の部分が混ざっている可能性があります。"
    );

  }


  return {

    rows,

    cols,

    colors,

    colorCount

  };

}


/* =====================================================
   マス中央の色を取得
   ===================================================== */

function sampleCellColor(
  data,
  width,
  height,
  cx,
  cy,
  cellW,
  cellH
){

  const rx =
    Math.max(
      2,
      Math.floor(
        cellW*0.22
      )
    );


  const ry =
    Math.max(
      2,
      Math.floor(
        cellH*0.22
      )
    );


  let sr=0;

  let sg=0;

  let sb=0;

  let count=0;


  for(
    let y=
      Math.round(cy-ry);
    y<=
      Math.round(cy+ry);
    y++
  ){

    if(
      y<0 ||
      y>=height
    )
      continue;


    for(
      let x=
        Math.round(cx-rx);
      x<=
        Math.round(cx+rx);
      x++
    ){

      if(
        x<0 ||
        x>=width
      )
        continue;


      const i =
        (y*width+x)*4;


      const r =
        data[i];

      const g =
        data[i+1];

      const b =
        data[i+2];

      const a =
        data[i+3];


      if(a<80)
        continue;


      const max =
        Math.max(
          r,g,b
        );


      const min =
        Math.min(
          r,g,b
        );


      const avg =
        (r+g+b)/3;


      /*
       * 白い隙間などを除外
       */

      if(
        avg>248 ||
        avg<30 ||
        max-min<10
      )
        continue;


      sr+=r;

      sg+=g;

      sb+=b;

      count++;

    }

  }


  if(!count)
    return null;


  return {

    r:sr/count,

    g:sg/count,

    b:sb/count

  };

}


/* =====================================================
   RGB距離
   ===================================================== */

function rgbDist(a,b){

  return Math.hypot(

    a.r-b.r,

    a.g-b.g,

    a.b-b.b

  );

}


/* =====================================================
   色を分類
   ===================================================== */

function normalizeColors(
  samples
){

  const palette=[];


  /*
   * 今回のゲームは
   * 淡い色が使われているので、
   * 大きすぎないしきい値にする。
   */

  const threshold=35;


  for(
    const s
    of samples
  ){

    if(
      !s ||
      !Number.isFinite(s.r) ||
      !Number.isFinite(s.g) ||
      !Number.isFinite(s.b)
    ){

      throw new Error(
        "マスの色を読み取れませんでした。"
      );

    }


    let best=-1;

    let bestD=Infinity;


    for(
      let i=0;
      i<palette.length;
      i++
    ){

      const d =
        rgbDist(
          s,
          palette[i]
        );


      if(
        d<bestD
      ){

        bestD=d;

        best=i;

      }

    }


    if(
      best===-1 ||
      bestD>threshold
    ){

      palette.push(
        {...s}
      );

    }else{

      palette[best].r =
        (
          palette[best].r+
          s.r
        )/2;


      palette[best].g =
        (
          palette[best].g+
          s.g
        )/2;


      palette[best].b =
        (
          palette[best].b+
          s.b
        )/2;

    }

  }


  return samples.map(
    s=>{

      let best=0;

      let bestD=Infinity;


      for(
        let i=0;
        i<palette.length;
        i++
      ){

        const d =
          rgbDist(
            s,
            palette[i]
          );


        if(
          d<bestD
        ){

          bestD=d;

          best=i;

        }

      }


      return best;

    }
  );

}


/* =====================================================
   パズルを解く
   ===================================================== */

function solvePuzzle(
  colors,
  rows,
  cols
){

  const colorCount =
    new Set(
      colors
    ).size;


  if(
    colorCount!==rows ||
    colorCount!==cols
  ){

    return null;

  }


  /*
   * 色ごとの候補位置
   */

  const positionsByColor =
    Array.from(
      {
        length:colorCount
      },
      ()=>[]
    );


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const color =
        colors[
          r*cols+c
        ];


      positionsByColor[
        color
      ].push(
        [r,c]
      );

    }

  }


  const assigned =
    Array(
      colorCount
    ).fill(null);


  const usedRows =
    new Uint8Array(
      rows
    );


  const usedCols =
    new Uint8Array(
      cols
    );


  /*
   * その場所に猫を置けるか
   */

  function canPlace(
    r,
    c
  ){

    if(
      usedRows[r]
    )
      return false;


    if(
      usedCols[c]
    )
      return false;


    /*
     * 8方向隣接禁止
     */

    for(
      const p
      of assigned
    ){

      if(!p)
        continue;


      const dr =
        Math.abs(
          p[0]-r
        );


      const dc =
        Math.abs(
          p[1]-c
        );


      if(
        dr<=1 &&
        dc<=1
      ){

        return false;

      }

    }


    return true;

  }


  /*
   * 候補を取得
   */

  function getCandidates(
    color
  ){

    const result=[];


    for(
      const [r,c]
      of positionsByColor[
        color
      ]
    ){

      if(
        canPlace(
          r,
          c
        )
      ){

        result.push(
          [r,c]
        );

      }

    }


    return result;

  }


  let nodes=0;


  const NODE_LIMIT =
    3000000;


  /*
   * バックトラック
   */

  function dfs(
    done
  ){

    nodes++;


    if(
      nodes>NODE_LIMIT
    ){

      return null;

    }


    /*
     * 全色配置済み
     */

    if(
      done===colorCount
    ){

      return assigned.map(
        p=>[
          p[0],
          p[1]
        ]
      );

    }


    /*
     * 候補が最も少ない色から処理
     */

    let bestColor=-1;

    let best=null;


    for(
      let color=0;
      color<colorCount;
      color++
    ){

      if(
        assigned[color]
      )
        continue;


      const candidates =
        getCandidates(
          color
        );


      if(
        candidates.length===0
      ){

        return null;

      }


      if(
        !best ||
        candidates.length<
        best.length
      ){

        best =
          candidates;

        bestColor =
          color;

      }

    }


    /*
     * 候補を順番に試す
     */

    for(
      const [r,c]
      of best
    ){

      assigned[
        bestColor
      ] =
        [r,c];


      usedRows[r]=1;

      usedCols[c]=1;


      const result =
        dfs(
          done+1
        );


      if(result)
        return result;


      /*
       * 元に戻す
       */

      assigned[
        bestColor
      ] = null;


      usedRows[r]=0;

      usedCols[c]=0;

    }


    return null;

  }


  return dfs(0);

}


/* =====================================================
   表示色
   ===================================================== */

function colorToCss(
  id,
  count
){

  const hue =
    (
      id*
      360/
      count
    )%360;


  return (
    `hsl(${hue} 68% 78%)`
  );

}


/* =====================================================
   盤面表示
   ===================================================== */

function renderBoard(
  colors,
  rows,
  cols,
  solution
){

  gridEl.innerHTML = "";


  gridEl.style.gridTemplateColumns =
    `repeat(${cols},42px)`;


  const catSet =
    new Set(
      (solution||[])
        .map(
          ([r,c]) =>
            `${r},${c}`
        )
    );


  const count =
    new Set(
      colors
    ).size;


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "cell";


      const id =
        colors[
          r*cols+c
        ];


      cell.style.background =
        colorToCss(
          id,
          count
        );


      cell.title =
        `${r+1}行 ${c+1}列 / 色${id+1}`;


      if(
        catSet.has(
          `${r},${c}`
        )
      ){

        cell.classList.add(
          "cat"
        );


        cell.textContent =
          "🐱";

      }


      gridEl.appendChild(
        cell
      );

    }

  }


  legendEl.innerHTML = "";


  for(
    let i=0;
    i<count;
    i++
  ){

    const badge =
      document.createElement(
        "span"
      );


    badge.className =
      "badge";


    badge.textContent =
      `色${i+1}`;


    badge.style.background =
      colorToCss(
        i,
        count
      );


    legendEl.appendChild(
      badge
    );

  }

}
