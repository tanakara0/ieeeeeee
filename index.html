<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>猫パズル自動解答</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fb;
    color: #222;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
}

main {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 24px;
}

h1 {
    margin-top: 0;
}

h2 {
    margin-top: 0;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow:
        0 4px 20px rgba(0,0,0,0.06);
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button,
.fileButton {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover,
.fileButton:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

.secondary {
    background: #e9eef5 !important;
    color: #222 !important;
}

input[type="file"] {
    display: none;
}

.status {
    margin-top: 15px;
    padding: 14px;
    border-radius: 10px;
    background: #edf4ff;
    line-height: 1.7;
    white-space: pre-wrap;
}

.status.ok {
    background: #e9f8ef;
    color: #166534;
}

.status.error {
    background: #fff0f0;
    color: #991b1b;
}

.preview {
    display: block;
    max-width: 100%;
    max-height: 750px;
    margin-top: 15px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.small {
    color: #666;
    font-size: 13px;
    line-height: 1.7;
}

.gridArea {
    overflow: auto;
    padding: 15px;
}

#resultGrid {
    display: grid;
    width: max-content;
    margin: auto;
    gap: 4px;
}

.gridCell {
    width: 45px;
    height: 45px;
    border-radius: 7px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 27px;
    border: 2px solid rgba(255,255,255,0.7);
}

.gridCell.cat {
    outline: 3px solid #111;
    outline-offset: -3px;
}

.info {
    line-height: 1.8;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.legendItem {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 13px;
}

</style>
</head>


<body>

<main>

<h1>🐱 猫パズル自動解答</h1>

<div class="card">

<h2>1. スクリーンショットを読み込む</h2>

<div class="controls">

<label
    class="fileButton"
    for="imageInput"
>
    画像を選択
</label>

<button
    id="solveButton"
    disabled
>
    読み取って解く
</button>

<button
    id="clearButton"
    class="secondary"
>
    クリア
</button>

<input
    id="imageInput"
    type="file"
    accept="image/*"
>

</div>

<p class="small">

<strong>重要：</strong><br>

ゲーム画面そのもののスクリーンショットを選択してください。<br>

今回のゲームでは、
10×10の色付きマス100個を自動的に探します。<br>

ブラウザのこのサイトを撮影したスクリーンショットではなく、
ゲーム画面の元画像を選んでください。

</p>

<div
    id="status"
    class="status"
>
画像を選択してください。
</div>

<div id="preview"></div>

</div>


<div class="card">

<h2>2. 解答</h2>

<div
    id="info"
    class="info"
>
まだ解析していません。
</div>

<div class="gridArea">

<div id="resultGrid"></div>

</div>

<div
    id="legend"
    class="legend"
></div>

</div>


<div class="card">

<h2>ゲームのルール</h2>

<ul>

<li>1色につき猫は1匹</li>

<li>同じ行に猫を2匹置かない</li>

<li>同じ列に猫を2匹置かない</li>

<li>上下左右だけでなく斜めも隣接禁止</li>

</ul>

</div>

</main>


<script>

"use strict";


/* =========================================================
   設定
========================================================= */

const MIN_GRID = 4;

const MAX_GRID = 20;


/* =========================================================
   HTML
========================================================= */

const imageInput =
    document.getElementById("imageInput");

const solveButton =
    document.getElementById("solveButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");

const preview =
    document.getElementById("preview");

const info =
    document.getElementById("info");

const resultGrid =
    document.getElementById("resultGrid");

const legend =
    document.getElementById("legend");


let selectedFile = null;


/* =========================================================
   ステータス
========================================================= */

function setStatus(
    message,
    type = ""
) {

    status.textContent = message;

    status.className =
        "status " + type;

}


/* =========================================================
   画像選択
========================================================= */

imageInput.addEventListener(
    "change",
    function() {

        selectedFile =
            this.files &&
            this.files.length
                ? this.files[0]
                : null;


        resultGrid.innerHTML = "";

        legend.innerHTML = "";

        info.textContent =
            "まだ解析していません。";


        if (!selectedFile) {

            solveButton.disabled = true;

            preview.innerHTML = "";

            setStatus(
                "画像を選択してください。"
            );

            return;
        }


        const url =
            URL.createObjectURL(
                selectedFile
            );


        const img =
            document.createElement("img");


        img.src = url;

        img.className = "preview";

        img.alt = "選択したゲーム画像";


        img.onload = function() {

            URL.revokeObjectURL(url);

        };


        preview.innerHTML = "";

        preview.appendChild(img);


        solveButton.disabled = false;


        setStatus(
            "画像を読み込みました。「読み取って解く」を押してください。"
        );

    }
);


/* =========================================================
   クリア
========================================================= */

clearButton.addEventListener(
    "click",
    function() {

        selectedFile = null;

        imageInput.value = "";

        preview.innerHTML = "";

        resultGrid.innerHTML = "";

        legend.innerHTML = "";

        info.textContent =
            "まだ解析していません。";

        solveButton.disabled = true;

        setStatus(
            "画像を選択してください。"
        );

    }
);


/* =========================================================
   解く
========================================================= */

solveButton.addEventListener(
    "click",
    async function() {

        if (!selectedFile) {
            return;
        }


        solveButton.disabled = true;


        try {

            setStatus(
                "① 画像を解析しています…"
            );


            const img =
                await loadImage(
                    selectedFile
                );


            setStatus(
                "② 色付きの正方形マスを探しています…"
            );


            const board =
                detectGameBoard(img);


            setStatus(
                "③ 盤面を認識しました。\n" +
                `サイズ：${board.rows} × ${board.cols}\n` +
                `マス数：${board.rows * board.cols}`
            );


            const solution =
                solvePuzzle(
                    board.colors,
                    board.rows,
                    board.cols
                );


            drawResult(
                board.colors,
                board.rows,
                board.cols,
                solution
            );


            if (!solution) {

                info.textContent =
                    "盤面は認識できましたが、解答が見つかりませんでした。";

                setStatus(
                    "盤面は認識できましたが、現在のルールでは解が見つかりませんでした。",
                    "error"
                );

            }
            else {

                const text =
                    solution
                        .map(
                            p =>
                                `${p[0] + 1}行${p[1] + 1}列`
                        )
                        .join("、");


                info.textContent =
                    `猫の数：${solution.length}匹\n` +
                    `猫の位置：${text}`;


                setStatus(
                    "解答が見つかりました！\n黒い枠と🐱が猫を置く場所です。",
                    "ok"
                );

            }


        }
        catch (error) {

            console.error(error);


            setStatus(
                "読み取りに失敗しました。\n\n" +
                error.message,
                "error"
            );


            info.textContent =
                "盤面を認識できませんでした。";


        }
        finally {

            solveButton.disabled = false;

        }

    }
);


/* =========================================================
   画像読み込み
========================================================= */

function loadImage(file) {

    return new Promise(
        function(resolve, reject) {

            const url =
                URL.createObjectURL(file);


            const img =
                new Image();


            img.onload =
                function() {

                    URL.revokeObjectURL(url);

                    resolve(img);

                };


            img.onerror =
                function() {

                    URL.revokeObjectURL(url);

                    reject(
                        new Error(
                            "画像を開けませんでした。"
                        )
                    );

                };


            img.src = url;

        }
    );

}


/* =========================================================
   Canvas画像
========================================================= */

function makeImageData(img) {

    /*
     * 元画像が大きすぎる場合だけ縮小。
     *
     * 重要なのは、
     * 横幅を一定にするのではなく、
     * 縮小率を縦横同じにすること。
     */

    const MAX_WIDTH = 1600;


    let scale = 1;


    if (
        img.naturalWidth >
        MAX_WIDTH
    ) {

        scale =
            MAX_WIDTH /
            img.naturalWidth;

    }


    const width =
        Math.round(
            img.naturalWidth * scale
        );


    const height =
        Math.round(
            img.naturalHeight * scale
        );


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = width;

    canvas.height = height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    return {

        data:
            ctx.getImageData(
                0,
                0,
                width,
                height
            ),

        width,

        height

    };

}


/* =========================================================
   RGB距離
========================================================= */

function colorDistance(a, b) {

    return Math.sqrt(

        Math.pow(
            a.r - b.r,
            2
        )

        +

        Math.pow(
            a.g - b.g,
            2
        )

        +

        Math.pow(
            a.b - b.b,
            2
        )

    );

}


/* =========================================================
   色付きピクセルか
========================================================= */

function isColoredPixel(
    r,
    g,
    b,
    a
) {

    if (a < 80) {
        return false;
    }


    const max =
        Math.max(
            r,
            g,
            b
        );


    const min =
        Math.min(
            r,
            g,
            b
        );


    const average =
        (
            r +
            g +
            b
        ) / 3;


    /*
     * 白背景を除外
     */

    if (
        average > 248
    ) {

        return false;

    }


    /*
     * 真っ黒なども除外
     */

    if (
        average < 25
    ) {

        return false;

    }


    /*
     * 彩度がほぼない灰色を除外
     */

    if (
        max - min < 18
    ) {

        return false;

    }


    return true;

}


/* =========================================================
   色付き領域を探す
========================================================= */

function findComponents(
    imageData,
    width,
    height
) {

    const data =
        imageData.data;


    const total =
        width * height;


    const mask =
        new Uint8Array(
            total
        );


    /*
     * 色付きピクセルをマスク
     */

    for (
        let i = 0;
        i < total;
        i++
    ) {

        const p =
            i * 4;


        if (
            isColoredPixel(
                data[p],
                data[p + 1],
                data[p + 2],
                data[p + 3]
            )
        ) {

            mask[i] = 1;

        }

    }


    const visited =
        new Uint8Array(
            total
        );


    /*
     * Queue
     */

    const queue =
        new Int32Array(
            total
        );


    const components = [];


    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const start =
                y * width + x;


            if (
                !mask[start] ||
                visited[start]
            ) {

                continue;

            }


            let head = 0;

            let tail = 0;


            queue[tail++] =
                start;


            visited[start] = 1;


            let minX = x;

            let maxX = x;

            let minY = y;

            let maxY = y;


            let area = 0;


            let sumX = 0;

            let sumY = 0;


            let sumR = 0;

            let sumG = 0;

            let sumB = 0;


            while (
                head < tail
            ) {

                const index =
                    queue[head++];


                const px =
                    index % width;


                const py =
                    Math.floor(
                        index / width
                    );


                const di =
                    index * 4;


                const r =
                    data[di];

                const g =
                    data[di + 1];

                const b =
                    data[di + 2];


                area++;


                sumX += px;

                sumY += py;


                sumR += r;

                sumG += g;

                sumB += b;


                if (
                    px < minX
                ) {
                    minX = px;
                }

                if (
                    px > maxX
                ) {
                    maxX = px;
                }

                if (
                    py < minY
                ) {
                    minY = py;
                }

                if (
                    py > maxY
                ) {
                    maxY = py;
                }


                /*
                 * 左
                 */

                if (
                    px > 0
                ) {

                    const q =
                        index - 1;


                    if (
                        mask[q] &&
                        !visited[q]
                    ) {

                        visited[q] = 1;

                        queue[tail++] = q;

                    }

                }


                /*
                 * 右
                 */

                if (
                    px <
                    width - 1
                ) {

                    const q =
                        index + 1;


                    if (
                        mask[q] &&
                        !visited[q]
                    ) {

                        visited[q] = 1;

                        queue[tail++] = q;

                    }

                }


                /*
                 * 上
                 */

                if (
                    py > 0
                ) {

                    const q =
                        index - width;


                    if (
                        mask[q] &&
                        !visited[q]
                    ) {

                        visited[q] = 1;

                        queue[tail++] = q;

                    }

                }


                /*
                 * 下
                 */

                if (
                    py <
                    height - 1
                ) {

                    const q =
                        index + width;


                    if (
                        mask[q] &&
                        !visited[q]
                    ) {

                        visited[q] = 1;

                        queue[tail++] = q;

                    }

                }

            }


            const boxWidth =
                maxX -
                minX +
                1;


            const boxHeight =
                maxY -
                minY +
                1;


            const ratio =
                boxWidth /
                boxHeight;


            /*
             * 正方形に近いもの
             */

            if (

                area >= 100

                &&

                boxWidth >= 10

                &&

                boxHeight >= 10

                &&

                ratio >= 0.75

                &&

                ratio <= 1.33

            ) {

                components.push({

                    area,

                    width:
                        boxWidth,

                    height:
                        boxHeight,

                    cx:
                        sumX / area,

                    cy:
                        sumY / area,

                    color: {

                        r:
                            sumR / area,

                        g:
                            sumG / area,

                        b:
                            sumB / area

                    }

                });

            }

        }

    }


    return components;

}


/* =========================================================
   中央値
========================================================= */

function median(values) {

    if (
        values.length === 0
    ) {

        return 0;

    }


    const sorted =
        values
            .slice()
            .sort(
                (a, b) => a - b
            );


    const middle =
        Math.floor(
            sorted.length / 2
        );


    if (
        sorted.length % 2
    ) {

        return sorted[middle];

    }


    return (
        sorted[middle - 1] +
        sorted[middle]
    ) / 2;

}


/* =========================================================
   ゲーム盤を検出
========================================================= */

function detectGameBoard(img) {

    const {

        data,
        width,
        height

    } =
        makeImageData(img);


    const components =
        findComponents(
            data,
            width,
            height
        );


    if (
        components.length <
        MIN_GRID * MIN_GRID
    ) {

        throw new Error(
            "色付きの正方形マスを十分に検出できませんでした。\n\n" +
            "ゲーム画面そのもののスクリーンショットを選択してください。"
        );

    }


    /*
     * =====================================================
     *
     * ここが今回の重要ポイント
     *
     * =====================================================
     *
     * 面積が大きい正方形だけを使う。
     *
     * 実際のゲーム画像では、
     * 盤面の100マスは約5900px。
     *
     * 上部の猫アイコンなどは
     * これよりかなり小さい。
     *
     * =====================================================
     */


    const areas =
        components.map(
            c => c.area
        );


    const maxArea =
        Math.max(
            ...areas
        );


    /*
     * 最大面積の約60%以上。
     *
     * 盤面マスだけを残す。
     */

    let cells =
        components.filter(
            c =>
                c.area >=
                maxArea * 0.60
        );


    /*
     * 多すぎる場合は
     * 面積上位を使用
     */

    if (
        cells.length > 500
    ) {

        cells =
            cells
                .sort(
                    (a,b) =>
                        b.area -
                        a.area
                )
                .slice(
                    0,
                    400
                );

    }


    if (
        cells.length <
        MIN_GRID * MIN_GRID
    ) {

        throw new Error(
            "ゲーム盤の100マスを見つけられませんでした。\n\n" +
            `検出した大きな正方形：${cells.length}個\n\n` +
            "ゲーム画面全体が写った画像を選択してください。"
        );

    }


    /*
     * マスの大きさ
     */

    const cellWidth =
        median(
            cells.map(
                c => c.width
            )
        );


    const cellHeight =
        median(
            cells.map(
                c => c.height
            )
        );


    /*
     * =====================================================
     * X座標
     * =====================================================
     *
     * 同じ列のマスはほぼ同じX座標。
     */

    const xTolerance =
        Math.max(
            8,
            cellWidth * 0.25
        );


    const yTolerance =
        Math.max(
            8,
            cellHeight * 0.25
        );


    const xGroups =
        groupCoordinates(
            cells.map(
                c => c.cx
            ),
            xTolerance
        );


    const yGroups =
        groupCoordinates(
            cells.map(
                c => c.cy
            ),
            yTolerance
        );


    /*
     * 4～20列・行を探す
     */

    const xCandidates =
        chooseGridCoordinates(
            xGroups
        );


    const yCandidates =
        chooseGridCoordinates(
            yGroups
        );


    if (
        !xCandidates ||
        !yCandidates
    ) {

        throw new Error(
            "盤面の行・列を正しく検出できませんでした。\n\n" +
            "色付きマスがはっきり写っているゲーム画面を使用してください。"
        );

    }


    const xs =
        xCandidates.coordinates;


    const ys =
        yCandidates.coordinates;


    const cols =
        xs.length;


    const rows =
        ys.length;


    /*
     * 正方形盤面
     *
     * このゲームは4×4～20×20。
     */

    if (
        rows < MIN_GRID ||
        cols < MIN_GRID ||
        rows > MAX_GRID ||
        cols > MAX_GRID
    ) {

        throw new Error(
            `検出結果が${rows}×${cols}になりました。\n` +
            "4×4～20×20の盤面を想定しています。"
        );

    }


    /*
     * 行列の差が大きすぎる場合
     */

    if (
        Math.abs(
            rows - cols
        ) > 1
    ) {

        throw new Error(
            `盤面が${rows}×${cols}として検出されました。\n\n` +
            "ゲーム盤以外の部分を拾っている可能性があります。"
        );

    }


    /*
     * 各セルの中心色を直接読む。
     */

    const samples = [];


    for (
        let r = 0;
        r < rows;
        r++
    ) {

        for (
            let c = 0;
            c < cols;
            c++
        ) {

            const color =
                sampleCenterColor(
                    data,
                    width,
                    height,
                    xs[c],
                    ys[r],
                    cellWidth,
                    cellHeight
                );


            if (!color) {

                throw new Error(
                    `${r + 1}行${c + 1}列の色を読み取れませんでした。`
                );

            }


            samples.push(
                color
            );

        }

    }


    /*
     * 色をクラスタリング
     *
     * 「色の数」を先に推測しない。
     *
     * 10×10なら10色として分類。
     */

    const numberOfColors =
        Math.min(
            rows,
            cols
        );


    const colors =
        clusterColors(
            samples,
            numberOfColors
        );


    return {

        rows,

        cols,

        colors,

        numberOfColors

    };

}


/* =========================================================
   座標グループ
========================================================= */

function groupCoordinates(
    values,
    tolerance
) {

    const sorted =
        values
            .slice()
            .sort(
                (a,b) => a - b
            );


    const groups = [];


    for (
        const value of sorted
    ) {

        if (
            groups.length === 0
        ) {

            groups.push(
                [value]
            );

            continue;

        }


        const last =
            groups[
                groups.length - 1
            ];


        const center =
            last.reduce(
                (sum, v) =>
                    sum + v,
                0
            ) /
            last.length;


        if (
            Math.abs(
                value - center
            ) <= tolerance
        ) {

            last.push(
                value
            );

        }
        else {

            groups.push(
                [value]
            );

        }

    }


    return groups.map(
        g =>
            g.reduce(
                (sum, v) =>
                    sum + v,
                0
            ) /
            g.length
    );

}


/* =========================================================
   グリッド座標を選ぶ
========================================================= */

function chooseGridCoordinates(
    groups
) {

    if (
        groups.length <
        MIN_GRID
    ) {

        return null;

    }


    /*
     * まず、規則的な間隔を探す。
     */

    let best = null;


    for (
        let start = 0;
        start < groups.length;
        start++
    ) {

        for (
            let end = start + MIN_GRID;
            end <=
            Math.min(
                groups.length,
                MAX_GRID + start
            );
            end++
        ) {

            const candidate =
                groups.slice(
                    start,
                    end
                );


            if (
                candidate.length <
                MIN_GRID
            ) {

                continue;

            }


            const diffs = [];


            for (
                let i = 1;
                i < candidate.length;
                i++
            ) {

                diffs.push(
                    candidate[i] -
                    candidate[i - 1]
                );

            }


            const spacing =
                median(
                    diffs
                );


            if (
                spacing <= 0
            ) {

                continue;

            }


            let error = 0;


            for (
                const d of diffs
            ) {

                error +=
                    Math.abs(
                        d -
                        spacing
                    ) /
                    spacing;

            }


            error /=
                diffs.length;


            /*
             * マスが多いほど有利
             */

            const score =
                error -
                candidate.length *
                0.01;


            if (
                !best ||
                score < best.score
            ) {

                best = {

                    score,

                    coordinates:
                        candidate

                };

            }

        }

    }


    return best;

}


/* =========================================================
   セル中央の色
========================================================= */

function sampleCenterColor(
    data,
    width,
    height,
    cx,
    cy,
    cellWidth,
    cellHeight
) {

    /*
     * 中央の小さい範囲だけ見る。
     *
     * 白い角や境界線を避ける。
     */

    const rx =
        Math.max(
            3,
            Math.floor(
                cellWidth * 0.12
            )
        );


    const ry =
        Math.max(
            3,
            Math.floor(
                cellHeight * 0.12
            )
        );


    const values = [];


    for (
        let y =
            Math.round(cy) - ry;

        y <=
            Math.round(cy) + ry;

        y++
    ) {

        if (
            y < 0 ||
            y >= height
        ) {

            continue;

        }


        for (
            let x =
                Math.round(cx) - rx;

            x <=
                Math.round(cx) + rx;

            x++
        ) {

            if (
                x < 0 ||
                x >= width
            ) {

                continue;

            }


            const i =
                (
                    y * width +
                    x
                ) * 4;


            const r =
                data[i];

            const g =
                data[i + 1];

            const b =
                data[i + 2];

            const a =
                data[i + 3];


            if (
                isColoredPixel(
                    r,
                    g,
                    b,
                    a
                )
            ) {

                values.push(
                    [r,g,b]
                );

            }

        }

    }


    if (
        values.length === 0
    ) {

        return null;

    }


    /*
     * 各チャンネル中央値
     */

    const rs =
        values.map(
            v => v[0]
        );


    const gs =
        values.map(
            v => v[1]
        );


    const bs =
        values.map(
            v => v[2]
        );


    return {

        r:
            median(rs),

        g:
            median(gs),

        b:
            median(bs)

    };

}


/* =========================================================
   色クラスタリング
========================================================= */

function clusterColors(
    samples,
    k
) {

    /*
     * 初期中心を均等に選ぶ。
     */

    const centers = [];


    /*
     * 最初は色距離が離れた点を
     * 順番に選ぶ。
     */

    centers.push(
        {
            r:
                samples[0].r,

            g:
                samples[0].g,

            b:
                samples[0].b
        }
    );


    while (
        centers.length < k
    ) {

        let bestSample = null;

        let bestDistance = -1;


        for (
            const sample
            of samples
        ) {

            let nearest =
                Infinity;


            for (
                const center
                of centers
            ) {

                nearest =
                    Math.min(
                        nearest,
                        colorDistance(
                            sample,
                            center
                        )
                    );

            }


            if (
                nearest >
                bestDistance
            ) {

                bestDistance =
                    nearest;

                bestSample =
                    sample;

            }

        }


        if (!bestSample) {
            break;
        }


        centers.push(
            {
                r:
                    bestSample.r,

                g:
                    bestSample.g,

                b:
                    bestSample.b
            }
        );

    }


    /*
     * k-means
     */

    let labels =
        new Array(
            samples.length
        ).fill(0);


    for (
        let iteration = 0;
        iteration < 30;
        iteration++
    ) {

        /*
         * 割り当て
         */

        for (
            let i = 0;
            i < samples.length;
            i++
        ) {

            let best = 0;

            let bestD =
                Infinity;


            for (
                let c = 0;
                c < centers.length;
                c++
            ) {

                const d =
                    colorDistance(
                        samples[i],
                        centers[c]
                    );


                if (
                    d < bestD
                ) {

                    bestD = d;

                    best = c;

                }

            }


            labels[i] = best;

        }


        /*
         * 中心更新
         */

        const sums =
            centers.map(
                () => ({
                    r: 0,
                    g: 0,
                    b: 0,
                    n: 0
                })
            );


        for (
            let i = 0;
            i < samples.length;
            i++
        ) {

            const c =
                labels[i];


            sums[c].r +=
                samples[i].r;

            sums[c].g +=
                samples[i].g;

            sums[c].b +=
                samples[i].b;

            sums[c].n++;

        }


        let changed = false;


        for (
            let c = 0;
            c < centers.length;
            c++
        ) {

            if (
                sums[c].n === 0
            ) {

                continue;

            }


            const nr =
                sums[c].r /
                sums[c].n;


            const ng =
                sums[c].g /
                sums[c].n;


            const nb =
                sums[c].b /
                sums[c].n;


            if (
                Math.abs(
                    centers[c].r -
                    nr
                ) > 0.5 ||

                Math.abs(
                    centers[c].g -
                    ng
                ) > 0.5 ||

                Math.abs(
                    centers[c].b -
                    nb
                ) > 0.5
            ) {

                changed = true;

            }


            centers[c] = {

                r: nr,

                g: ng,

                b: nb

            };

        }


        if (!changed) {
            break;
        }

    }


    return labels;

}


/* =========================================================
   パズルを解く
========================================================= */

function solvePuzzle(
    colors,
    rows,
    cols
) {

    const colorCount =
        Math.max(
            ...colors
        ) + 1;


    /*
     * 1色につき1匹なので、
     * 色数は行数と同じ。
     */

    if (
        colorCount !== rows ||
        colorCount !== cols
    ) {

        /*
         * 色クラスタの番号が
         * 連続していない可能性があるため
         * 再番号付け
         */

        const map =
            new Map();


        let next = 0;


        for (
            let i = 0;
            i < colors.length;
            i++
        ) {

            if (
                !map.has(
                    colors[i]
                )
            ) {

                map.set(
                    colors[i],
                    next++
                );

            }


            colors[i] =
                map.get(
                    colors[i]
                );

        }

    }


    const actualColorCount =
        Math.max(
            ...colors
        ) + 1;


    if (
        actualColorCount !== rows ||
        actualColorCount !== cols
    ) {

        return null;

    }


    /*
     * 色ごとの候補
     */

    const positions =
        Array.from(
            {
                length:
                    actualColorCount
            },
            () => []
        );


    for (
        let r = 0;
        r < rows;
        r++
    ) {

        for (
            let c = 0;
            c < cols;
            c++
        ) {

            const color =
                colors[
                    r * cols + c
                ];


            positions[color].push(
                [r,c]
            );

        }

    }


    /*
     * 配置済み
     */

    const assigned =
        new Array(
            actualColorCount
        ).fill(null);


    const usedRows =
        new Uint8Array(
            rows
        );


    const usedCols =
        new Uint8Array(
            cols
        );


    /*
     * 猫を置けるか
     */

    function canPlace(
        r,
        c
    ) {

        if (
            usedRows[r]
        ) {

            return false;

        }


        if (
            usedCols[c]
        ) {

            return false;

        }


        /*
         * 8方向隣接禁止
         */

        for (
            const p
            of assigned
        ) {

            if (!p) {
                continue;
            }


            const dr =
                Math.abs(
                    p[0] - r
                );


            const dc =
                Math.abs(
                    p[1] - c
                );


            if (
                dr <= 1 &&
                dc <= 1
            ) {

                return false;

            }

        }


        return true;

    }


    /*
     * 候補を取得
     */

    function candidatesFor(
        color
    ) {

        const result = [];


        for (
            const p
            of positions[color]
        ) {

            if (
                canPlace(
                    p[0],
                    p[1]
                )
            ) {

                result.push(p);

            }

        }


        return result;

    }


    let nodes = 0;


    const LIMIT =
        5000000;


    /*
     * バックトラック
     */

    function search(
        placed
    ) {

        nodes++;


        if (
            nodes > LIMIT
        ) {

            return null;

        }


        if (
            placed ===
            actualColorCount
        ) {

            return assigned.map(
                p =>
                    [p[0],p[1]]
            );

        }


        /*
         * 最も候補の少ない色を選ぶ
         */

        let selectedColor =
            -1;


        let selectedCandidates =
            null;


        for (
            let color = 0;
            color <
            actualColorCount;
            color++
        ) {

            if (
                assigned[color]
            ) {

                continue;

            }


            const candidates =
                candidatesFor(
                    color
                );


            if (
                candidates.length === 0
            ) {

                return null;

            }


            if (
                selectedCandidates === null ||

                candidates.length <
                selectedCandidates.length
            ) {

                selectedColor =
                    color;

                selectedCandidates =
                    candidates;

            }

        }


        /*
         * 候補を試す
         */

        for (
            const p
            of selectedCandidates
        ) {

            const r = p[0];

            const c = p[1];


            assigned[
                selectedColor
            ] = p;


            usedRows[r] = 1;

            usedCols[c] = 1;


            const result =
                search(
                    placed + 1
                );


            if (result) {

                return result;

            }


            assigned[
                selectedColor
            ] = null;


            usedRows[r] = 0;

            usedCols[c] = 0;

        }


        return null;

    }


    return search(0);

}


/* =========================================================
   結果表示
========================================================= */

function drawResult(
    colors,
    rows,
    cols,
    solution
) {

    resultGrid.innerHTML = "";

    legend.innerHTML = "";


    resultGrid.style.gridTemplateColumns =
        `repeat(${cols},45px)`;


    const catPositions =
        new Set();


    if (solution) {

        for (
            const p
            of solution
        ) {

            catPositions.add(
                `${p[0]},${p[1]}`
            );

        }

    }


    const colorCount =
        Math.max(
            ...colors
        ) + 1;


    for (
        let r = 0;
        r < rows;
        r++
    ) {

        for (
            let c = 0;
            c < cols;
            c++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "gridCell";


            const color =
                colors[
                    r * cols + c
                ];


            cell.style.background =
                colorForId(
                    color,
                    colorCount
                );


            if (
                catPositions.has(
                    `${r},${c}`
                )
            ) {

                cell.classList.add(
                    "cat"
                );


                cell.textContent =
                    "🐱";

            }


            cell.title =
                `${r + 1}行${c + 1}列`;


            resultGrid.appendChild(
                cell
            );

        }

    }


    /*
     * 色一覧
     */

    for (
        let i = 0;
        i < colorCount;
        i++
    ) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "legendItem";


        item.textContent =
            `色${i + 1}`;


        item.style.background =
            colorForId(
                i,
                colorCount
            );


        legend.appendChild(
            item
        );

    }

}


/* =========================================================
   表示用色
========================================================= */

function colorForId(
    id,
    count
) {

    const hue =
        (
            id *
            360 /
            count
        ) % 360;


    return `hsl(${hue},68%,78%)`;

}
