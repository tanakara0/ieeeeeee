<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫パズル スクリーンショット解析 v3.0</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #f3f4f6; font-family: Arial, "Noto Sans JP", sans-serif; color: #222; }
.container { max-width: 1200px; margin: auto; }
h1 { margin-top: 0; text-align: center; }
.panel { background: white; border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
input[type="file"] { width: 100%; padding: 12px; border: 2px dashed #aaa; border-radius: 8px; background: #fafafa; }
button { border: none; border-radius: 8px; padding: 11px 18px; margin: 5px; cursor: pointer; background: #333; color: white; font-size: 15px; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
select { padding: 8px; font-size: 15px; border-radius: 6px; }
.status { padding: 12px; border-radius: 8px; background: #eef2ff; margin-top: 12px; white-space: pre-wrap; }
.error { background: #fee2e2; color: #991b1b; }
.success { background: #dcfce7; color: #166534; }
.preview-area { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.preview-box { text-align: center; }
.preview-box img, .preview-box canvas { max-width: 100%; max-height: 650px; border: 1px solid #ccc; border-radius: 8px; background: #eee; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.info-item { background: #f5f5f5; padding: 12px; border-radius: 8px; }
.info-label { font-size: 12px; color: #666; }
.info-value { font-size: 20px; font-weight: bold; margin-top: 4px; }
.board-wrap { overflow-x: auto; }
.board-table { border-collapse: collapse; margin: auto; }
.board-table td { width: 30px; height: 30px; text-align: center; border: 1px solid #777; font-weight: bold; font-size: 12px; }
.color-list { display: flex; flex-wrap: wrap; gap: 8px; }
.color-item { display: flex; align-items: center; gap: 6px; padding: 6px 9px; background: #f5f5f5; border-radius: 6px; font-size: 13px; }
.color-dot { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #555; }
.positions { font-family: monospace; white-space: pre-wrap; background: #111; color: #eee; padding: 15px; border-radius: 8px; overflow-x: auto; }
@media (max-width: 800px) { .preview-area { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">

<h1>🐱 猫パズル スクリーンショット解析 v3.0</h1>

<div class="panel">
    <h2>① スクリーンショットを選択</h2>
    <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp">
    <div>
        盤面サイズ：
        <select id="gridSelect"></select>
        <button id="analyzeBtn" disabled>🔍 盤面を解析</button>
        <button id="solveBtn" disabled>🐱 解答する</button>
        <button id="clearBtn">🗑️ クリア</button>
    </div>
    <div id="status" class="status">画像を選択してください。</div>
</div>

<div class="panel">
    <h2>② 画像</h2>
    <div class="preview-area">
        <div class="preview-box"><h3>元画像</h3><img id="previewImage"></div>
        <div class="preview-box"><h3>解析結果</h3><canvas id="resultCanvas"></canvas></div>
    </div>
</div>

<div class="panel">
    <h2>③ 解析情報</h2>
    <div class="info-grid">
        <div class="info-item"><div class="info-label">盤面サイズ</div><div class="info-value" id="boardSize">-</div></div>
        <div class="info-item"><div class="info-label">認識色数</div><div class="info-value" id="colorCount">-</div></div>
        <div class="info-item"><div class="info-label">色の安定度</div><div class="info-value" id="purityValue">-</div></div>
    </div>
</div>

<div class="panel">
    <h2>④ 認識した色</h2>
    <div id="colorList" class="color-list"></div>
</div>

<div class="panel">
    <h2>⑤ 認識した盤面</h2>
    <div id="boardContainer" class="board-wrap">まだ解析していません。</div>
</div>

<div class="panel">
    <h2>⑥ 解答</h2>
    <div id="positions" class="positions">まだ解答していません。</div>
</div>

</div>

<script>
/* =========================================================
   設定（ここの数字を変えると動作を調整できます）
========================================================= */
const MIN_GRID = 4;          // 最小の盤面サイズ
const MAX_GRID = 20;         // 最大の盤面サイズ
const MAX_IMAGE_SIZE = 1600; // 解析する画像の最大サイズ(px)
const SAT_MIN = 45;          // 「色がついている」と判定する彩度の下限（背景のクリーム色や白を除外）
const CLUSTER_DIST = 28;     // この距離以内の色は「同じ色」とみなす
const BLOCK = 6;             // 盤面探索のブロックサイズ(px)

/* =========================================================
   部品（HTMLの要素）
========================================================= */
const imageInput = document.getElementById("imageInput");
const previewImage = document.getElementById("previewImage");
const resultCanvas = document.getElementById("resultCanvas");
const gridSelect = document.getElementById("gridSelect");
const analyzeBtn = document.getElementById("analyzeBtn");
const solveBtn = document.getElementById("solveBtn");
const clearBtn = document.getElementById("clearBtn");
const statusBox = document.getElementById("status");
const boardSizeEl = document.getElementById("boardSize");
const colorCountEl = document.getElementById("colorCount");
const purityEl = document.getElementById("purityValue");
const colorList = document.getElementById("colorList");
const boardContainer = document.getElementById("boardContainer");
const positionsBox = document.getElementById("positions");

/* 盤面サイズの選択肢（自動 + 4〜20） */
gridSelect.innerHTML = '<option value="0">自動判定</option>';
for (let n = MIN_GRID; n <= MAX_GRID; n++) {
    gridSelect.innerHTML += `<option value="${n}">${n} × ${n}</option>`;
}

/* =========================================================
   変数
========================================================= */
let originalImage = null;   // 読み込んだ画像
let analysisCanvas = null;  // 解析に使う(縮小した)画像。枠や猫もこの座標で描く
let currentResult = null;   // 解析結果 { board, palette, bounds, n }

/* =========================================================
   ステータス表示
========================================================= */
function setStatus(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = "status" + (type ? " " + type : "");
}

/* =========================================================
   画像の選択
========================================================= */
imageInput.addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
        setStatus("画像ファイルを選択してください。", "error");
        return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
        originalImage = img;
        previewImage.src = url;
        analyzeBtn.disabled = false;
        solveBtn.disabled = true;
        currentResult = null;
        boardContainer.textContent = "まだ解析していません。";
        positionsBox.textContent = "まだ解答していません。";
        setStatus("画像を読み込みました。\n「盤面を解析」を押してください。", "success");
    };
    img.onerror = function () {
        URL.revokeObjectURL(url);
        setStatus("画像を読み込めませんでした。", "error");
    };
    img.src = url;
});

/* =========================================================
   解析用の縮小画像を作る
========================================================= */
function createAnalysisCanvas(img) {
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    const scale = Math.min(1, MAX_IMAGE_SIZE / w, MAX_IMAGE_SIZE / h);
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    return { canvas, ctx, width: w, height: h };
}

/* =========================================================
   「色がついているピクセル」の地図(マスク)を作る
   背景の白・クリーム色・灰色は彩度が低いので除外されます
========================================================= */
function createColorMask(imageData) {
    const { width, height, data } = imageData;
    const mask = new Uint8Array(width * height);
    for (let p = 0; p < width * height; p++) {
        const r = data[p * 4], g = data[p * 4 + 1], b = data[p * 4 + 2];
        const sat = Math.max(r, g, b) - Math.min(r, g, b);
        if (sat >= SAT_MIN) mask[p] = 1;
    }
    return mask;
}

/* =========================================================
   盤面の範囲を探す
   ①画像を小さなブロックに分け、色が多いブロックに印をつける
   ②つながっている印の塊のうち、一番大きいものを盤面とする
   ③その塊の中の色ピクセルにぴったり合わせて範囲を決める
========================================================= */
function detectBoardBounds(width, height, mask) {
    const bw = Math.ceil(width / BLOCK);
    const bh = Math.ceil(height / BLOCK);
    const blocks = new Uint8Array(bw * bh);

    for (let by = 0; by < bh; by++) {
        for (let bx = 0; bx < bw; bx++) {
            let count = 0, total = 0;
            for (let y = by * BLOCK; y < Math.min(height, (by + 1) * BLOCK); y++) {
                for (let x = bx * BLOCK; x < Math.min(width, (bx + 1) * BLOCK); x++) {
                    total++;
                    if (mask[y * width + x]) count++;
                }
            }
            if (count > total * 0.4) blocks[by * bw + bx] = 1;
        }
    }

    // つながっている塊を探し、最大のものを選ぶ
    const visited = new Uint8Array(bw * bh);
    let best = null;
    for (let s = 0; s < blocks.length; s++) {
        if (!blocks[s] || visited[s]) continue;
        const stack = [s];
        visited[s] = 1;
        let area = 0, minX = bw, maxX = -1, minY = bh, maxY = -1;
        while (stack.length) {
            const cur = stack.pop();
            const cx = cur % bw, cy = Math.floor(cur / bw);
            area++;
            minX = Math.min(minX, cx); maxX = Math.max(maxX, cx);
            minY = Math.min(minY, cy); maxY = Math.max(maxY, cy);
            for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                const nx = cx + dx, ny = cy + dy;
                if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) continue;
                const ni = ny * bw + nx;
                if (blocks[ni] && !visited[ni]) { visited[ni] = 1; stack.push(ni); }
            }
        }
        if (!best || area > best.area) best = { area, minX, maxX, minY, maxY };
    }
    if (!best) return null;

    // ブロックの範囲の中で、実際に色があるピクセルにぴったり合わせる
    const x0 = best.minX * BLOCK, x1 = Math.min(width, (best.maxX + 1) * BLOCK);
    const y0 = best.minY * BLOCK, y1 = Math.min(height, (best.maxY + 1) * BLOCK);
    let minX = width, maxX = -1, minY = height, maxY = -1;
    for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
            if (mask[y * width + x]) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        }
    }
    if (maxX <= minX || maxY <= minY) return null;
    return { x: minX, y: minY, width: maxX - minX + 1, height: maxY - minY + 1 };
}

/* =========================================================
   1マスの代表色を調べる（マスの中央部分の平均色）
   purity = 中央部分の色がどれだけ揃っているか(0〜1)
========================================================= */
function sampleCell(imageData, bounds, n, row, col) {
    const { width, height, data } = imageData;
    const cw = bounds.width / n;
    const ch = bounds.height / n;
    const sx0 = Math.floor(bounds.x + col * cw + cw * 0.25);
    const sx1 = Math.ceil(bounds.x + (col + 1) * cw - cw * 0.25);
    const sy0 = Math.floor(bounds.y + row * ch + ch * 0.25);
    const sy1 = Math.ceil(bounds.y + (row + 1) * ch - ch * 0.25);
    const step = Math.max(1, Math.floor(Math.min(cw, ch) / 8));

    const pixels = [];
    for (let y = sy0; y < sy1; y += step) {
        for (let x = sx0; x < sx1; x += step) {
            if (x < 0 || y < 0 || x >= width || y >= height) continue;
            const i = (y * width + x) * 4;
            pixels.push([data[i], data[i + 1], data[i + 2]]);
        }
    }
    if (pixels.length === 0) return { rgb: [0, 0, 0], purity: 0 };

    let sr = 0, sg = 0, sb = 0;
    for (const p of pixels) { sr += p[0]; sg += p[1]; sb += p[2]; }
    const mean = [sr / pixels.length, sg / pixels.length, sb / pixels.length];

    let same = 0;
    for (const p of pixels) {
        if (dist(p, mean) < 30) same++;
    }
    return { rgb: mean, purity: same / pixels.length };
}

function dist(a, b) {
    const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
    return Math.sqrt(dr * dr + dg * dg + db * db);
}

/* =========================================================
   似た色をグループ分け(クラスタリング)して色番号を付ける
========================================================= */
function clusterColors(cellColors) {
    const groups = []; // { sum:[r,g,b], count, mean:[r,g,b] }

    // 1回目：近いグループがあれば仲間に入れ、なければ新しいグループを作る
    for (const c of cellColors) {
        let bestIndex = -1, bestD = Infinity;
        groups.forEach((g, i) => {
            const d = dist(c, g.mean);
            if (d < bestD) { bestD = d; bestIndex = i; }
        });
        if (bestIndex >= 0 && bestD <= CLUSTER_DIST) {
            const g = groups[bestIndex];
            for (let k = 0; k < 3; k++) g.sum[k] += c[k];
            g.count++;
            g.mean = g.sum.map(v => v / g.count);
        } else {
            groups.push({ sum: [...c], count: 1, mean: [...c] });
        }
    }

    // 2回目：最終的なグループの平均色で、全マスの番号を決め直す
    const ids = cellColors.map(c => {
        let bestIndex = 0, bestD = Infinity;
        groups.forEach((g, i) => {
            const d = dist(c, g.mean);
            if (d < bestD) { bestD = d; bestIndex = i; }
        });
        return bestIndex;
    });

    return { ids, palette: groups.map(g => g.mean) };
}

/* =========================================================
   盤面サイズ n を仮定して、盤面を読み取る
========================================================= */
function evaluateGrid(imageData, bounds, n) {
    const cellColors = [];
    let purityTotal = 0;

    for (let row = 0; row < n; row++) {
        for (let col = 0; col < n; col++) {
            const cell = sampleCell(imageData, bounds, n, row, col);
            cellColors.push(cell.rgb);
            purityTotal += cell.purity;
        }
    }

    const { ids, palette } = clusterColors(cellColors);
    const board = [];
    for (let row = 0; row < n; row++) {
        board.push(ids.slice(row * n, row * n + n));
    }

    const purity = purityTotal / (n * n);
    const k = palette.length;
    // 色の安定度が高く、色数がnに近いほど高得点
    const score = purity * 100 - Math.abs(k - n) * 15;

    return { n, board, palette, purity, k, score };
}

/* =========================================================
   最適な盤面サイズを選ぶ
   このパズルは「色の数 = 盤面サイズ」なので、
   色数がnと一致し、色が安定している候補のうち一番小さいnを選ぶ
========================================================= */
function findBestGrid(imageData, bounds, fixedN) {
    if (fixedN > 0) return evaluateGrid(imageData, bounds, fixedN);

    const all = [];
    for (let n = MIN_GRID; n <= MAX_GRID; n++) {
        if (bounds.width / n < 4 || bounds.height / n < 4) continue;
        all.push(evaluateGrid(imageData, bounds, n));
    }
    if (all.length === 0) return null;

    const good = all.filter(r => r.k === r.n && r.purity >= 0.9);
    if (good.length > 0) return good[0]; // nが小さい順に並んでいるので先頭が最小

    return all.reduce((a, b) => (b.score > a.score ? b : a));
}

/* =========================================================
   表示：色
========================================================= */
function rgbCss(rgb) {
    return `rgb(${Math.round(rgb[0])},${Math.round(rgb[1])},${Math.round(rgb[2])})`;
}

function showColorList(palette) {
    colorList.innerHTML = "";
    palette.forEach((rgb, id) => {
        const item = document.createElement("div");
        item.className = "color-item";
        const dot = document.createElement("div");
        dot.className = "color-dot";
        dot.style.background = rgbCss(rgb);
        const text = document.createElement("span");
        text.textContent = `色${id}`;
        item.appendChild(dot);
        item.appendChild(text);
        colorList.appendChild(item);
    });
}

/* =========================================================
   表示：盤面（数字は色番号）
========================================================= */
function showBoard(board, palette) {
    const table = document.createElement("table");
    table.className = "board-table";
    for (const rowData of board) {
        const tr = document.createElement("tr");
        for (const id of rowData) {
            const td = document.createElement("td");
            td.textContent = id;
            td.style.background = rgbCss(palette[id]);
            tr.appendChild(td);
        }
        table.appendChild(tr);
    }
    boardContainer.innerHTML = "";
    boardContainer.appendChild(table);
}

/* =========================================================
   結果の描画（縮小した解析用画像の上に枠・線・猫を描く）
========================================================= */
function drawResult(bounds, n, solution = null) {
    const ctx = resultCanvas.getContext("2d");
    resultCanvas.width = analysisCanvas.width;
    resultCanvas.height = analysisCanvas.height;
    ctx.drawImage(analysisCanvas, 0, 0);

    const cellW = bounds.width / n;
    const cellH = bounds.height / n;

    // 外枠
    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;
    ctx.strokeRect(bounds.x, bounds.y, bounds.width, bounds.height);

    // グリッド線
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.lineWidth = 1;
    for (let i = 1; i < n; i++) {
        const x = bounds.x + cellW * i;
        const y = bounds.y + cellH * i;
        ctx.beginPath(); ctx.moveTo(x, bounds.y); ctx.lineTo(x, bounds.y + bounds.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bounds.x, y); ctx.lineTo(bounds.x + bounds.width, y); ctx.stroke();
    }

    // 解答の猫
    if (solution) {
        const size = Math.min(cellW, cellH);
        ctx.font = `${Math.max(12, size * 0.65)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let row = 0; row < solution.length; row++) {
            const col = solution[row];
            if (col < 0) continue;
            const x = bounds.x + cellW * (col + 0.5);
            const y = bounds.y + cellH * (row + 0.5);
            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.beginPath();
            ctx.arc(x, y, size * 0.36, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#111";
            ctx.fillText("🐱", x, y);
        }
    }
}

/* =========================================================
   パズルを解く
   ルール：各行に1匹／各列に1匹／各色に1匹／猫同士は斜めも含めて隣り合わない
========================================================= */
function solvePuzzle(board) {
    const n = board.length;

    // 色ごとに、置ける場所の一覧を作る
    const positionsByColor = new Map();
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            const color = board[r][c];
            if (!positionsByColor.has(color)) positionsByColor.set(color, []);
            positionsByColor.get(color).push({ row: r, col: c });
        }
    }

    // 色の数と盤面サイズが違うと解けない
    if (positionsByColor.size !== n) return null;

    // 候補が少ない色から順に試す（速くなる）
    const colors = [...positionsByColor.keys()].sort(
        (a, b) => positionsByColor.get(a).length - positionsByColor.get(b).length
    );

    const solution = new Array(n).fill(-1); // solution[行] = 列
    const usedRows = new Set();
    const usedCols = new Set();
    const placed = [];

    function safe(row, col) {
        if (usedRows.has(row) || usedCols.has(col)) return false;
        for (const p of placed) {
            if (Math.abs(row - p.row) <= 1 && Math.abs(col - p.col) <= 1) return false;
        }
        return true;
    }

    // 残りの色それぞれに、置ける場所が1つ以上あるか確認
    function forwardCheck(startIndex) {
        for (let i = startIndex; i < colors.length; i++) {
            let possible = false;
            for (const p of positionsByColor.get(colors[i])) {
                if (safe(p.row, p.col)) { possible = true; break; }
            }
            if (!possible) return false;
        }
        return true;
    }

    function dfs(index) {
        if (index >= colors.length) return true;
        for (const p of positionsByColor.get(colors[index])) {
            if (!safe(p.row, p.col)) continue;

            solution[p.row] = p.col;
            usedRows.add(p.row);
            usedCols.add(p.col);
            placed.push(p);

            if (forwardCheck(index + 1) && dfs(index + 1)) return true;

            placed.pop();
            usedRows.delete(p.row);
            usedCols.delete(p.col);
            solution[p.row] = -1;
        }
        return false;
    }

    return dfs(0) ? solution : null;
}

/* =========================================================
   解答の表示
========================================================= */
function showSolution(solution) {
    if (!solution) {
        positionsBox.textContent =
            "解答が見つかりませんでした。\n\n" +
            "考えられる原因：\n" +
            "・色の数が盤面サイズと一致していない（色が分けすぎ・まとめすぎ）\n" +
            "・盤面サイズの認識が違う（上のプルダウンで手動指定できます）\n" +
            "・盤面の範囲（赤枠）がずれている";
        return;
    }
    let text = "🐱 解答が見つかりました！\n\n";
    for (let row = 0; row < solution.length; row++) {
        text += `行 ${row + 1} → 列 ${solution[row] + 1}\n`;
    }
    positionsBox.textContent = text;
}

/* =========================================================
   解析ボタン
========================================================= */
function analyzeImage() {
    if (!originalImage) {
        setStatus("先に画像を選択してください。", "error");
        return;
    }
    setStatus("画像を解析しています……");
    analyzeBtn.disabled = true;
    solveBtn.disabled = true;

    // 画面の更新を先に行うため、少し待ってから処理する
    setTimeout(function () {
        try {
            const created = createAnalysisCanvas(originalImage);
            analysisCanvas = created.canvas;
            const imageData = created.ctx.getImageData(0, 0, created.width, created.height);

            const mask = createColorMask(imageData);
            const bounds = detectBoardBounds(created.width, created.height, mask);
            if (!bounds) throw new Error("盤面を検出できませんでした。\nゲーム画面が写っているか確認してください。");

            const fixedN = parseInt(gridSelect.value, 10);
            const grid = findBestGrid(imageData, bounds, fixedN);
            if (!grid) throw new Error("盤面サイズを判定できませんでした。");

            currentResult = {
                board: grid.board,
                palette: grid.palette,
                bounds: bounds,
                n: grid.n
            };

            boardSizeEl.textContent = `${grid.n} × ${grid.n}`;
            colorCountEl.textContent = grid.k;
            purityEl.textContent = Math.round(grid.purity * 100) + "%";

            showColorList(grid.palette);
            showBoard(grid.board, grid.palette);
            drawResult(bounds, grid.n);
            solveBtn.disabled = false;

            if (grid.k === grid.n) {
                setStatus(`解析完了！\n盤面：${grid.n} × ${grid.n}　色数：${grid.k}色`, "success");
            } else {
                setStatus(
                    `解析しましたが、色数(${grid.k})が盤面サイズ(${grid.n})と一致しません。\n` +
                    "盤面サイズを手動で指定するか、赤枠の位置を確認してください。",
                    "error"
                );
            }
        } catch (error) {
            console.error(error);
            setStatus("解析中にエラーが発生しました。\n\n" + error.message, "error");
        } finally {
            analyzeBtn.disabled = false;
        }
    }, 30);
}

/* =========================================================
   解答ボタン
========================================================= */
function solveCurrentPuzzle() {
    if (!currentResult) {
        setStatus("先に盤面を解析してください。", "error");
        return;
    }
    setStatus("解答を計算しています……");
    setTimeout(function () {
        const solution = solvePuzzle(currentResult.board);
        showSolution(solution);
        drawResult(currentResult.bounds, currentResult.n, solution);
        if (solution) {
            setStatus("解答が見つかりました！", "success");
        } else {
            setStatus("解答が見つかりませんでした。\n認識結果を確認してください。", "error");
        }
    }, 30);
}

/* =========================================================
   クリア
========================================================= */
function clearAll() {
    imageInput.value = "";
    previewImage.removeAttribute("src");
    resultCanvas.width = 1;
    resultCanvas.height = 1;
    originalImage = null;
    analysisCanvas = null;
    currentResult = null;
    analyzeBtn.disabled = true;
    solveBtn.disabled = true;
    boardSizeEl.textContent = "-";
    colorCountEl.textContent = "-";
    purityEl.textContent = "-";
    colorList.innerHTML = "";
    boardContainer.textContent = "まだ解析していません。";
    positionsBox.textContent = "まだ解答していません。";
    setStatus("画像を選択してください。");
}

analyzeBtn.addEventListener("click", analyzeImage);
solveBtn.addEventListener("click", solveCurrentPuzzle);
clearBtn.addEventListener("click", clearAll);

clearAll();
</script>
