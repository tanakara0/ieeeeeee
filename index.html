<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫パズル スクリーンショット解析 v2.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
    font-family: Arial, "Noto Sans JP", sans-serif;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    margin-top: 0;
    text-align: center;
}

.panel {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    border: 2px dashed #aaa;
    border-radius: 8px;
    background: #fafafa;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    margin: 5px;
    cursor: pointer;
    background: #333;
    color: white;
    font-size: 15px;
}

button:hover {
    opacity: 0.85;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.status {
    padding: 12px;
    border-radius: 8px;
    background: #eef2ff;
    margin-top: 12px;
    white-space: pre-wrap;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.preview-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.preview-box {
    text-align: center;
}

.preview-box img,
.preview-box canvas {
    max-width: 100%;
    max-height: 650px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #eee;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
}

.info-item {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
}

.info-label {
    font-size: 12px;
    color: #666;
}

.info-value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

.board-table {
    border-collapse: collapse;
    margin: auto;
}

.board-table td {
    width: 32px;
    height: 32px;
    text-align: center;
    border: 1px solid #999;
    font-weight: bold;
    font-size: 12px;
}

.color-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.color-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    background: #f5f5f5;
    border-radius: 6px;
    font-size: 13px;
}

.color-dot {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid #555;
}

.positions {
    font-family: monospace;
    white-space: pre-wrap;
    background: #111;
    color: #eee;
    padding: 15px;
    border-radius: 8px;
    overflow-x: auto;
}

@media (max-width: 800px) {
    .preview-area {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🐱 猫パズル スクリーンショット解析 v2.0</h1>

<div class="panel">

    <h2>① スクリーンショットを選択</h2>

    <input
        type="file"
        id="imageInput"
        accept="image/png,image/jpeg,image/jpg,image/webp"
    >

    <div>
        <button id="analyzeBtn" disabled>🔍 盤面を解析</button>
        <button id="solveBtn" disabled>🐱 解答する</button>
        <button id="clearBtn">🗑️ クリア</button>
    </div>

    <div id="status" class="status">
        画像を選択してください。
    </div>

</div>


<div class="panel">

    <h2>② 画像</h2>

    <div class="preview-area">

        <div class="preview-box">
            <h3>元画像</h3>
            <img id="previewImage">
        </div>

        <div class="preview-box">
            <h3>解析結果</h3>
            <canvas id="resultCanvas"></canvas>
        </div>

    </div>

</div>


<div class="panel">

    <h2>③ 解析情報</h2>

    <div class="info-grid">

        <div class="info-item">
            <div class="info-label">盤面サイズ</div>
            <div class="info-value" id="boardSize">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">認識色数</div>
            <div class="info-value" id="colorCount">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">認識率</div>
            <div class="info-value" id="recognitionRate">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">解析スコア</div>
            <div class="info-value" id="analysisScore">-</div>
        </div>

    </div>

</div>


<div class="panel">

    <h2>④ 認識した色</h2>

    <div id="colorList" class="color-list"></div>

</div>


<div class="panel">

    <h2>⑤ 認識した盤面</h2>

    <div id="boardContainer">
        まだ解析していません。
    </div>

</div>


<div class="panel">

    <h2>⑥ 解答</h2>

    <div id="positions" class="positions">
        まだ解答していません。
    </div>

</div>

</div>


<script>

/* =========================================================
   設定
========================================================= */

const MIN_GRID = 4;
const MAX_GRID = 20;

/*
    元プログラムで使用していた10色
*/
const GAME_COLORS = [
    {
        id: 0,
        name: "黄色",
        rgb: [232, 190, 66],
        hex: "#e8be42"
    },
    {
        id: 1,
        name: "水色",
        rgb: [75, 176, 175],
        hex: "#4bb0af"
    },
    {
        id: 2,
        name: "赤",
        rgb: [210, 112, 115],
        hex: "#d27073"
    },
    {
        id: 3,
        name: "紫",
        rgb: [146, 114, 210],
        hex: "#9272d2"
    },
    {
        id: 4,
        name: "濃いピンク",
        rgb: [235, 124, 182],
        hex: "#eb7cb6"
    },
    {
        id: 5,
        name: "薄いピンク",
        rgb: [243, 171, 201],
        hex: "#f3abc9"
    },
    {
        id: 6,
        name: "青灰色",
        rgb: [161, 188, 213],
        hex: "#a1bcd5"
    },
    {
        id: 7,
        name: "茶色",
        rgb: [178, 117, 73],
        hex: "#b27549"
    },
    {
        id: 8,
        name: "緑",
        rgb: [166, 211, 139],
        hex: "#a6d38b"
    },
    {
        id: 9,
        name: "青",
        rgb: [100, 180, 220],
        hex: "#64b4dc"
    }
];


/*
    色認識の許容値
*/
const COLOR_TOLERANCE = 95;


/*
    解析画像の最大サイズ
*/
const MAX_ANALYSIS_WIDTH = 1600;
const MAX_ANALYSIS_HEIGHT = 1600;


/* =========================================================
   DOM
========================================================= */

const imageInput = document.getElementById("imageInput");
const previewImage = document.getElementById("previewImage");
const resultCanvas = document.getElementById("resultCanvas");

const analyzeBtn = document.getElementById("analyzeBtn");
const solveBtn = document.getElementById("solveBtn");
const clearBtn = document.getElementById("clearBtn");

const statusBox = document.getElementById("status");

const boardSize = document.getElementById("boardSize");
const colorCount = document.getElementById("colorCount");
const recognitionRate = document.getElementById("recognitionRate");
const analysisScore = document.getElementById("analysisScore");

const colorList = document.getElementById("colorList");
const boardContainer = document.getElementById("boardContainer");
const positionsBox = document.getElementById("positions");


/* =========================================================
   変数
========================================================= */

let originalImage = null;
let analysisCanvas = null;
let analysisCtx = null;

let currentBoard = null;
let currentSolution = null;


/* =========================================================
   ステータス
========================================================= */

function setStatus(message, type = "") {

    statusBox.textContent = message;

    statusBox.className = "status";

    if (type === "error") {
        statusBox.classList.add("error");
    }

    if (type === "success") {
        statusBox.classList.add("success");
    }
}


/* =========================================================
   画像選択
========================================================= */

imageInput.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        setStatus(
            "画像ファイルを選択してください。",
            "error"
        );

        return;
    }

    const url = URL.createObjectURL(file);

    const img = new Image();

    img.onload = function() {

        originalImage = img;

        previewImage.src = url;

        analyzeBtn.disabled = false;
        solveBtn.disabled = true;

        currentBoard = null;
        currentSolution = null;

        boardContainer.textContent =
            "まだ解析していません。";

        positionsBox.textContent =
            "まだ解答していません。";

        resultCanvas.width = 1;
        resultCanvas.height = 1;

        setStatus(
            "画像を読み込みました。\n「盤面を解析」を押してください。",
            "success"
        );

    };

    img.onerror = function() {

        URL.revokeObjectURL(url);

        setStatus(
            "画像を読み込めませんでした。",
            "error"
        );

    };

    img.src = url;

});


/* =========================================================
   解析用キャンバス作成
========================================================= */

function createAnalysisCanvas(img) {

    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;

    const scale = Math.min(
        1,
        MAX_ANALYSIS_WIDTH / w,
        MAX_ANALYSIS_HEIGHT / h
    );

    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));

    const canvas = document.createElement("canvas");

    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext("2d", {
        willReadFrequently: true
    });

    ctx.drawImage(img, 0, 0, w, h);

    return {
        canvas,
        ctx,
        width: w,
        height: h
    };
}


/* =========================================================
   RGB距離
========================================================= */

function colorDistance(r, g, b, color) {

    const dr = r - color.rgb[0];
    const dg = g - color.rgb[1];
    const db = b - color.rgb[2];

    return Math.sqrt(
        dr * dr +
        dg * dg +
        db * db
    );
}


/* =========================================================
   最も近いゲーム色
========================================================= */

function nearestColor(r, g, b) {

    let best = null;
    let bestDistance = Infinity;

    for (const color of GAME_COLORS) {

        const d = colorDistance(
            r,
            g,
            b,
            color
        );

        if (d < bestDistance) {

            bestDistance = d;
            best = color;

        }
    }

    if (bestDistance > COLOR_TOLERANCE) {
        return null;
    }

    return {
        color: best,
        distance: bestDistance
    };
}


/* =========================================================
   色認識マスク作成
========================================================= */

function createColorMask(imageData) {

    const { width, height, data } = imageData;

    const mask = new Uint8Array(width * height);

    let count = 0;

    for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

            const i = (y * width + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const result = nearestColor(r, g, b);

            if (result) {

                mask[y * width + x] = 1;

                count++;

            }

        }

    }

    return {
        mask,
        count
    };
}


/* =========================================================
   色のある範囲を探す
========================================================= */

function detectColorBounds(imageData, maskInfo) {

    const { width, height } = imageData;
    const mask = maskInfo.mask;

    const rowCounts = new Uint32Array(height);
    const colCounts = new Uint32Array(width);

    for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

            if (mask[y * width + x]) {

                rowCounts[y]++;
                colCounts[x]++;

            }

        }

    }


    /*
        最大値
    */

    let maxRow = 0;
    let maxCol = 0;

    for (let y = 0; y < height; y++) {
        maxRow = Math.max(maxRow, rowCounts[y]);
    }

    for (let x = 0; x < width; x++) {
        maxCol = Math.max(maxCol, colCounts[x]);
    }

    if (maxRow === 0 || maxCol === 0) {
        return null;
    }


    /*
        盤面らしい行・列を探す
    */

    const rowThreshold = Math.max(
        3,
        maxRow * 0.18
    );

    const colThreshold = Math.max(
        3,
        maxCol * 0.18
    );


    let minY = height;
    let maxY = -1;

    let minX = width;
    let maxX = -1;


    for (let y = 0; y < height; y++) {

        if (rowCounts[y] >= rowThreshold) {

            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);

        }

    }


    for (let x = 0; x < width; x++) {

        if (colCounts[x] >= colThreshold) {

            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);

        }

    }


    /*
        見つからなかった場合は
        色のある全範囲を使用
    */

    if (
        minX >= maxX ||
        minY >= maxY
    ) {

        minX = width;
        minY = height;
        maxX = -1;
        maxY = -1;

        for (let y = 0; y < height; y++) {

            for (let x = 0; x < width; x++) {

                if (mask[y * width + x]) {

                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x);

                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);

                }

            }

        }

    }


    if (
        minX >= maxX ||
        minY >= maxY
    ) {
        return null;
    }


    return {
        x: minX,
        y: minY,
        width: maxX - minX + 1,
        height: maxY - minY + 1
    };
}


/* =========================================================
   1マスの色を調べる
========================================================= */

function sampleCell(
    imageData,
    bounds,
    gridSize,
    row,
    col
) {

    const { width, height, data } = imageData;

    const cellWidth = bounds.width / gridSize;
    const cellHeight = bounds.height / gridSize;


    const x0 =
        bounds.x +
        col * cellWidth;

    const y0 =
        bounds.y +
        row * cellHeight;


    /*
        中央部分だけを調べる。

        端の部分には
        枠線・隣のマス・背景などが
        入る可能性があるため。
    */

    const marginX = cellWidth * 0.25;
    const marginY = cellHeight * 0.25;

    const sx0 = Math.floor(x0 + marginX);
    const sx1 = Math.ceil(
        x0 + cellWidth - marginX
    );

    const sy0 = Math.floor(y0 + marginY);
    const sy1 = Math.ceil(
        y0 + cellHeight - marginY
    );


    const weights = new Array(
        GAME_COLORS.length
    ).fill(0);

    let recognized = 0;
    let total = 0;


    /*
        大きい画像でも重くならないように
        サンプリング間隔を調整
    */

    const step = Math.max(
        1,
        Math.floor(
            Math.min(cellWidth, cellHeight) / 12
        )
    );


    for (
        let y = sy0;
        y < sy1;
        y += step
    ) {

        for (
            let x = sx0;
            x < sx1;
            x += step
        ) {

            if (
                x < 0 ||
                x >= width ||
                y < 0 ||
                y >= height
            ) {
                continue;
            }


            const i =
                (y * width + x) * 4;


            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];


            total++;


            const result =
                nearestColor(r, g, b);


            if (!result) {
                continue;
            }


            recognized++;


            /*
                近い色ほど高い点数
            */

            const weight =
                1 -
                result.distance /
                COLOR_TOLERANCE;


            weights[result.color.id] +=
                Math.max(0, weight);
        }

    }


    if (total === 0) {
        return null;
    }


    let bestId = -1;
    let bestWeight = 0;
    let totalWeight = 0;


    for (
        let i = 0;
        i < weights.length;
        i++
    ) {

        totalWeight += weights[i];

        if (weights[i] > bestWeight) {

            bestWeight = weights[i];
            bestId = i;

        }

    }


    if (bestId < 0 || recognized === 0) {

        return {
            colorId: null,
            confidence: 0,
            recognizedRatio: 0
        };

    }


    const confidence =
        totalWeight > 0
            ? bestWeight / totalWeight
            : 0;


    const recognizedRatio =
        recognized / total;


    return {
        colorId: bestId,
        confidence,
        recognizedRatio
    };
}


/* =========================================================
   グリッド候補を調べる
========================================================= */

function evaluateGrid(
    imageData,
    bounds,
    gridSize
) {

    const cells = [];

    let totalConfidence = 0;
    let totalRecognized = 0;
    let validCells = 0;


    for (let row = 0; row < gridSize; row++) {

        const rowData = [];

        for (
            let col = 0;
            col < gridSize;
            col++
        ) {

            const result =
                sampleCell(
                    imageData,
                    bounds,
                    gridSize,
                    row,
                    col
                );


            rowData.push(result);


            if (
                result &&
                result.colorId !== null
            ) {

                validCells++;

                totalConfidence +=
                    result.confidence;

                totalRecognized +=
                    result.recognizedRatio;

            }

        }

        cells.push(rowData);
    }


    const cellCount =
        gridSize * gridSize;


    const completeness =
        validCells / cellCount;


    const averageConfidence =
        validCells > 0
            ? totalConfidence / validCells
            : 0;


    const averageRecognized =
        validCells > 0
            ? totalRecognized / validCells
            : 0;


    /*
        盤面が正方形に近いか
    */

    const aspect =
        bounds.width / bounds.height;


    const aspectScore =
        Math.max(
            0,
            1 -
            Math.abs(1 - aspect)
        );


    /*
        盤面の中に実際に色があるか
    */

    const score =
        completeness * 50 +
        averageConfidence * 30 +
        averageRecognized * 15 +
        aspectScore * 5;


    return {
        gridSize,
        cells,
        completeness,
        averageConfidence,
        averageRecognized,
        score
    };
}


/* =========================================================
   最適なグリッドサイズを探す
========================================================= */

function findBestGrid(
    imageData,
    bounds
) {

    let best = null;


    for (
        let n = MIN_GRID;
        n <= MAX_GRID;
        n++
    ) {

        const result =
            evaluateGrid(
                imageData,
                bounds,
                n
            );


        /*
            小さすぎるセルを除外
        */

        const cellWidth =
            bounds.width / n;

        const cellHeight =
            bounds.height / n;


        if (
            cellWidth < 5 ||
            cellHeight < 5
        ) {
            continue;
        }


        if (
            !best ||
            result.score > best.score
        ) {

            best = result;

        }

    }


    return best;
}


/* =========================================================
   盤面を実際の色番号に変換
========================================================= */

function convertToBoard(gridResult) {

    const board = [];

    for (
        let row = 0;
        row < gridResult.gridSize;
        row++
    ) {

        const rowData = [];

        for (
            let col = 0;
            col < gridResult.gridSize;
            col++
        ) {

            const cell =
                gridResult.cells[row][col];


            if (
                !cell ||
                cell.colorId === null
            ) {

                rowData.push(null);

            } else {

                rowData.push(cell.colorId);

            }

        }

        board.push(rowData);

    }

    return board;
}


/* =========================================================
   盤面表示
========================================================= */

function showBoard(board) {

    const table =
        document.createElement("table");

    table.className =
        "board-table";


    for (
        let r = 0;
        r < board.length;
        r++
    ) {

        const tr =
            document.createElement("tr");


        for (
            let c = 0;
            c < board[r].length;
            c++
        ) {

            const td =
                document.createElement("td");


            const id =
                board[r][c];


            if (id === null) {

                td.textContent = "?";
                td.style.background = "#ddd";

            } else {

                const color =
                    GAME_COLORS[id];

                td.textContent = id;

                td.style.background =
                    color.hex;

                td.title =
                    color.name;
            }


            tr.appendChild(td);

        }


        table.appendChild(tr);

    }


    boardContainer.innerHTML = "";

    boardContainer.appendChild(table);
}


/* =========================================================
   色一覧表示
========================================================= */

function showColorList(board) {

    const used =
        new Set();


    for (const row of board) {

        for (const id of row) {

            if (id !== null) {
                used.add(id);
            }

        }

    }


    colorList.innerHTML = "";


    for (const id of used) {

        const color =
            GAME_COLORS[id];


        const item =
            document.createElement("div");

        item.className =
            "color-item";


        const dot =
            document.createElement("div");

        dot.className =
            "color-dot";

        dot.style.background =
            color.hex;


        const text =
            document.createElement("span");

        text.textContent =
            `${id}: ${color.name}`;


        item.appendChild(dot);
        item.appendChild(text);

        colorList.appendChild(item);

    }

}


/* =========================================================
   結果画像を描画
========================================================= */

function drawResult(
    img,
    bounds,
    gridSize,
    solution = null
) {

    const canvas =
        resultCanvas;


    const ctx =
        canvas.getContext("2d");


    const scale =
        Math.min(
            1,
            1000 / img.width
        );


    canvas.width =
        Math.round(img.width * scale);

    canvas.height =
        Math.round(img.height * scale);


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const bx =
        bounds.x * scale;

    const by =
        bounds.y * scale;

    const bw =
        bounds.width * scale;

    const bh =
        bounds.height * scale;


    /*
        盤面の外枠
    */

    ctx.strokeStyle =
        "red";

    ctx.lineWidth =
        3;

    ctx.strokeRect(
        bx,
        by,
        bw,
        bh
    );


    /*
        グリッド
    */

    const cellW =
        bw / gridSize;

    const cellH =
        bh / gridSize;


    ctx.strokeStyle =
        "rgba(0,0,0,0.45)";

    ctx.lineWidth =
        1;


    for (
        let i = 1;
        i < gridSize;
        i++
    ) {

        const x =
            bx + cellW * i;

        const y =
            by + cellH * i;


        ctx.beginPath();

        ctx.moveTo(
            x,
            by
        );

        ctx.lineTo(
            x,
            by + bh
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            bx,
            y
        );

        ctx.lineTo(
            bx + bw,
            y
        );

        ctx.stroke();

    }


    /*
        解答の猫
    */

    if (solution) {

        ctx.font =
            `${Math.max(14, Math.min(cellW, cellH) * 0.65)}px sans-serif`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        for (
            let row = 0;
            row < solution.length;
            row++
        ) {

            const col =
                solution[row];


            if (col < 0) {
                continue;
            }


            const x =
                bx +
                cellW *
                (col + 0.5);

            const y =
                by +
                cellH *
                (row + 0.5);


            /*
                白い円
            */

            ctx.fillStyle =
                "rgba(255,255,255,0.85)";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                Math.min(cellW, cellH) * 0.36,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                "#111";

            ctx.fillText(
                "🐱",
                x,
                y
            );

        }

    }

}


/* =========================================================
   パズル解答
========================================================= */

/*
    ルール：

    ・各行に猫1匹
    ・各列に猫1匹
    ・同じ色につき猫1匹
    ・猫同士は上下左右斜めに隣接しない

    元プログラムのルールを維持しています。
*/

function solvePuzzle(board) {

    const n =
        board.length;


    /*
        各色について置ける場所
    */

    const positionsByColor =
        new Map();


    for (
        let r = 0;
        r < n;
        r++
    ) {

        for (
            let c = 0;
            c < n;
            c++
        ) {

            const color =
                board[r][c];


            if (color === null) {
                continue;
            }


            if (
                !positionsByColor.has(color)
            ) {

                positionsByColor.set(
                    color,
                    []
                );

            }


            positionsByColor
                .get(color)
                .push({
                    row: r,
                    col: c
                });

        }

    }


    /*
        色ごとの候補数が少ない順
    */

    const colors =
        [...positionsByColor.keys()]
        .sort(
            (a, b) =>
                positionsByColor
                    .get(a)
                    .length -
                positionsByColor
                    .get(b)
                    .length
        );


    /*
        現在の解答

        row -> col
    */

    const solution =
        new Array(n).fill(-1);


    const usedRows =
        new Set();

    const usedCols =
        new Set();


    /*
        すでに置いた猫
    */

    const placed = [];


    function adjacent(
        r1,
        c1,
        r2,
        c2
    ) {

        return (
            Math.abs(r1 - r2) <= 1 &&
            Math.abs(c1 - c2) <= 1
        );

    }


    function safe(
        row,
        col
    ) {

        if (
            usedRows.has(row)
        ) {
            return false;
        }


        if (
            usedCols.has(col)
        ) {
            return false;
        }


        for (const p of placed) {

            if (
                adjacent(
                    row,
                    col,
                    p.row,
                    p.col
                )
            ) {

                return false;

            }

        }


        return true;
    }


    /*
        前方チェック

        残っている色について
        置ける場所が最低1つあるか
    */

    function forwardCheck(
        startIndex
    ) {

        for (
            let i = startIndex;
            i < colors.length;
            i++
        ) {

            const color =
                colors[i];


            let possible =
                false;


            for (
                const p of
                positionsByColor.get(color)
            ) {

                if (
                    safe(
                        p.row,
                        p.col
                    )
                ) {

                    possible = true;
                    break;

                }

            }


            if (!possible) {
                return false;
            }

        }


        return true;
    }


    function dfs(index) {

        if (
            index >= colors.length
        ) {

            return true;

        }


        const color =
            colors[index];


        const candidates =
            positionsByColor
                .get(color);


        /*
            候補を調べる
        */

        for (const p of candidates) {

            if (
                !safe(
                    p.row,
                    p.col
                )
            ) {
                continue;
            }


            solution[p.row] =
                p.col;

            usedRows.add(
                p.row
            );

            usedCols.add(
                p.col
            );

            placed.push(p);


            if (
                forwardCheck(
                    index + 1
                ) &&
                dfs(index + 1)
            ) {

                return true;

            }


            placed.pop();

            usedRows.delete(
                p.row
            );

            usedCols.delete(
                p.col
            );

            solution[p.row] =
                -1;

        }


        return false;
    }


    /*
        猫の数が盤面サイズを超える場合は
        そもそも解けない
    */

    if (colors.length > n) {

        return null;

    }


    const solved =
        dfs(0);


    if (!solved) {
        return null;
    }


    return solution;
}


/* =========================================================
   解答表示
========================================================= */

function showSolution(
    board,
    solution
) {

    if (!solution) {

        positionsBox.textContent =
            "解答が見つかりませんでした。\n\n" +
            "考えられる原因：\n" +
            "・色の認識が間違っている\n" +
            "・盤面サイズの認識が間違っている\n" +
            "・現在設定しているルールでは解けない\n" +
            "・スクリーンショットの色が登録色と異なる";

        return;
    }


    let text =
        "🐱 解答が見つかりました！\n\n";


    for (
        let row = 0;
        row < solution.length;
        row++
    ) {

        const col =
            solution[row];


        if (col >= 0) {

            const color =
                board[row][col];


            const colorName =
                color !== null
                    ? GAME_COLORS[color].name
                    : "?";


            text +=
                `行 ${row + 1} → ` +
                `列 ${col + 1} ` +
                `(${colorName})\n`;

        }

    }


    positionsBox.textContent =
        text;
}


/* =========================================================
   メイン解析
========================================================= */

async function analyzeImage() {

    if (!originalImage) {

        setStatus(
            "先に画像を選択してください。",
            "error"
        );

        return;
    }


    setStatus(
        "画像を解析しています……"
    );


    analyzeBtn.disabled = true;
    solveBtn.disabled = true;


    try {

        /*
            解析用キャンバス
        */

        const result =
            createAnalysisCanvas(
                originalImage
            );


        analysisCanvas =
            result.canvas;

        analysisCtx =
            result.ctx;


        const imageData =
            analysisCtx.getImageData(
                0,
                0,
                result.width,
                result.height
            );


        /*
            色マスク
        */

        const maskInfo =
            createColorMask(
                imageData
            );


        if (maskInfo.count < 50) {

            throw new Error(
                "認識できる色がほとんどありませんでした。\n" +
                "ゲーム画面が画像に入っているか確認してください。"
            );

        }


        /*
            盤面範囲
        */

        const bounds =
            detectColorBounds(
                imageData,
                maskInfo
            );


        if (!bounds) {

            throw new Error(
                "盤面を検出できませんでした。"
            );

        }


        /*
            グリッドサイズ
        */

        const bestGrid =
            findBestGrid(
                imageData,
                bounds
            );


        if (!bestGrid) {

            throw new Error(
                "4×4～20×20の盤面を検出できませんでした。"
            );

        }


        /*
            盤面
        */

        const board =
            convertToBoard(
                bestGrid
            );


        currentBoard = {
            board,
            bounds,
            gridSize:
                bestGrid.gridSize,
            score:
                bestGrid.score,
            confidence:
                bestGrid.averageConfidence,
            recognized:
                bestGrid.averageRecognized
        };


        /*
            表示
        */

        boardSize.textContent =
            `${bestGrid.gridSize} × ${bestGrid.gridSize}`;


        const usedColors =
            new Set();


        let validCells = 0;

        const totalCells =
            bestGrid.gridSize *
            bestGrid.gridSize;


        for (
            const row of board
        ) {

            for (
                const id of row
            ) {

                if (id !== null) {

                    validCells++;
                    usedColors.add(id);

                }

            }

        }


        colorCount.textContent =
            usedColors.size;


        recognitionRate.textContent =
            `${Math.round(
                validCells /
                totalCells *
                100
            )}%`;


        analysisScore.textContent =
            Math.round(
                bestGrid.score
            );


        showBoard(board);
        showColorList(board);


        drawResult(
            originalImage,
            bounds,
            bestGrid.gridSize
        );


        solveBtn.disabled = false;


        setStatus(
            `解析完了！\n` +
            `盤面：${bestGrid.gridSize} × ${bestGrid.gridSize}\n` +
            `認識率：約${Math.round(validCells / totalCells * 100)}%\n` +
            `認識色数：${usedColors.size}色`,
            "success"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "解析中にエラーが発生しました。\n\n" +
            error.message,
            "error"
        );

    } finally {

        analyzeBtn.disabled = false;

    }

}


/* =========================================================
   解答ボタン
========================================================= */

function solveCurrentPuzzle() {

    if (!currentBoard) {

        setStatus(
            "先に盤面を解析してください。",
            "error"
        );

        return;
    }


    setStatus(
        "解答を計算しています……"
    );


    /*
        少し時間を空けて
        ブラウザが表示を更新できるようにする
    */

    setTimeout(() => {

        const solution =
            solvePuzzle(
                currentBoard.board
            );


        currentSolution =
            solution;


        showSolution(
            currentBoard.board,
            solution
        );


        drawResult(
            originalImage,
            currentBoard.bounds,
            currentBoard.gridSize,
            solution
        );


        if (solution) {

            setStatus(
                "解答が見つかりました！",
                "success"
            );

        } else {

            setStatus(
                "解答が見つかりませんでした。\n" +
                "認識結果を確認してください。",
                "error"
            );

        }

    }, 50);

}


/* =========================================================
   クリア
========================================================= */

function clearAll() {

    imageInput.value = "";

    previewImage.removeAttribute("src");

    resultCanvas.width = 1;
    resultCanvas.height = 1;

    currentBoard = null;
    currentSolution = null;

    originalImage = null;

    analyzeBtn.disabled = true;
    solveBtn.disabled = true;

    boardSize.textContent = "-";
    colorCount.textContent = "-";
    recognitionRate.textContent = "-";
    analysisScore.textContent = "-";

    colorList.innerHTML = "";

    boardContainer.textContent =
        "まだ解析していません。";

    positionsBox.textContent =
        "まだ解答していません。";

    setStatus(
        "画像を選択してください。"
    );

}


/* =========================================================
   ボタン
========================================================= */

analyzeBtn.addEventListener(
    "click",
    analyzeImage
);

solveBtn.addEventListener(
    "click",
    solveCurrentPuzzle
);

clearBtn.addEventListener(
    "click",
    clearAll
);


/* =========================================================
   初期状態
========================================================= */

clearAll();

</script>
